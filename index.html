<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>角色扮演 · RolePlay Chat</title>
<link rel="manifest" href="manifest-chat.json">
<meta name="theme-color" content="#000000">
<style>
*{box-sizing:border-box;}
:root{
  --bg:#121212; --panel:#1e1e1e; --panel-2:#2a2a2a; --border:#3a3a3a;
  --text:#ececec; --muted:#9e9e9e; --accent:#4d6bfe;
}
html,body{height:100%;height:100dvh;margin:0;}
body{
  background:var(--bg);color:var(--text);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;
}
button{font-family:inherit;}
.app{display:flex;height:100%;height:100dvh;}

/* ---------- 登录遮罩层 ---------- */
#auth-overlay{position:fixed;inset:0;z-index:999;background:rgba(13,15,22,0.98);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px;transition:opacity 0.3s;}
#auth-overlay.hidden{opacity:0;pointer-events:none;}
.auth-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px 24px;box-shadow:0 10px 40px rgba(0,0,0,0.5);}
.auth-card h2{font-size:20px;font-weight:600;margin:0 0 8px 0;text-align:center;}
.auth-card p{font-size:13px;color:var(--muted);text-align:center;margin:0 0 20px 0;}
.auth-card input{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:12px;font-size:14px;margin-bottom:12px;outline:none;}
.auth-card input:focus{border-color:var(--accent);}
.auth-card button{width:100%;padding:12px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;transition:0.2s;border:none;}
.btn-login{background:var(--accent);color:#fff;margin-bottom:10px;}
.btn-login:hover{filter:brightness(1.1);}
.btn-register{background:transparent;color:var(--text);border:1px solid var(--border) !important;}
.btn-register:hover{background:var(--panel-2);}
.auth-msg{font-size:12px;text-align:center;margin-top:12px;min-height:18px;}
.auth-msg.error{color:#ff8080;}
.auth-msg.success{color:#6bff8b;}

/* ---------- 侧栏 ---------- */
#sidebar{width:330px;flex:0 0 330px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;}
.side-body{flex:1;overflow-y:auto;padding:16px;}

/* 云端状态指示器 */
#cloud-status-bar {display: flex;align-items: center; justify-content: center; gap: 6px; padding: 6px 16px; font-size: 12px; color: #6b7280; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border); transition: 0.3s;}
#cloud-status-bar.online { color: #6bff8b; }
#cloud-status-bar.offline { color: #ff8080; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; }
#cloud-status-bar.online .status-dot { background: #6bff8b; box-shadow: 0 0 8px #6bff8b; }
#cloud-status-bar.offline .status-dot { background: #ff8080; box-shadow: 0 0 8px #ff8080; }

/* 会话列表样式 */
.conv-item {padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 6px; border: 1px solid transparent; transition: 0.2s; display: flex; justify-content: space-between; align-items: center;}
.conv-item:hover { background: var(--panel-2); }
.conv-item.active { background: rgba(124, 108, 255, 0.1); border-color: var(--accent); }
.conv-item .conv-name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
.conv-item .conv-delete { color: #ff8080; cursor: pointer; padding: 4px; border-radius: 4px; opacity: 0; transition: 0.2s; font-size: 12px;}
.conv-item:hover .conv-delete { opacity: 1; }
.conv-item .conv-delete:hover { background: rgba(255,128,128,0.2); }

.side-body section{margin-bottom:22px;}
.side-body h3{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600;}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 5px;}
input,textarea{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:9px 11px;font-size:13.5px;font-family:inherit;outline:none;transition:border-color .15s;}
input:focus,textarea:focus{border-color:var(--accent);}
textarea{resize:vertical;line-height:1.55;}
input[type=range]{padding:0;background:none;border:none;-webkit-appearance:none;appearance:none;height:20px;}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--border);border-radius:2px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);margin-top:-5.5px;cursor:pointer;}
.side-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-direction:column;}
.side-foot .btn{width:100%;}
.btn-logout{background:transparent;color:#ff8080;border:1px solid #ff8080;margin-top:6px;}
.btn-logout:hover{background:rgba(255,128,128,0.1);}
.btn-clear-chat{background:transparent;color:#ff8080;border:1px solid #ff8080;margin-top:6px;}
.btn-clear-chat:hover{background:rgba(255,128,128,0.1);}

/* ---------- 按钮 ---------- */
.btn{background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13.5px;transition:.15s;}
.btn:hover{border-color:var(--accent);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.sm{padding:6px 11px;font-size:12.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.icon-btn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:8px;}
.icon-btn:hover{color:var(--text);background:var(--panel-2);}

/* ---------- 聊天区 ---------- */
.chat{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:rgba(20,24,36,.72);backdrop-filter:blur(10px);}
.chat-head .title{display:flex;flex-direction:column;line-height:1.3;flex:1;min-width:0;}
.chat-head .title .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chat-head .sub{font-size:11.5px;color:var(--muted);}
.head-actions{display:flex;gap:6px;}
#menuBtn{display:none;}

#messages{flex:1;overflow-y:auto;padding:22px 18px 10px;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling: touch;overscroll-behavior-y: contain;}
.msg{display:flex;flex-direction:column;max-width:min(78%,760px);animation:pop .18s ease;}
@keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.msg.user{align-self:flex-end;}
.msg.assistant{align-self:flex-start;}
.msg .meta{font-size:11.5px;color:var(--muted);margin-bottom:5px;padding:0 4px;}
.msg.user .meta{text-align:right;}
.msg .content{padding:11px 15px;border-radius:16px;line-height:1.72;word-break:break-word;overflow-wrap:anywhere;}
.msg.user .content{background:#2a2a2a;color:#fff;border-radius:18px;border:none;}
.msg.assistant .content{background:transparent;border:1px solid var(--border);color:var(--text);}
.msg.user .content em{color:#e2e8ff;}
.err{color:#ff8080;font-size:12.5px;margin-top:8px;white-space:pre-wrap;line-height:1.5;}
.muted{color:var(--muted);}
.cursor{display:inline-block;width:7px;height:1em;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite;}
@keyframes blink{50%{opacity:0;}}

/* 消息操作栏 */
.msg-actions {display: flex;align-items: center;gap: 8px;margin-top: 4px;padding: 0 4px;font-size: 12px;color: var(--muted);opacity: 0.6;transition: opacity 0.2s;flex-wrap: wrap;}
.msg-actions:hover { opacity: 1; }
.msg.user .msg-actions { justify-content: flex-end; }
.action-btn {background: none; border: none; color: var(--muted);cursor: pointer; padding: 2px 4px; font-size: 12px; border-radius: 4px;}
.action-btn:hover { color: var(--text); background: var(--border); }
.action-btn.delete-btn { color: #ff8080; }
.action-btn.delete-btn:hover { background: rgba(255,128,128,0.15); }
.version-switcher { display: flex; align-items: center; gap: 4px; }
.version-switcher span { font-variant-numeric: tabular-nums; min-width: 28px; text-align: center; }
.version-switcher button {background: none; border: 1px solid var(--border); color: var(--muted);cursor: pointer; border-radius: 3px; padding: 0 4px;}
.version-switcher button:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.version-switcher button:disabled { opacity: 0.3; cursor: not-allowed; }
.token-display {font-family: monospace; font-size: 11px; color: #6b7280;background: rgba(0,0,0,0.2); padding: 1px 6px; border-radius: 4px; margin-left: auto;}

.composer{display:flex;gap:10px;align-items:flex-end;padding:12px 16px 16px;padding-bottom: calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--panel);}
#input{flex:1;resize:none;max-height:180px;min-height:44px;line-height:1.55;padding:11px 14px;border-radius:12px;overflow-y:auto;}
#sendBtn{height:44px;padding:0 22px;border-radius:12px;background:var(--accent);border:none;color:#fff;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s;}
#sendBtn:hover{filter:brightness(1.1);}
#sendBtn.stop{background:#e05252;}

#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none;}

/* 热更新提示框 */
#update-toast {position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1c2130; border: 1px solid var(--accent); border-radius: 12px; padding: 14px 20px; display: none; align-items: center; gap: 16px; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: slideUp 0.3s ease;}
@keyframes slideUp { from { bottom: -50px; opacity: 0; } to { bottom: 20px; opacity: 1; } }
#update-toast span { font-size: 14px; color: #fff; }
#update-toast button { padding: 8px 16px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }

/* 【新增】角色设定弹窗面板 */
#char-settings-modal {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center;
    padding: 20px; transition: opacity 0.3s;
}
#char-settings-modal.show { display: flex; }
.char-settings-card {
    width: 100%; max-width: 500px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    max-height: 90vh; display: flex; flex-direction: column;
}
.char-settings-card h3 { font-size: 18px; margin: 0 0 16px 0; font-weight: 600; }
.char-settings-card .form-group { margin-bottom: 14px; }
.char-settings-card label { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: block; }
.char-settings-card textarea { min-height: 80px; }
.char-settings-card .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }

@media(max-width:860px){
  #menuBtn{display:block;}
  #sidebar{position:fixed;top:0;bottom:0;left:0;z-index:50;width:min(88vw,340px);flex-basis:auto;transform:translateX(-100%);transition:transform .25s ease;}
  body.side-open #sidebar{transform:none;}
  body.side-open #backdrop{display:block;}
  .msg{max-width:90%;}
  input, textarea { font-size: 16px !important; }
  .btn.sm { padding: 10px 14px; font-size: 13.5px; }
}
@media(max-width:640px){
  #exportBtn{display:none;}
  #messages{padding:16px 12px 8px;}
  .composer{padding:10px 12px 12px;padding-bottom: calc(12px + env(safe-area-inset-bottom));}
}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#2a3040;border-radius:5px;}
::-webkit-scrollbar-thumb:hover{background:#3a4256;}
::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>

<!-- 【新增】错误监控面板 -->
<div id="debug-overlay" style="display:none; position:fixed; inset:0; z-index:9999; background:#000; color:#ff8080; padding:20px; overflow:auto; font-family:monospace; white-space:pre-wrap; font-size:14px;"></div>
<script>
  window.onerror = function(message, source, lineno, colno, error) {
    var debug = document.getElementById('debug-overlay');
    if (debug) { debug.style.display = 'block'; debug.textContent += '【错误】' + message + '\n位置: ' + source + ':' + lineno + ':' + colno + '\n\n'; }
  };
  window.addEventListener('unhandledrejection', function(event) {
    var debug = document.getElementById('debug-overlay');
    if (debug) { debug.style.display = 'block'; debug.textContent += '【Promise错误】' + (event.reason ? event.reason.message || JSON.stringify(event.reason) : '未知') + '\n\n'; }
  });
</script>

<div id="auth-overlay" class="hidden">
  <div class="auth-card">
    <h2 id="auth-title">欢迎回来</h2>
    <p id="auth-subtitle">登录以同步您的角色与聊天记录</p>
    <input type="email" id="auth-email" placeholder="邮箱地址" autocomplete="email">
    <input type="password" id="auth-password" placeholder="密码（至少6位）" autocomplete="current-password">
    <button class="btn-login" id="auth-login-btn">登录</button>
    <button class="btn-register" id="auth-register-btn">没有账号？点击注册</button>
    <div class="auth-msg" id="auth-msg"></div>
  </div>
</div>

<div class="app">
  <aside id="sidebar">
    <div class="side-head">
      <span>多角色会话</span>
      <button class="icon-btn" id="closeSide" title="关闭">✕</button>
    </div>
    
    <!-- 云端连接状态指示器 -->
    <div id="cloud-status-bar" class="online">
        <span class="status-dot"></span>
        <span id="cloud-status-text">云端已连接</span>
    </div>

    <div style="padding: 10px 16px; border-bottom: 1px solid var(--border);">
      <button class="btn primary" id="newConvBtn" style="width:100%;">➕ 新建角色对话</button>
    </div>

    <div class="side-body">
      <section>
        <h3>我的会话</h3>
        <div id="conversationListContainer"></div>
      </section>

      <section style="border-top: 1px solid var(--border); padding-top: 16px;">
        <h3>全局接口配置</h3>
        <label>API 地址（Base URL）</label>
        <input id="apiBase" placeholder="https://api.openai.com/v1" spellcheck="false">
        <label>API Key</label>
        <input id="apiKey" type="password" placeholder="sk-..." spellcheck="false">
        <label>模型名</label>
        <div style="display:flex; gap:6px; align-items:center;">
          <input id="model" placeholder="gpt-4o-mini" spellcheck="false" style="flex:1;">
          <button class="btn sm" id="fetchModelsBtn" style="white-space:nowrap;">获取</button>
        </div>
        <div id="modelListContainer" style="display:none; margin-top:8px; max-height:150px; overflow-y:auto; background:var(--panel-2); border:1px solid var(--border); border-radius:9px; padding:4px;"></div>
        
        <label>温度 <span id="tempVal">0.85</span></label>
        <input id="temperature" type="range" min="0" max="2" step="0.05" value="0.85">
        <label>单次最大回复长度（tokens）</label>
        <input id="maxTokens" type="number" min="64" max="32000" step="64">
        <label>上下文保留条数</label>
        <input id="ctxLimit" type="number" min="4" max="200" step="2">
      </section>

      <section style="border-top: 1px solid var(--border); padding-top: 16px;">
        <h3>你的设定</h3>
        <label>你的名字</label>
        <input id="userName" spellcheck="false">
        <label>你的人设（可留空）</label>
        <textarea id="userPrompt" rows="3" spellcheck="false"></textarea>
      </section>
    </div>

    <div class="side-foot">
      <button class="btn primary" id="applyBtn">保存全局设置</button>
      <button class="btn btn-clear-chat" id="clearChatBtn">清空当前会话记录</button>
      <button class="btn btn-logout" id="logoutBtn">退出登录</button>
    </div>
  </aside>

  <div id="backdrop"></div>

  <main class="chat">
    <header class="chat-head">
      <button class="icon-btn" id="menuBtn" title="设置/会话列表">☰</button>
      <div class="title">
        <span class="n" id="headName">角色</span>
        <span class="sub">角色扮演对话</span>
      </div>
      <div class="head-actions">
        <button class="btn sm" id="openCharSettingsBtn">🎭 角色设定</button>
        <button class="btn sm" id="exportBtn">导出</button>
      </div>
    </header>

    <div id="messages"></div>

    <div class="composer">
      <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="sendBtn">发送</button>
    </div>
  </main>
</div>

<!-- 【新增】角色设定弹窗 -->
<div id="char-settings-modal">
    <div class="char-settings-card">
        <h3>🎭 角色设定（仅对当前对话生效）</h3>
        <div class="form-group">
            <label>角色名</label>
            <input id="modalCharName" spellcheck="false">
        </div>
        <div class="form-group">
            <label>角色人设 / 世界观</label>
            <textarea id="modalCharPrompt" rows="4" spellcheck="false"></textarea>
        </div>
        <div class="form-group">
            <label>开场白</label>
            <textarea id="modalGreeting" rows="2" spellcheck="false"></textarea>
        </div>
        <div class="actions">
            <button class="btn" id="cancelCharSettingsBtn">取消</button>
            <button class="btn primary" id="saveCharSettingsBtn">保存设定</button>
        </div>
    </div>
</div>

<!-- 热更新提示框 -->
<div id="update-toast">
    <span>✨ 发现新版本，是否更新？</span>
    <button id="update-confirm-btn">立即更新</button>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
/* ---------- Supabase 初始化 ---------- */
const SUPABASE_URL = 'https://bpkipmnvvrjsfckzhfrl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_K5hZV5mkiX0GHchcYIr7dQ_Z7ICn1mu';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------- 全局变量集中声明 ---------- */
const $ = s => document.querySelector(s);
const msgBox = $('#messages');
const inputEl = $('#input');
let USER_ID = null;
let currentConversationId = null;
let cfg = {};
let msgs = [];
let busy = false;
let abortCtrl = null;
let hasBoundEvents = false;
let currentLoadedUserId = null;
let isRegisterMode = false;

/* ---------- 全局默认配置 ---------- */
const DEFAULTS = {
  apiBase: '', apiKey: '', model: '', temperature: 0.85, maxTokens: 1024, ctxLimit: 30,
  userName: '旅人', userPrompt: '一个刚搬来这座城市的人，喜欢在傍晚散步。'
};
const CFG_KEYS = ['apiBase','apiKey','model','temperature','maxTokens','ctxLimit','userName','userPrompt'];

/* ---------- 工具函数 ---------- */
function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function renderContent(s){
  let h = escapeHtml(s || '');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // h = h.replace(/\*(.+?)\*/g, '<em>$1</em>'); // 【已删除】不再让星号动作变色
  h = h.replace(/\n/g, '<br>');
  return h;
}
function autoResize(){ inputEl.style.height = 'auto'; inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px'; }

/* ---------- 云端连接状态监控 ---------- */
function updateCloudStatusUI(isOnline) {
    const bar = $('#cloud-status-bar');
    const text = $('#cloud-status-text');
    if (isOnline) { bar.className = 'online'; text.textContent = '云端已连接'; }
    else { bar.className = 'offline'; text.textContent = '云端未连接，数据可能无法同步'; }
}

setInterval(async () => {
    if (!USER_ID) return;
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);
        const { error } = await supabaseClient.from('agent_settings').select('id').limit(1).abortSignal(controller.signal);
        clearTimeout(timeoutId);
        if (error) throw error;
        updateCloudStatusUI(true);
    } catch (e) { updateCloudStatusUI(false); }
}, 60000);

/* ---------- 配置读写 ---------- */
function loadCfg(){
  if(!USER_ID) return Object.assign({}, DEFAULTS);
  try{
    const raw = localStorage.getItem('rp_cfg_' + USER_ID);
    return raw ? Object.assign({}, DEFAULTS, JSON.parse(raw)) : Object.assign({}, DEFAULTS);
  }catch(e){ return Object.assign({}, DEFAULTS); }
}
function saveCfg(){
  if(!USER_ID) return;
  try{ localStorage.setItem('rp_cfg_' + USER_ID, JSON.stringify(cfg)); }catch(e){}
}

/* ---------- 云端：全局配置读写（带防崩溃降级） ---------- */
async function fetchGlobalSettings() {
    if (!USER_ID) return false;
    try {
        const { data, error } = await supabaseClient
            .from('agent_settings')
            .select('api_base, api_key, model, temperature, max_tokens, ctx_limit, user_name, user_prompt')
            .eq('id', USER_ID).maybeSingle();

        if (error) {
            console.warn('⚠️ 全局配置拉取失败，将使用本地默认配置:', error.message);
            updateCloudStatusUI(false); updateGlobalUI(); return false;
        }

        if (data) {
            console.log('✅ 成功从 Supabase 获取全局配置');
            if (data.api_base) cfg.apiBase = data.api_base;
            if (data.api_key) cfg.apiKey = data.api_key;
            if (data.model) cfg.model = data.model;
            if (data.temperature !== null && data.temperature !== undefined) cfg.temperature = data.temperature;
            if (data.max_tokens !== null && data.max_tokens !== undefined) cfg.maxTokens = data.max_tokens;
            if (data.ctx_limit !== null && data.ctx_limit !== undefined) cfg.ctxLimit = data.ctx_limit;
            if (data.user_name) cfg.userName = data.user_name;
            if (data.user_prompt) cfg.userPrompt = data.user_prompt;
            saveCfg(); updateGlobalUI(); updateCloudStatusUI(true); return true;
        } else {
            try {
                await supabaseClient.from('agent_settings').insert({
                    id: USER_ID, api_base: cfg.apiBase, api_key: cfg.apiKey, model: cfg.model,
                    temperature: Number(cfg.temperature), max_tokens: Number(cfg.maxTokens), ctx_limit: Number(cfg.ctxLimit),
                    user_name: cfg.userName, user_prompt: cfg.userPrompt
                });
            } catch (insertErr) { console.warn('写入默认全局配置失败:', insertErr.message); }
            updateGlobalUI(); return false;
        }
    } catch (e) { console.error('❌ 全局配置请求异常:', e); updateCloudStatusUI(false); updateGlobalUI(); }
    return false;
}

async function deleteConversation(convId) {

/* ---------- 云端：消息读写 ---------- */
async function saveMessageToCloud(msg) {
    if (!USER_ID || !currentConversationId) return;
    try {
        const payload = { user_id: USER_ID, conversation_id: currentConversationId, local_id: msg.local_id, role: msg.role, content: msg.content, versions: msg.versions || null, current_version: msg.currentVersion || 0, tokens: msg.tokens || null };
        const { error } = await supabaseClient.from('chat_messages').upsert(payload, { onConflict: 'local_id' });
        if (error) { console.error('❌ 消息同步到云端失败:', error.message); updateCloudStatusUI(false); }
        else updateCloudStatusUI(true);
    } catch (e) { console.error('❌ 消息同步异常:', e); updateCloudStatusUI(false); }
}

async function loadMessagesFromCloud() {
    if (!USER_ID || !currentConversationId) return [];
    try {
        const { data, error } = await supabaseClient.from('chat_messages').select('role, content, versions, current_version, local_id, tokens, created_at').eq('user_id', USER_ID).eq('conversation_id', currentConversationId).order('created_at', { ascending: false }).limit(300);
        if (error) { console.warn('⚠️ 拉取聊天记录失败:', error.message); updateCloudStatusUI(false); return []; }
        return data.reverse().map(d => {
            const msg = { role: d.role, content: d.content, local_id: d.local_id || generateId(), tokens: d.tokens || null };
            if (d.role === 'assistant') { msg.versions = d.versions || [d.content]; msg.currentVersion = d.current_version || 0; }
            return msg;
        });
    } catch (e) { console.error('❌ 拉取聊天记录异常:', e); updateCloudStatusUI(false); return []; }
}
/* ---------- 刷新当前聊天界面的函数 ---------- */
async function refreshCurrentChat() {
    if (busy || !currentConversationId) return; // 如果正在打字，先不打断
    const cloudMsgs = await loadMessagesFromCloud();
    // 如果云端记录比本地多或相等，则覆盖渲染
    if (cloudMsgs.length >= msgs.length) {
        msgs = cloudMsgs;
        msgBox.innerHTML = '';
        msgs.forEach((m, i) => addBubble(m.role, m.content, i, m.tokens));
        scrollBottom(true);
    }
}

/* ---------- 建立 Realtime 实时监听 ---------- */
let realtimeChannel = null;
function setupRealtimeListener() {
    if (!USER_ID) return;
    // 如果之前有监听，先移除
    if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);

    realtimeChannel = supabaseClient
        .channel('public:chat_messages')
        .on('postgres_changes', 
            { event: '*', schema: 'public', table: 'chat_messages', filter: `user_id=eq.${USER_ID}` }, 
            (payload) => {
                // 只有当手机端发来的新消息属于当前电脑端正在看的会话时，才去刷新
                if (payload.new && payload.new.conversation_id === currentConversationId) {
                    refreshCurrentChat();
                }
            }
        )
        .subscribe((status) => {
            if (status === 'SUBSCRIBED') {
                console.log('📡 实时同步已开启');
            }
        });
}

/* ---------- 切换会话（彻底修复必须手动切换才显示的问题） ---------- */
let isFetchingMessages = false;
async function switchConversation(convId) {
    if (busy) { alert('请等待当前回复生成完成后再切换。'); return; }
    // 【核心修复】如果 ID 相同且已经有消息了，才跳过；如果 ID 相同但没有消息（首次进入），必须继续加载！
    if (currentConversationId === convId && msgs.length > 0) return; 
    if (isFetchingMessages) return; 
    
    isFetchingMessages = true;
    currentConversationId = convId; // 在这里赋值
    const conv = { id: convId };
    const el = document.querySelector(`.conv-item[data-id="${convId}"]`);
    if (el) conv.agent_name = el.querySelector('.conv-name').textContent;
    
    updateCurrentConversationUI(conv);
    
    msgBox.innerHTML = '<div class="muted" style="text-align:center;margin:auto;font-size:13px;">正在加载聊天记录...</div>';
    
    try {
        let cloudMsgs = await loadMessagesFromCloud();
        if (cloudMsgs.length > 0) {
            msgs = cloudMsgs;
            msgBox.innerHTML = '';
            msgs.forEach((m, i) => addBubble(m.role, m.content, i, m.tokens));
        } else {
            msgBox.innerHTML = '';
            const greetingText = $('#modalGreeting').value.trim();
            if (greetingText) {
                const aiMsg = { role: 'assistant', content: greetingText, versions: [greetingText], currentVersion: 0, local_id: generateId() };
                msgs = [aiMsg]; 
                addBubble('assistant', greetingText, 0); 
                await saveMessageToCloud(aiMsg);
            } else {
                msgBox.innerHTML = '<div class="muted" style="text-align:center;margin:auto;font-size:13px;">发送一条消息开始对话吧。</div>';
            }
        }
    } catch (e) {
        console.error("切换会话加载异常:", e);
        msgBox.innerHTML = '<div class="err">加载失败，请检查网络。</div>';
    } finally {
        isFetchingMessages = false; 
        scrollBottom(true);
    }
}

/* ---------- 消息渲染与版本控制 ---------- */
function updateVersionSwitcher(index, msg) {
    const msgRow = msgBox.querySelector(`.msg[data-msg-index="${index}"]`);
    if (!msgRow) return;
    const actionsDiv = msgRow.querySelector('.msg-actions');
    if (!actionsDiv) return;
    const oldSwitcher = actionsDiv.querySelector('.version-switcher');
    if (oldSwitcher) oldSwitcher.remove();

    if (msg.versions && msg.versions.length > 1) {
        const switcher = document.createElement('div');
        switcher.className = 'version-switcher';
        switcher.innerHTML = `
            <button class="version-btn" data-msg-index="${index}" data-direction="-1" ${msg.currentVersion === 0 ? 'disabled' : ''}>&lt;</button>
            <span>${msg.currentVersion + 1}/${msg.versions.length}</span>
            <button class="version-btn" data-msg-index="${index}" data-direction="1" ${msg.currentVersion === msg.versions.length - 1 ? 'disabled' : ''}>&gt;</button>
        `;
        const regenBtn = actionsDiv.querySelector('.regen-btn');
        if (regenBtn) actionsDiv.insertBefore(switcher, regenBtn);
        else actionsDiv.appendChild(switcher);
    }
}

function addBubble(role, content, index = null, tokens = null){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  if (index !== null) wrap.setAttribute('data-msg-index', index);
  const name = role === 'user' ? (cfg.userName || '你') : ($('#headName').textContent || '角色');
  
  let actionsHtml = '';
  if (role === 'assistant') actionsHtml += `<button class="action-btn regen-btn" data-msg-index="${index}">重新生成</button>`;
  else actionsHtml += `<button class="action-btn edit-btn" data-msg-index="${index}">编辑</button>`;
  actionsHtml += `<button class="action-btn delete-btn" data-msg-index="${index}">删除</button>`;
  
  let tokenHtml = '';
  if (tokens) tokenHtml = `<span class="token-display" title="完成 Token: ${tokens.completion_tokens || 0} / 总 Token: ${tokens.total_tokens || 0}">T: ${tokens.total_tokens || 0}</span>`;

  wrap.innerHTML = `<div class="meta">${escapeHtml(name)}</div><div class="content"></div><div class="msg-actions">${actionsHtml}${tokenHtml}</div>`;
  wrap.querySelector('.content').innerHTML = renderContent(content);
  msgBox.appendChild(wrap);

  if (role === 'assistant' && index !== null) {
      const msg = msgs[index];
      if (msg && msg.versions) updateVersionSwitcher(index, msg);
  }
  scrollBottom(true);
  return wrap;
}

function scrollBottom(force){
  if(!force){
    const near = msgBox.scrollHeight - msgBox.scrollTop - msgBox.clientHeight < 160;
    if(!near) return;
  }
  msgBox.scrollTop = msgBox.scrollHeight;
}

/* ---------- 请求构造与流式接收 ---------- */
function endpoint(){
  let base = String(cfg.apiBase || '').trim().replace(/\/+$/, '');
  if(!base) throw new Error('请先在左侧填写 API 地址');
  if(/\/chat\/completions$/i.test(base)) return base;
  return base + '/chat/completions';
}

function systemPrompt(){
  const promptText = $('#modalCharPrompt').value.trim();
  const charName = $('#modalCharName').value.trim() || '角色';
  const parts = [];
  parts.push('你正在进行沉浸式的角色扮演对话。请始终保持角色，用第一人称自然地说话，不要以 AI 助手的身份回应，不要解释规则，不要跳出角色。');
  parts.push('【你的角色】' + charName + (promptText ? '\n' + promptText : ''));
  parts.push('【对话对象】' + (cfg.userName || '用户') + (cfg.userPrompt ? '\n' + cfg.userPrompt : ''));
  parts.push('动作、神态、环境描写用 *星号* 包裹。回复长度贴合语境，像真人聊天一样自然。');
  return parts.join('\n\n');
}

function buildMessages(contextMsgs){
  const limit = Math.max(2, Number(cfg.ctxLimit) || 30);
  const hist = contextMsgs.slice(-limit).map(m => ({role: m.role, content: m.content}));
  return [{role:'system', content: systemPrompt()}].concat(hist);
}

async function fetchAIResponseStreaming(contextMsgs, onProgress) {
  const payload = { model: cfg.model, messages: buildMessages(contextMsgs), temperature: Number(cfg.temperature), max_tokens: Number(cfg.maxTokens), stream: true, stream_options: { include_usage: true } };
  const res = await fetch(endpoint(), {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (cfg.apiKey || '') },
    body: JSON.stringify(payload)
  });
  if(!res.ok){ const txt = await res.text().catch(() => ''); throw new Error('HTTP ' + res.status + ' ' + res.statusText + (txt ? '\n' + txt.slice(0, 500) : '')); }
  if(!res.body) throw new Error('该接口未返回可读流');

  const reader = res.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let full = '', buf = '', usage = null;

  while(true){
    const {done, value} = await reader.read();
    if(done) break;
    buf += decoder.decode(value, {stream: true});
    const lines = buf.split('\n');
    buf = lines.pop();
    for(const raw of lines){
      const line = raw.trim();
      if(!line || line.startsWith(':') || !line.startsWith('data:')) continue;
      const data = line.slice(5).trim();
      if(data === '[DONE]') continue;
      let json; try{ json = JSON.parse(data); }catch(e){ continue; }
      if (json.usage) usage = json.usage;
      const choice = json.choices && json.choices[0];
      if(!choice) continue;
      const delta = (choice.delta && choice.delta.content) ?? (choice.message && choice.message.content) ?? '';
      if(delta) { full += delta; if (onProgress) onProgress(full); }
    }
  }
  return { full, usage };
}

/* ---------- 核心业务：发送与生成 ---------- */
async function send(){
  if(busy || !currentConversationId) return;
  const input = $('#input');
  const text = input.value.trim();
  if(!text) return;
  input.value = ''; autoResize();

  const userMsg = { role: 'user', content: text, local_id: generateId() };
  msgs.push(userMsg); addBubble('user', text, msgs.length - 1); await saveMessageToCloud(userMsg);
  await generateAIResponse(msgs.slice(0, -1).concat(userMsg));
}

async function generateAIResponse(contextMsgs) {
  busy = true; setBusyUI(true);
  const bubble = addBubble('assistant', '');
  const contentEl = bubble.querySelector('.content');
  contentEl.innerHTML = '<span class="cursor"></span>';

  const aiMsg = { role: 'assistant', content: '', versions: [''], currentVersion: 0, local_id: generateId(), tokens: null };
  msgs.push(aiMsg);
  const idx = msgs.length - 1;
  bubble.setAttribute('data-msg-index', idx);
  bubble.querySelectorAll('.action-btn').forEach(btn => btn.setAttribute('data-msg-index', idx));
  await saveMessageToCloud(aiMsg);

  let lastCloudSave = 0;
  try {
    const { full, usage } = await fetchAIResponseStreaming(contextMsgs, (partialText) => {
        contentEl.innerHTML = renderContent(partialText) + '<span class="cursor"></span>';
               if (partialText.length > (aiMsg.lastSavedLength || 0) && Date.now() - lastCloudSave > 2000) {
            saveMessageToCloud(aiMsg);
            lastCloudSave = Date.now();
            aiMsg.lastSavedLength = partialText.length;
        }
        if (Date.now() - lastCloudSave > 1000) { saveMessageToCloud(aiMsg); lastCloudSave = Date.now(); }
    });
    if(full.trim()){
      contentEl.innerHTML = renderContent(full);
      aiMsg.content = full; aiMsg.versions = [full]; aiMsg.tokens = usage ? usage.total_tokens : null;
      if (usage) {
          const tokenSpan = document.createElement('span');
          tokenSpan.className = 'token-display';
          tokenSpan.title = `完成 Token: ${usage.completion_tokens || 0} / 总 Token: ${usage.total_tokens || 0}`;
          tokenSpan.textContent = `T: ${usage.total_tokens || 0}`;
          bubble.querySelector('.msg-actions').appendChild(tokenSpan);
      }
    } else { contentEl.innerHTML = '<span class="muted">（模型返回了空内容）</span>'; aiMsg.content = '（模型返回了空内容）'; aiMsg.versions = [aiMsg.content]; }
  } catch(err) {
    contentEl.innerHTML = renderContent(aiMsg.content || '') + '<div class="err">请求中断或失败：' + escapeHtml(err.message) + '</div>';
    if (!aiMsg.content) aiMsg.content = '（请求失败）'; aiMsg.versions = [aiMsg.content];
  } finally {
    await saveMessageToCloud(aiMsg);
    busy = false; setBusyUI(false);
  }
}

async function regenerateMessage(index) {
  if (busy) return;
  const msg = msgs[index];
  if (!msg || msg.role !== 'assistant') return;
  let userMsgContext = [];
  for (let i = index - 1; i >= 0; i--) { if (msgs[i].role === 'user') { userMsgContext = msgs.slice(0, i + 1); break; } }
  if (userMsgContext.length === 0) return;

  busy = true; setBusyUI(true);
  const msgRow = msgBox.querySelector(`.msg[data-msg-index="${index}"]`);
  const contentEl = msgRow.querySelector('.content');
  const originalContent = contentEl.innerHTML;
  contentEl.innerHTML = '<span class="cursor"></span>';

  let lastCloudSave = 0;
  try {
    const { full, usage } = await fetchAIResponseStreaming(userMsgContext, (partialText) => {
        contentEl.innerHTML = renderContent(partialText) + '<span class="cursor"></span>';
        msg.content = partialText; msg.versions = msg.versions || [msg.content];
               if (partialText.length > (msg.lastSavedLength || 0) && Date.now() - lastCloudSave > 2000) {
            saveMessageToCloud(msg);
            lastCloudSave = Date.now();
            msg.lastSavedLength = partialText.length;
        }
        if (Date.now() - lastCloudSave > 1000) { saveMessageToCloud(msg); lastCloudSave = Date.now(); }
    });
    if (full.trim()) {
      if (!msg.versions) { msg.versions = [msg.content]; msg.currentVersion = 0; }
      msg.versions.push(full); msg.currentVersion = msg.versions.length - 1; msg.content = full; msg.tokens = usage ? usage.total_tokens : null;
      contentEl.innerHTML = renderContent(full);
      const oldToken = msgRow.querySelector('.token-display'); if (oldToken) oldToken.remove();
      if (usage) {
          const tokenSpan = document.createElement('span'); tokenSpan.className = 'token-display';
          tokenSpan.title = `完成 Token: ${usage.completion_tokens || 0} / 总 Token: ${usage.total_tokens || 0}`;
          tokenSpan.textContent = `T: ${usage.total_tokens || 0}`; msgRow.querySelector('.msg-actions').appendChild(tokenSpan);
      }
      updateVersionSwitcher(index, msg);
    } else { contentEl.innerHTML = originalContent; }
  } catch(e) { contentEl.innerHTML = originalContent + '<div class="err">重新生成失败：' + escapeHtml(e.message) + '</div>'; }
  finally { await saveMessageToCloud(msg); busy = false; setBusyUI(false); }
}

function switchVersion(index, direction) {
  const msg = msgs[index];
  if (!msg || !msg.versions || msg.versions.length <= 1) return;
  let newVer = msg.currentVersion + direction;
  if (newVer < 0 || newVer >= msg.versions.length) return;
  msg.currentVersion = newVer; msg.content = msg.versions[newVer];
  const msgRow = msgBox.querySelector(`.msg[data-msg-index="${index}"]`);
  if (msgRow) { contentEl.innerHTML = renderContent(msg.content); updateVersionSwitcher(index, msg); }
  saveMessageToCloud(msg);
}

function editUserMessage(index) {
  if (busy) return;
  const msg = msgs[index];
  if (!msg || msg.role !== 'user') return;
  const newContent = prompt('编辑消息:', msg.content);
  if (newContent === null || newContent.trim() === '' || newContent === msg.content) return;
  msgs = msgs.slice(0, index + 1); msg.content = newContent;
  msgBox.innerHTML = ''; msgs.forEach((m, i) => addBubble(m.role, m.content, i, m.tokens));
  generateAIResponse(msgs.slice(0, index + 1));
}

async function deleteMessage(index) {
    if (busy) return;
    if (!confirm('确定要删除这条消息吗？删除后无法恢复。')) return;
    const msg = msgs[index];
    if (!msg) return;
    msgs.splice(index, 1); msgBox.innerHTML = ''; msgs.forEach((m, i) => addBubble(m.role, m.content, i, m.tokens));
    if (USER_ID && msg.local_id) await supabaseClient.from('chat_messages').delete().eq('local_id', msg.local_id);
}

function setBusyUI(b){
  const btn = $('#sendBtn'); 
  if(btn) { btn.textContent = b ? '停止' : '发送'; btn.classList.toggle('stop', b); }
  const newBtn = $('#newBtn'); 
  if(newBtn) newBtn.disabled = b; // 【修复】安全判断，防止因按钮不存在而崩溃
}
/* ---------- 事件绑定与热更新机制 ---------- */
function bindEvents(){
  if (hasBoundEvents) return;
  hasBoundEvents = true;

  $('#sendBtn').addEventListener('click', () => { if(busy){ abortCtrl && abortCtrl.abort(); return; } send(); });
  inputEl.addEventListener('input', autoResize);
  inputEl.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); if(!busy) send(); } });

  $('#exportBtn').addEventListener('click', () => {
      if(!msgs.length){ alert('还没有对话内容'); return; }
      const nameOf = r => r === 'user' ? (cfg.userName || '我') : ($('#headName').textContent || '角色');
      const text = msgs.map(m => nameOf(m.role) + '：\n' + m.content).join('\n\n---\n\n');
      const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = ($('#headName').textContent || 'chat') + '-' + new Date().toISOString().slice(0,10) + '.txt'; a.click();
  });
  
  $('#clearChatBtn').addEventListener('click', async () => {
      if(!confirm('确定要清空当前会话的聊天记录吗？此操作不可恢复。')) return;
      msgs = []; msgBox.innerHTML = '';
      if (USER_ID && currentConversationId) await supabaseClient.from('chat_messages').delete().eq('conversation_id', currentConversationId);
  });

  $('#menuBtn').addEventListener('click', () => document.body.classList.add('side-open'));
  $('#closeSide').addEventListener('click', () => document.body.classList.remove('side-open'));
  $('#backdrop').addEventListener('click', () => document.body.classList.remove('side-open'));

  // 获取模型列表
  $('#fetchModelsBtn').addEventListener('click', async () => {
    const btn = $('#fetchModelsBtn'); const modelListContainer = $('#modelListContainer');
    const apiBase = $('#apiBase').value.trim(); const apiKey = $('#apiKey').value.trim();
    if (!apiBase) { alert('请先填写 API 地址！'); return; }
    let baseUrl = apiBase.replace(/\/+$/, ''); if (baseUrl.endsWith('/chat/completions')) baseUrl = baseUrl.replace('/chat/completions', ''); if (!baseUrl.endsWith('/v1')) baseUrl += '/v1';
    btn.textContent = '获取中...'; btn.disabled = true; modelListContainer.style.display = 'none'; modelListContainer.innerHTML = '';
    try {
      const res = await fetch(baseUrl + '/models', { method: 'GET', headers: { 'Authorization': 'Bearer ' + apiKey } });
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
      const data = await res.json(); const models = Array.isArray(data) ? data : (data.data || []);
      if (models.length === 0) { modelListContainer.innerHTML = '<div style="padding:8px; font-size:12px; color:#ff8080;">未找到任何模型。</div>'; modelListContainer.style.display = 'block'; return; }
      models.forEach(m => {
        const modelId = m.id || m.model || m.name || String(m);
        const item = document.createElement('div'); item.textContent = modelId;
        item.style.cssText = 'padding:6px 10px; font-size:13px; cursor:pointer; border-radius:4px;';
        item.onmouseover = () => item.style.background = 'var(--border)'; item.onmouseout = () => item.style.background = 'transparent';
        item.onclick = () => { $('#model').value = modelId; cfg.model = modelId; saveCfg(); modelListContainer.style.display = 'none'; };
        modelListContainer.appendChild(item);
      });
      modelListContainer.style.display = 'block';
    } catch (e) { modelListContainer.innerHTML = '<div style="padding:8px; font-size:12px; color:#ff8080;">获取失败：' + e.message + '</div>'; modelListContainer.style.display = 'block'; }
    finally { btn.textContent = '获取'; btn.disabled = false; }
  });

  // 保存全局设置（不再处理角色设定）
  $('#applyBtn').addEventListener('click', async () => {
    saveCfg(); await saveGlobalSettings();
    document.body.classList.remove('side-open'); alert('全局设置已保存！');
  });

  // 打开角色设定弹窗
  $('#openCharSettingsBtn').addEventListener('click', () => {
      // 将当前会话的人设填充到弹窗
      const conv = { id: currentConversationId };
      const el = document.querySelector(`.conv-item[data-id="${currentConversationId}"]`);
      if (el) {
          conv.agent_name = el.querySelector('.conv-name').textContent;
          // 从本地状态或云端拉取（此处为了简化，直接读取弹窗的默认值或上次输入的值）
          // 更好的做法是保留一份当前会话的配置对象在内存中
      }
      // 因为我们在 updateCurrentConversationUI 里没有把 prompt 存下来，我们在这里需要重新获取
      supabaseClient.from('conversations').select('agent_name, agent_prompt, greeting').eq('id', currentConversationId).single().then(({data}) => {
          if (data) {
              $('#modalCharName').value = data.agent_name || '';
              $('#modalCharPrompt').value = data.agent_prompt || '';
              $('#modalGreeting').value = data.greeting || '';
          }
          $('#char-settings-modal').classList.add('show');
      });
  });

  $('#cancelCharSettingsBtn').addEventListener('click', () => {
      $('#char-settings-modal').classList.remove('show');
  });

  // 保存角色设定
  $('#saveCharSettingsBtn').addEventListener('click', async () => {
      const charName = $('#modalCharName').value.trim() || '新角色';
      const charPrompt = $('#modalCharPrompt').value.trim();
      const greeting = $('#modalGreeting').value.trim();

      // 更新标题
      $('#headName').textContent = charName;
      // 更新左侧列表名字
      const el = document.querySelector(`.conv-item[data-id="${currentConversationId}"] .conv-name`);
      if (el) el.textContent = charName;

      // 保存到云端
      await saveConversationSettings(currentConversationId, charName, charPrompt, greeting);
      $('#char-settings-modal').classList.remove('show');
      alert('角色设定已保存！下次生成将使用新设定。');
  });

  $('#logoutBtn').addEventListener('click', async () => { if(!confirm('确定要退出登录吗？')) return; await supabaseClient.auth.signOut(); window.location.reload(); });

  $('#newConvBtn').addEventListener('click', async () => {
    if (busy) { alert('请等待当前回复完成。'); return; }
    const newConv = await createConversation();
    if (newConv) {
      currentConversationId = newConv.id;
      const convs = await loadConversations(); renderConversationList(convs); updateCurrentConversationUI(newConv);
      msgs = []; msgBox.innerHTML = '';
      if (newConv.greeting) { const aiMsg = { role: 'assistant', content: newConv.greeting, versions: [newConv.greeting], currentVersion: 0, local_id: generateId() }; msgs.push(aiMsg); addBubble('assistant', newConv.greeting, 0); saveMessageToCloud(aiMsg); }
      document.body.classList.remove('side-open');
    }
  });

  msgBox.addEventListener('click', async (e) => {
    const target = e.target;
    if (target.classList.contains('regen-btn')) await regenerateMessage(parseInt(target.getAttribute('data-msg-index')));
    else if (target.classList.contains('version-btn')) switchVersion(parseInt(target.getAttribute('data-msg-index')), parseInt(target.getAttribute('data-direction')));
    else if (target.classList.contains('edit-btn')) editUserMessage(parseInt(target.getAttribute('data-msg-index')));
    else if (target.classList.contains('delete-btn')) await deleteMessage(parseInt(target.getAttribute('data-msg-index')));
  });
}

/* ---------- 登录逻辑 ---------- */
const authOverlay = $('#auth-overlay'); const authEmail = $('#auth-email'); const authPassword = $('#auth-password');
const authLoginBtn = $('#auth-login-btn'); const authRegisterBtn = $('#auth-register-btn'); const authMsg = $('#auth-msg');

function toggleAuthMode() {
  isRegisterMode = !isRegisterMode;
  $('#auth-title').textContent = isRegisterMode ? '创建账号' : '欢迎回来';
  $('#auth-subtitle').textContent = isRegisterMode ? '注册一个新账号开始使用' : '登录以同步您的角色与聊天记录';
  authLoginBtn.textContent = isRegisterMode ? '注册' : '登录';
  authRegisterBtn.textContent = isRegisterMode ? '已有账号？点击登录' : '没有账号？点击注册';
  authMsg.textContent = '';
}
authRegisterBtn.addEventListener('click', toggleAuthMode);

async function handleAuthAction() {
  const email = authEmail.value.trim(); const password = authPassword.value;
  if (!email || !password) { authMsg.textContent = '请填写邮箱和密码'; authMsg.className = 'auth-msg error'; return; }
  if (password.length < 6) { authMsg.textContent = '密码至少需要6位'; authMsg.className = 'auth-msg error'; return; }
  authLoginBtn.disabled = true; authMsg.textContent = '处理中...'; authMsg.className = 'auth-msg';
  try {
    let result = isRegisterMode ? await supabaseClient.auth.signUp({ email, password }) : await supabaseClient.auth.signInWithPassword({ email, password });
    if (result.error) { authMsg.textContent = result.error.message; authMsg.className = 'auth-msg error'; }
    else { if (isRegisterMode) { authMsg.textContent = '注册成功！请直接登录。'; authMsg.className = 'auth-msg success'; if (result.data.session) window.location.reload(); else toggleAuthMode(); } else window.location.reload(); }
  } catch (e) { authMsg.textContent = '网络错误'; authMsg.className = 'auth-msg error'; } finally { authLoginBtn.disabled = false; }
}
authLoginBtn.addEventListener('click', handleAuthAction);

/* ---------- 启动逻辑与热更新 ---------- */
async function init() {
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (session && session.user) {
      USER_ID = session.user.id; authOverlay.classList.add('hidden'); loadUserData();
    } else { USER_ID = null; authOverlay.classList.remove('hidden'); }
  });
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) authOverlay.classList.remove('hidden');
  else { USER_ID = session.user.id; authOverlay.classList.add('hidden'); loadUserData(); }
}
/* ---------- 【修复】表单初始化：绑定左侧全局设置的输入事件 ---------- */
function initForm(){
  CFG_KEYS.forEach(k => {
    const el = document.getElementById(k);
    if(!el) return;
    el.addEventListener('input', () => {
      if(el.type === 'number' || el.type === 'range') cfg[k] = Number(el.value);
      else cfg[k] = el.value;
      if(k === 'temperature') $('#tempVal').textContent = Number(cfg.temperature).toFixed(2);
      saveCfg();
    });
  });
}
async function loadUserData() {
  if (!USER_ID || currentLoadedUserId === USER_ID) return;
  currentLoadedUserId = USER_ID;
  cfg = loadCfg(); initForm(); bindEvents();
  await fetchGlobalSettings();
  let convs = await loadConversations();
  if (convs.length === 0) { const newConv = await createConversation(); if (newConv) convs = [newConv]; }
  renderConversationList(convs);
  if (convs.length > 0) { 
      // 【核心修复】只更新 UI，绝对不要在 switchConversation 之前设置 currentConversationId！
      updateCurrentConversationUI(convs[0]); 
      msgBox.innerHTML = '<div class="muted" style="text-align:center;margin:auto;font-size:13px;">正在进入会话...</div>';
      await switchConversation(convs[0].id); // 把 ID 传给函数，由函数内部去赋值
  }
  autoResize(); scrollBottom(true);
}

/* ---------- 热更新机制 ---------- */
/* ---------- 热更新机制（修复双重监听与死锁） ---------- */
let refreshing = false;
navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    // 延迟 300ms 再刷新，给 SW 缓存留出缓冲时间，避免瞬间死锁
    setTimeout(() => { window.location.reload(); }, 300);
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw-chat.js').then(reg => {
      // 每 5 分钟检查一次更新，避免频繁请求
      setInterval(() => { reg.update(); }, 300000); 

      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            const toast = $('#update-toast');
            toast.style.display = 'flex';
            $('#update-confirm-btn').onclick = () => {
                toast.style.display = 'none';
                newWorker.postMessage({ action: 'skipWaiting' });
            };
          }
        });
      });
    }).catch(err => console.log('SW 注册失败:', err));
  });
}
