<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>角色扮演 · RolePlay Chat</title>
<link rel="manifest" href="manifest-chat.json">
<meta name="theme-color" content="#000000">
<style>
*{box-sizing:border-box;}
:root{
  --bg:#0d0f16; --panel:#141824; --panel-2:#1c2130; --border:#2a3040;
  --text:#e7e9f0; --muted:#8b93a7; --accent:#7c6cff;
}
html,body{height:100%;height:100dvh;margin:0;}
body{
  background:var(--bg);color:var(--text);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;
}
button{font-family:inherit;}
.app{display:flex;height:100%;height:100dvh;}

/* ---------- 登录遮罩层 ---------- */
#auth-overlay{
  position:fixed;inset:0;z-index:999;
  background:rgba(13,15,22,0.98);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;transition:opacity 0.3s;
}
#auth-overlay.hidden{opacity:0;pointer-events:none;}
.auth-card{
  width:100%;max-width:380px;background:var(--panel);
  border:1px solid var(--border);border-radius:16px;
  padding:28px 24px;box-shadow:0 10px 40px rgba(0,0,0,0.5);
}
.auth-card h2{font-size:20px;font-weight:600;margin:0 0 8px 0;text-align:center;}
.auth-card p{font-size:13px;color:var(--muted);text-align:center;margin:0 0 20px 0;}
.auth-card input{
  width:100%;background:var(--panel-2);border:1px solid var(--border);
  color:var(--text);border-radius:9px;padding:12px;font-size:14px;margin-bottom:12px;outline:none;
}
.auth-card input:focus{border-color:var(--accent);}
.auth-card button{
  width:100%;padding:12px;border-radius:9px;font-size:14px;font-weight:600;
  cursor:pointer;transition:0.2s;border:none;
}
.btn-login{background:var(--accent);color:#fff;margin-bottom:10px;}
.btn-login:hover{filter:brightness(1.1);}
.btn-register{background:transparent;color:var(--text);border:1px solid var(--border) !important;}
.btn-register:hover{background:var(--panel-2);}
.auth-msg{font-size:12px;text-align:center;margin-top:12px;min-height:18px;}
.auth-msg.error{color:#ff8080;}
.auth-msg.success{color:#6bff8b;}

/* ---------- 侧栏 ---------- */
#sidebar{
  width:330px;flex:0 0 330px;background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;
}
.side-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;
}
.side-body{flex:1;overflow-y:auto;padding:16px;}
.side-body section{margin-bottom:22px;}
.side-body h3{
  font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin:0 0 8px;font-weight:600;
}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 5px;}
input,textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--border);
  color:var(--text);border-radius:9px;padding:9px 11px;font-size:13.5px;
  font-family:inherit;outline:none;transition:border-color .15s;
}
input:focus,textarea:focus{border-color:var(--accent);}
textarea{resize:vertical;line-height:1.55;}
input[type=range]{padding:0;background:none;border:none;-webkit-appearance:none;appearance:none;height:20px;}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--border);border-radius:2px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);margin-top:-5.5px;cursor:pointer;}
.side-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-direction:column;}
.side-foot .btn{width:100%;}
.btn-logout{background:transparent;color:#ff8080;border:1px solid #ff8080;margin-top:6px;}
.btn-logout:hover{background:rgba(255,128,128,0.1);}
.btn-clear-chat{background:transparent;color:#ff8080;border:1px solid #ff8080;margin-top:6px;}
.btn-clear-chat:hover{background:rgba(255,128,128,0.1);}

/* ---------- 按钮 ---------- */
.btn{
  background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13.5px;transition:.15s;
}
.btn:hover{border-color:var(--accent);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.sm{padding:6px 11px;font-size:12.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.icon-btn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:8px;}
.icon-btn:hover{color:var(--text);background:var(--panel-2);}

/* ---------- 聊天区 ---------- */
.chat{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
.chat-head{
  display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--border);background:rgba(20,24,36,.72);
  backdrop-filter:blur(10px);
}
.chat-head .title{display:flex;flex-direction:column;line-height:1.3;flex:1;min-width:0;}
.chat-head .title .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chat-head .sub{font-size:11.5px;color:var(--muted);}
.head-actions{display:flex;gap:6px;}
#menuBtn{display:none;}

#messages{
  flex:1;overflow-y:auto;padding:22px 18px 10px;
  display:flex;flex-direction:column;gap:18px;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
}
.msg{display:flex;flex-direction:column;max-width:min(78%,760px);animation:pop .18s ease;}
@keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.msg.user{align-self:flex-end;}
.msg.assistant{align-self:flex-start;}
.msg .meta{font-size:11.5px;color:var(--muted);margin-bottom:5px;padding:0 4px;}
.msg.user .meta{text-align:right;}
.msg .content{
  padding:11px 15px;border-radius:16px;line-height:1.72;
  word-break:break-word;overflow-wrap:anywhere;
}
.msg.user .content{background:linear-gradient(135deg,#5b4bff,#3f7bff);color:#fff;border-bottom-right-radius:5px;}
.msg.assistant .content{background:var(--panel-2);border:1px solid var(--border);border-bottom-left-radius:5px;}
.msg .content em{color:#a99cff;font-style:italic;}
.msg.user .content em{color:#e2e8ff;}
.err{color:#ff8080;font-size:12.5px;margin-top:8px;white-space:pre-wrap;line-height:1.5;}
.muted{color:var(--muted);}
.cursor{display:inline-block;width:7px;height:1em;background:var(--accent);
  vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite;}
@keyframes blink{50%{opacity:0;}}

/* 新增：消息操作栏（重新生成、版本切换、编辑、删除、Token） */
.msg-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
  padding: 0 4px;
  font-size: 12px;
  color: var(--muted);
  opacity: 0.6;
  transition: opacity 0.2s;
  flex-wrap: wrap;
}
.msg-actions:hover {
  opacity: 1;
}
.msg.user .msg-actions {
  justify-content: flex-end;
}
.action-btn {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 2px 4px;
  font-size: 12px;
  border-radius: 4px;
}
.action-btn:hover {
  color: var(--text);
  background: var(--border);
}
.action-btn.delete-btn {
  color: #ff8080;
}
.action-btn.delete-btn:hover {
  background: rgba(255,128,128,0.15);
}
.version-switcher {
  display: flex;
  align-items: center;
  gap: 4px;
}
.version-switcher span {
  font-variant-numeric: tabular-nums;
  min-width: 28px;
  text-align: center;
}
.version-switcher button {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  cursor: pointer;
  border-radius: 3px;
  padding: 0 4px;
}
.version-switcher button:hover:not(:disabled) {
  color: var(--text);
  border-color: var(--muted);
}
.version-switcher button:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}
.token-display {
  font-family: monospace;
  font-size: 11px;
  color: #6b7280;
  background: rgba(0,0,0,0.2);
  padding: 1px 6px;
  border-radius: 4px;
  margin-left: auto;
}

.composer{
  display:flex;gap:10px;align-items:flex-end;
  padding:12px 16px 16px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);background:var(--panel);
}
#input{
  flex:1;resize:none;max-height:180px;min-height:44px;
  line-height:1.55;padding:11px 14px;border-radius:12px;overflow-y:auto;
}
#sendBtn{
  height:44px;padding:0 22px;border-radius:12px;background:var(--accent);
  border:none;color:#fff;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:.15s;
}
#sendBtn:hover{filter:brightness(1.1);}
#sendBtn.stop{background:#e05252;}

#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none;}

@media(max-width:860px){
  #menuBtn{display:block;}
  #sidebar{
    position:fixed;top:0;bottom:0;left:0;z-index:50;
    width:min(88vw,340px);flex-basis:auto;
    transform:translateX(-100%);transition:transform .25s ease;
  }
  body.side-open #sidebar{transform:none;}
  body.side-open #backdrop{display:block;}
  .msg{max-width:90%;}
  input, textarea { font-size: 16px !important; }
  .btn.sm { padding: 10px 14px; font-size: 13.5px; }
}
@media(max-width:640px){
  #exportBtn{display:none;}
  #messages{padding:16px 12px 8px;}
  .composer{padding:10px 12px 12px;padding-bottom: calc(12px + env(safe-area-inset-bottom));}
}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#2a3040;border-radius:5px;}
::-webkit-scrollbar-thumb:hover{background:#3a4256;}
::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>

<div id="auth-overlay" class="hidden">
  <div class="auth-card">
    <h2 id="auth-title">欢迎回来</h2>
    <p id="auth-subtitle">登录以同步您的角色与聊天记录</p>
    <input type="email" id="auth-email" placeholder="邮箱地址" autocomplete="email">
    <input type="password" id="auth-password" placeholder="密码（至少6位）" autocomplete="current-password">
    <button class="btn-login" id="auth-login-btn">登录</button>
    <button class="btn-register" id="auth-register-btn">没有账号？点击注册</button>
    <div class="auth-msg" id="auth-msg"></div>
  </div>
</div>

<div class="app">
  <aside id="sidebar">
    <div class="side-head">
      <span>设置</span>
      <button class="icon-btn" id="closeSide" title="关闭">✕</button>
    </div>
    <div class="side-body">
      <section>
        <h3>接口配置</h3>
        <label>API 地址（Base URL）</label>
        <input id="apiBase" placeholder="https://api.openai.com/v1" spellcheck="false">
        <label>API Key</label>
        <input id="apiKey" type="password" placeholder="sk-..." spellcheck="false">
        <label>模型名</label>
        <input id="model" placeholder="gpt-4o-mini" spellcheck="false">
        <label>温度 <span id="tempVal">0.85</span></label>
        <input id="temperature" type="range" min="0" max="2" step="0.05" value="0.85">
        <label>单次最大回复长度（tokens）</label>
        <input id="maxTokens" type="number" min="64" max="32000" step="64">
        <label>上下文保留条数</label>
        <input id="ctxLimit" type="number" min="4" max="200" step="2">
      </section>

      <section>
        <h3>角色设定</h3>
        <label>角色名</label>
        <input id="charName" spellcheck="false">
        <label>角色人设 / 世界观</label>
        <textarea id="charPrompt" rows="8" spellcheck="false"></textarea>
        <label>开场白（新对话时使用）</label>
        <textarea id="greeting" rows="4" spellcheck="false"></textarea>
      </section>

      <section>
        <h3>你的设定</h3>
        <label>你的名字</label>
        <input id="userName" spellcheck="false">
        <label>你的人设（可留空）</label>
        <textarea id="userPrompt" rows="3" spellcheck="false"></textarea>
      </section>
    </div>
    <div class="side-foot">
      <button class="btn primary" id="applyBtn">保存并应用设定</button>
      <button class="btn btn-clear-chat" id="clearChatBtn">清空聊天记录</button>
      <button class="btn btn-logout" id="logoutBtn">退出登录</button>
    </div>
  </aside>

  <div id="backdrop"></div>

  <main class="chat">
    <header class="chat-head">
      <button class="icon-btn" id="menuBtn" title="设置">☰</button>
      <div class="title">
        <span class="n" id="headName">角色</span>
        <span class="sub">角色扮演对话</span>
      </div>
      <div class="head-actions">
        <button class="btn sm" id="newBtn">新对话</button>
        <button class="btn sm" id="exportBtn">导出</button>
      </div>
    </header>

    <div id="messages"></div>

    <div class="composer">
      <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="sendBtn">发送</button>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ---------- Supabase 初始化 ---------- */
const SUPABASE_URL = 'https://bpkipmnvvrjsfckzhfrl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_K5hZV5mkiX0GHchcYIr7dQ_Z7ICn1mu';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = s => document.querySelector(s);
let USER_ID = null;

const DEFAULTS = {
  apiBase: 'https://token.xsxc.site/v1',
  apiKey: 'dp_53d5cdede7ca46e645a4a647624a',
  model: 'deepseek-v4-pro',
  temperature: 0.85,
  maxTokens: 1024,
  ctxLimit: 30,
  charName: '林澈',
  charPrompt: '24岁，老城区一家独立书店的店主。\n性格：表面冷淡、话少，实则细心温柔，习惯用行动而非言语表达关心。\n说话风格：短句，偶尔带点调侃，很少用感叹号。\n背景：书店生意清淡，但他从没打算关门。',
  greeting: '*傍晚，店里只剩一盏暖黄的灯。他头也不抬地翻着书页，直到门铃响起，才慢慢抬眼。*\n\n"……随便看。想喝点什么的话，壶里有茶。"',
  userName: '旅人',
  userPrompt: '一个刚搬来这座城市的人，喜欢在傍晚散步。'
};

const CFG_KEYS = ['apiBase','apiKey','model','temperature','maxTokens','ctxLimit',
                  'charName','charPrompt','greeting','userName','userPrompt'];

let cfg = Object.assign({}, DEFAULTS);
let msgs = [];
let busy = false;
let abortCtrl = null;

let hasBoundEvents = false;
let currentLoadedUserId = null;

/* ---------- 配置读写（按用户ID隔离） ---------- */
function loadCfg(){
  if(!USER_ID) return Object.assign({}, DEFAULTS);
  try{
    const raw = localStorage.getItem('rp_cfg_' + USER_ID);
    return raw ? Object.assign({}, DEFAULTS, JSON.parse(raw)) : Object.assign({}, DEFAULTS);
  }catch(e){ return Object.assign({}, DEFAULTS); }
}
function saveCfg(){
  if(!USER_ID) return;
  try{ localStorage.setItem('rp_cfg_' + USER_ID, JSON.stringify(cfg)); }catch(e){}
}
function saveHistoryLocal(){
  if(!USER_ID) return;
  try{ localStorage.setItem('rp_history_' + USER_ID, JSON.stringify(msgs.slice(-300))); }catch(e){}
}
function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }

/* ---------- 云端：从 Supabase 拉取全部配置 ---------- */
async function fetchAgentSettings() {
    if (!USER_ID) return false;
    try {
        const { data, error } = await supabaseClient
            .from('agent_settings')
            .select('agent_name, agent_prompt, api_base, api_key, model, temperature, max_tokens, ctx_limit')
            .eq('id', USER_ID)
            .maybeSingle();

        if (error) {
            console.warn('⚠️ Supabase 拉取失败:', error.message);
            return false;
        }

        if (data) {
            console.log('✅ 成功从 Supabase 获取全部配置:', data);
            if (data.agent_name) cfg.charName = data.agent_name;
            if (data.agent_prompt) cfg.charPrompt = data.agent_prompt;
            if (data.api_base) cfg.apiBase = data.api_base;
            if (data.api_key) cfg.apiKey = data.api_key;
            if (data.model) cfg.model = data.model;
            if (data.temperature !== null && data.temperature !== undefined) cfg.temperature = data.temperature;
            if (data.max_tokens !== null && data.max_tokens !== undefined) cfg.maxTokens = data.max_tokens;
            if (data.ctx_limit !== null && data.ctx_limit !== undefined) cfg.ctxLimit = data.ctx_limit;
            
            saveCfg();
            if ($('#charName')) $('#charName').value = cfg.charName;
            if ($('#charPrompt')) $('#charPrompt').value = cfg.charPrompt;
            if ($('#apiBase')) $('#apiBase').value = cfg.apiBase;
            if ($('#apiKey')) $('#apiKey').value = cfg.apiKey;
            if ($('#model')) $('#model').value = cfg.model;
            if ($('#temperature')) $('#temperature').value = cfg.temperature;
            if ($('#maxTokens')) $('#maxTokens').value = cfg.maxTokens;
            if ($('#ctxLimit')) $('#ctxLimit').value = cfg.ctxLimit;
            $('#tempVal').textContent = Number(cfg.temperature).toFixed(2);
            updateHeadName();
            return true;
        } else {
            console.log('🌱 新用户首次登录，正在向云端写入默认配置...');
            const { error: insertError } = await supabaseClient.from('agent_settings').insert({
                id: USER_ID,
                agent_name: cfg.charName,
                agent_prompt: cfg.charPrompt,
                api_base: cfg.apiBase,
                api_key: cfg.apiKey,
                model: cfg.model,
                temperature: Number(cfg.temperature),
                max_tokens: Number(cfg.maxTokens),
                ctx_limit: Number(cfg.ctxLimit)
            });
            if (insertError) console.error('❌ 写入默认配置失败:', insertError.message);
            return false;
        }
    } catch (e) {
        console.error('❌ Supabase 请求异常:', e);
    }
    return false;
}

/* ---------- 云端：向 Supabase 推送并保存全部配置 ---------- */
async function saveAgentSettings() {
    if (!USER_ID) { alert('请先登录后再保存设置！'); return; }
    try {
        const { error } = await supabaseClient
            .from('agent_settings')
            .upsert({ 
                id: USER_ID, 
                agent_name: cfg.charName, 
                agent_prompt: cfg.charPrompt,
                api_base: cfg.apiBase,
                api_key: cfg.apiKey,
                model: cfg.model,
                temperature: Number(cfg.temperature),
                max_tokens: Number(cfg.maxTokens),
                ctx_limit: Number(cfg.ctxLimit)
            });
        if (error) console.error('❌ 保存到云端失败:', error.message);
        else console.log('✅ 成功保存全部配置到云端!');
    } catch (e) { console.error('❌ 保存请求异常:', e); }
}

/* ---------- 云端：将单条消息推送到 Supabase（支持更新） ---------- */
async function saveMessageToCloud(msg) {
    if (!USER_ID) return;
    try {
        const payload = {
            user_id: USER_ID,
            local_id: msg.local_id,
            role: msg.role,
            content: msg.content,
            versions: msg.versions || null,
            current_version: msg.currentVersion || 0,
            tokens: msg.tokens || null // 【新增】同步 tokens
        };
        const { error } = await supabaseClient.from('chat_messages').upsert(payload, { onConflict: 'local_id' });
        if (error) console.error('❌ 消息同步到云端失败:', error.message);
    } catch (e) { console.error('❌ 消息同步异常:', e); }
}

/* ---------- 云端：从 Supabase 拉取历史记录 ---------- */
async function loadMessagesFromCloud() {
    if (!USER_ID) return [];
    try {
        const { data, error } = await supabaseClient
            .from('chat_messages')
            .select('role, content, versions, current_version, local_id, tokens, created_at')
            .eq('user_id', USER_ID)
            .order('created_at', { ascending: true })
            .limit(300);
            
        if (error) {
            console.warn('⚠️ 拉取云端聊天记录失败:', error.message);
            return [];
        }
        return data.map(d => {
            const msg = { role: d.role, content: d.content, local_id: d.local_id || generateId(), tokens: d.tokens || null };
            if (d.role === 'assistant') {
                msg.versions = d.versions || [d.content];
                msg.currentVersion = d.current_version || 0;
            }
            return msg;
        });
    } catch (e) {
        console.error('❌ 拉取云端聊天记录异常:', e);
        return [];
    }
}

/* ---------- 文本处理 ---------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderContent(s){
  let h = escapeHtml(s || '');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\*(.+?)\*/g, '<em>$1</em>');
  h = h.replace(/\n/g, '<br>');
  return h;
}

/* ---------- 表单初始化 ---------- */
function initForm(){
  CFG_KEYS.forEach(k => {
    const el = document.getElementById(k);
    if(!el) return;
    el.value = cfg[k];
    const handler = () => {
      if(el.type === 'number' || el.type === 'range') cfg[k] = Number(el.value);
      else cfg[k] = el.value;
      if(k === 'temperature') $('#tempVal').textContent = Number(cfg.temperature).toFixed(2);
      if(k === 'charName') updateHeadName();
      saveCfg();
    };
    el.addEventListener('input', handler);
    el.addEventListener('change', handler);
  });
  $('#tempVal').textContent = Number(cfg.temperature).toFixed(2);
}

function updateHeadName(){ $('#headName').textContent = cfg.charName || '角色'; }

/* ---------- 消息渲染与版本控制 ---------- */
const msgBox = $('#messages');

function updateVersionSwitcher(index, msg) {
    const msgRow = msgBox.querySelector(`.msg[data-msg-index="${index}"]`);
    if (!msgRow) return;
    const actionsDiv = msgRow.querySelector('.msg-actions');
    if (!actionsDiv) return;

    const oldSwitcher = actionsDiv.querySelector('.version-switcher');
    if (oldSwitcher) oldSwitcher.remove();

    if (msg.versions && msg.versions.length > 1) {
        const switcher = document.createElement('div');
        switcher.className = 'version-switcher';
        switcher.innerHTML = `
            <button class="version-btn" data-msg-index="${index}" data-direction="-1" ${msg.currentVersion === 0 ? 'disabled' : ''}>&lt;</button>
            <span>${msg.currentVersion + 1}/${msg.versions.length}</span>
            <button class="version-btn" data-msg-index="${index}" data-direction="1" ${msg.currentVersion === msg.versions.length - 1 ? 'disabled' : ''}>&gt;</button>
        `;
        const regenBtn = actionsDiv.querySelector('.regen-btn');
        if (regenBtn) actionsDiv.insertBefore(switcher, regenBtn);
        else actionsDiv.appendChild(switcher);
    }
}

function addBubble(role, content, index = null, tokens = null){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  if (index !== null) wrap.setAttribute('data-msg-index', index);

  const name = role === 'user' ? (cfg.userName || '你') : (cfg.charName || '角色');
  
  // 构建操作栏 HTML
  let actionsHtml = '';
  if (role === 'assistant') {
      actionsHtml += `<button class="action-btn regen-btn" data-msg-index="${index}">重新生成</button>`;
  } else {
      actionsHtml += `<button class="action-btn edit-btn" data-msg-index="${index}">编辑</button>`;
  }
  actionsHtml += `<button class="action-btn delete-btn" data-msg-index="${index}">删除</button>`;
  
  // 构建 Token 显示 HTML
  let tokenHtml = '';
  if (tokens) {
      tokenHtml = `<span class="token-display" title="完成 Token: ${tokens.completion_tokens || 0} / 总 Token: ${tokens.total_tokens || 0}">T: ${tokens.total_tokens || 0}</span>`;
  }

  wrap.innerHTML = `
    <div class="meta">${escapeHtml(name)}</div>
    <div class="content"></div>
    <div class="msg-actions">
      ${actionsHtml}
      ${tokenHtml}
    </div>
  `;
  wrap.querySelector('.content').innerHTML = renderContent(content);
  msgBox.appendChild(wrap);

  if (role === 'assistant' && index !== null) {
      const msg = msgs[index];
      if (msg && msg.versions) updateVersionSwitcher(index, msg);
  }

  scrollBottom(true);
  return wrap;
}

function scrollBottom(force){
  if(!force){
    const near = msgBox.scrollHeight - msgBox.scrollTop - msgBox.clientHeight < 160;
    if(!near) return;
  }
  msgBox.scrollTop = msgBox.scrollHeight;
}

/* ---------- 构造请求 ---------- */
function endpoint(){
  let base = String(cfg.apiBase || '').trim().replace(/\/+$/, '');
  if(!base) throw new Error('请先在左侧填写 API 地址');
  if(/\/chat\/completions$/i.test(base)) return base;
  return base + '/chat/completions';
}

function systemPrompt(){
  const parts = [];
  parts.push('你正在进行沉浸式的角色扮演对话。请始终保持角色，用第一人称自然地说话，不要以 AI 助手的身份回应，不要解释规则，不要跳出角色。');
  parts.push('【你的角色】' + (cfg.charName || '角色') + (cfg.charPrompt ? '\n' + cfg.charPrompt : ''));
  parts.push('【对话对象】' + (cfg.userName || '用户') + (cfg.userPrompt ? '\n' + cfg.userPrompt : ''));
  parts.push('动作、神态、环境描写用 *星号* 包裹。回复长度贴合语境，像真人聊天一样自然。');
  return parts.join('\n\n');
}

function buildMessages(contextMsgs){
  const limit = Math.max(2, Number(cfg.ctxLimit) || 30);
  const hist = contextMsgs.slice(-limit).map(m => ({role: m.role, content: m.content}));
  return [{role:'system', content: systemPrompt()}].concat(hist);
}

/* ---------- 核心：AI 回复流式接收（返回文本和Token） ---------- */
async function fetchAIResponse(contextMsgs) {
  const payload = { 
      model: cfg.model, 
      messages: buildMessages(contextMsgs), 
      temperature: Number(cfg.temperature), 
      max_tokens: Number(cfg.maxTokens), 
      stream: true,
      stream_options: { include_usage: true } // 【关键】让 API 返回 token 用量
  };
  const res = await fetch(endpoint(), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (cfg.apiKey || '') },
    body: JSON.stringify(payload)
  });

  if(!res.ok){
    const txt = await res.text().catch(() => '');
    throw new Error('HTTP ' + res.status + ' ' + res.statusText + (txt ? '\n' + txt.slice(0, 500) : ''));
  }
  if(!res.body) throw new Error('该接口未返回可读流（可能不支持 stream）');

  const reader = res.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let full = '';
  let buf = '';
  let usage = null;

  while(true){
    const {done, value} = await reader.read();
    if(done) break;
    buf += decoder.decode(value, {stream: true});
    const lines = buf.split('\n');
    buf = lines.pop();

    for(const raw of lines){
      const line = raw.trim();
      if(!line || line.startsWith(':') || !line.startsWith('data:')) continue;
      const data = line.slice(5).trim();
      if(data === '[DONE]') continue;
      let json;
      try{ json = JSON.parse(data); }catch(e){ continue; }
      
      // 捕获 usage 信息
      if (json.usage) {
          usage = json.usage;
      }
      
      const choice = json.choices && json.choices[0];
      if(!choice) continue;
      const delta = (choice.delta && choice.delta.content) ?? (choice.message && choice.message.content) ?? '';
      if(delta){
        full += delta;
      }
    }
  }
  return { full, usage };
}

/* ---------- 核心：普通发送消息 ---------- */
async function send(){
  if(busy) return;
  const input = $('#input');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  autoResize();

  const userMsg = { role: 'user', content: text, local_id: generateId() };
  msgs.push(userMsg);
  addBubble('user', text, msgs.length - 1);
  saveHistoryLocal();
  await saveMessageToCloud(userMsg);

  const contextMsgs = msgs.slice(0, -1).concat(userMsg);
  await generateAIResponse(contextMsgs);
}

/* ---------- 核心：生成 AI 回复（带打字机效果） ---------- */
async function generateAIResponse(contextMsgs) {
  busy = true;
  setBusyUI(true);

  const bubble = addBubble('assistant', '');
  const contentEl = bubble.querySelector('.content');
  contentEl.innerHTML = '<span class="cursor"></span>';

  try {
    const { full, usage } = await fetchAIResponse(contextMsgs);
    if(full.trim()){
      contentEl.innerHTML = renderContent(full);
      const aiMsg = { 
          role: 'assistant', 
          content: full, 
          versions: [full], 
          currentVersion: 0, 
          local_id: generateId(),
          tokens: usage // 【存储 token】
      };
      msgs.push(aiMsg);
      const idx = msgs.length - 1;
      
      // 更新 DOM 属性
      bubble.setAttribute('data-msg-index', idx);
      bubble.querySelectorAll('.action-btn').forEach(btn => btn.setAttribute('data-msg-index', idx));
      
      // 如果有 token，插入到操作栏
      if (usage) {
          const tokenSpan = document.createElement('span');
          tokenSpan.className = 'token-display';
          tokenSpan.title = `完成 Token: ${usage.completion_tokens || 0} / 总 Token: ${usage.total_tokens || 0}`;
          tokenSpan.textContent = `T: ${usage.total_tokens || 0}`;
          bubble.querySelector('.msg-actions').appendChild(tokenSpan);
      }

      await saveMessageToCloud(aiMsg);
    }else{
      contentEl.innerHTML = '<span class="muted">（模型返回了空内容）</span>';
    }
  } catch(err) {
    contentEl.innerHTML = '<span class="err">请求失败：' + escapeHtml(err.message) + '</span>';
  } finally {
    busy = false;
    setBusyUI(false);
    saveHistoryLocal();
  }
}

/* ---------- 核心：单条消息重新生成 ---------- */
async function regenerateMessage(index) {
  if (busy) return;
  const msg = msgs[index];
  if (!msg || msg.role !== 'assistant') return;

  let userMsgContext = [];
  for (let i = index - 1; i >= 0; i--) {
    if (msgs[i].role === 'user') {
      userMsgContext = msgs.slice(0, i + 1);
      break;
    }
  }
  if (userMsgContext.length === 0) return;

  busy = true;
  setBusyUI(true);

  const msgRow = msgBox.querySelector(`.msg[data-msg-index="${index}"]`);
  const contentEl = msgRow.querySelector('.content');
  const originalContent = contentEl.innerHTML;
  contentEl.innerHTML = '<span class="cursor"></span>';

  try {
    const { full, usage } = await fetchAIResponse(userMsgContext);
    if (full.trim()) {
      if (!msg.versions) {
        msg.versions = [msg.content];
        msg.currentVersion = 0;
      }
      msg.versions.push(full);
      msg.currentVersion = msg.versions.length - 1;
      msg.content = full;
      msg.tokens = usage; // 更新 token

      contentEl.innerHTML = renderContent(full);
      
      // 更新 token 显示
      const oldToken = msgRow.querySelector('.token-display');
      if (oldToken) oldToken.remove();
      if (usage) {
          const tokenSpan = document.createElement('span');
          tokenSpan.className = 'token-display';
          tokenSpan.title = `完成 Token: ${usage.completion_tokens || 0} / 总 Token: ${usage.total_tokens || 0}`;
          tokenSpan.textContent = `T: ${usage.total_tokens || 0}`;
          msgRow.querySelector('.msg-actions').appendChild(tokenSpan);
      }

      updateVersionSwitcher(index, msg);
      await saveMessageToCloud(msg);
    } else {
      contentEl.innerHTML = originalContent;
    }
  } catch(e) {
    contentEl.innerHTML = originalContent + '<div class="err">重新生成失败：' + escapeHtml(e.message) + '</div>';
  } finally {
    busy = false;
    setBusyUI(false);
    saveHistoryLocal();
  }
}

/* ---------- 核心：切换版本 ---------- */
function switchVersion(index, direction) {
  const msg = msgs[index];
  if (!msg || !msg.versions || msg.versions.length <= 1) return;

  let newVer = msg.currentVersion + direction;
  if (newVer < 0 || newVer >= msg.versions.length) return;

  msg.currentVersion = newVer;
  msg.content = msg.versions[newVer];

  const msgRow = msgBox.querySelector(`.msg[data-msg-index="${index}"]`);
  if (msgRow) {
    const contentEl = msgRow.querySelector('.content');
    contentEl.innerHTML = renderContent(msg.content);
    updateVersionSwitcher(index, msg);
  }

  saveHistoryLocal();
  saveMessageToCloud(msg);
}

/* ---------- 核心：编辑用户消息并重发 ---------- */
function editUserMessage(index) {
  if (busy) return;
  const msg = msgs[index];
  if (!msg || msg.role !== 'user') return;

  const newContent = prompt('编辑消息:', msg.content);
  if (newContent === null || newContent.trim() === '' || newContent === msg.content) return;

  msgs = msgs.slice(0, index + 1);
  msg.content = newContent;

  // 重新渲染整个聊天框（因为删除了后续消息，索引会变）
  msgBox.innerHTML = '';
  msgs.forEach((m, i) => addBubble(m.role, m.content, i, m.tokens));

  saveHistoryLocal();

  const contextMsgs = msgs.slice(0, index + 1);
  generateAIResponse(contextMsgs);
}

/* ---------- 核心：删除单条消息 ---------- */
async function deleteMessage(index) {
    if (busy) return;
    if (!confirm('确定要删除这条消息吗？删除后无法恢复。')) return;
    
    const msg = msgs[index];
    if (!msg) return;

    // 从数组中移除
    msgs.splice(index, 1);

    // 重新渲染整个聊天框（因为索引全变了）
    msgBox.innerHTML = '';
    msgs.forEach((m, i) => addBubble(m.role, m.content, i, m.tokens));

    saveHistoryLocal();

    // 从云端删除
    if (USER_ID && msg.local_id) {
        const { error } = await supabaseClient.from('chat_messages').delete().eq('local_id', msg.local_id);
        if (error) console.error('❌ 云端删除失败:', error.message);
    }
}

/* ---------- UI 状态 ---------- */
function setBusyUI(b){
  const btn = $('#sendBtn');
  btn.textContent = b ? '停止' : '发送';
  btn.classList.toggle('stop', b);
  $('#newBtn').disabled = b;
}

/* ---------- 交互动作 ---------- */
function newChat(){
  if(busy) return;
  msgs = [];
  msgBox.innerHTML = '';
  if(cfg.greeting && cfg.greeting.trim()){
    const aiMsg = { role: 'assistant', content: cfg.greeting, versions: [cfg.greeting], currentVersion: 0, local_id: generateId() };
    msgs.push(aiMsg);
    addBubble('assistant', cfg.greeting, 0);
    saveMessageToCloud(aiMsg);
  }else{
    msgBox.innerHTML = '<div class="muted" style="text-align:center;margin:auto;font-size:13px;">在左侧设置好 API 与角色，然后开始对话吧。</div>';
  }
  saveHistoryLocal();
}

/* 清空聊天 */
async function clearChat() {
  if(!confirm('确定要清空所有聊天记录吗？此操作不可恢复。')) return;
  msgs = [];
  msgBox.innerHTML = '';
  saveHistoryLocal();
  if (USER_ID) {
    const { error } = await supabaseClient.from('chat_messages').delete().eq('user_id', USER_ID);
    if (error) console.error('❌ 清空云端记录失败:', error.message);
  }
  newChat();
}

function exportChat(){
  if(!msgs.length){ alert('还没有对话内容'); return; }
  const nameOf = r => r === 'user' ? (cfg.userName || '我') : (cfg.charName || '角色');
  const text = msgs.map(m => nameOf(m.role) + '：\n' + m.content).join('\n\n---\n\n');
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (cfg.charName || 'chat') + '-' + new Date().toISOString().slice(0,10) + '.txt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* ---------- 输入框自适应高度 ---------- */
const inputEl = $('#input');
function autoResize(){
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
}

/* ---------- 事件绑定（全局委托） ---------- */
function bindEvents(){
  if (hasBoundEvents) return;
  hasBoundEvents = true;

  $('#sendBtn').addEventListener('click', () => {
    if(busy){ abortCtrl && abortCtrl.abort(); return; }
    send();
  });

  inputEl.addEventListener('input', autoResize);
  inputEl.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){
      e.preventDefault();
      if(!busy) send();
    }
  });

  $('#newBtn').addEventListener('click', () => {
    if(msgs.length && !confirm('确定要清空当前对话，重新开始吗？')) return;
    newChat();
  });
  $('#exportBtn').addEventListener('click', exportChat);
  $('#clearChatBtn').addEventListener('click', clearChat);

  $('#menuBtn').addEventListener('click', () => document.body.classList.add('side-open'));
  $('#closeSide').addEventListener('click', () => document.body.classList.remove('side-open'));
  $('#backdrop').addEventListener('click', () => document.body.classList.remove('side-open'));

  $('#applyBtn').addEventListener('click', async () => {
    updateHeadName();
    saveCfg();
    await saveAgentSettings(); 
    
    document.querySelectorAll('.msg.assistant .meta').forEach(el => {
      el.textContent = cfg.charName || '角色';
    });
    document.querySelectorAll('.msg.user .meta').forEach(el => {
      el.textContent = cfg.userName || '你';
    });

    document.body.classList.remove('side-open');
    alert('设定已保存！AI将继续基于新设定和当前记录回复。');
  });

  $('#logoutBtn').addEventListener('click', async () => {
    if(!confirm('确定要退出登录吗？')) return;
    await supabaseClient.auth.signOut();
    window.location.reload();
  });

  // 全局事件委托：处理消息气泡上的按钮点击
  msgBox.addEventListener('click', async (e) => {
    const target = e.target;
    if (target.classList.contains('regen-btn')) {
      const index = parseInt(target.getAttribute('data-msg-index'));
      await regenerateMessage(index);
    } 
    else if (target.classList.contains('version-btn')) {
      const index = parseInt(target.getAttribute('data-msg-index'));
      const direction = parseInt(target.getAttribute('data-direction'));
      switchVersion(index, direction);
    }
    else if (target.classList.contains('edit-btn')) {
      const index = parseInt(target.getAttribute('data-msg-index'));
      editUserMessage(index);
    }
    else if (target.classList.contains('delete-btn')) {
      const index = parseInt(target.getAttribute('data-msg-index'));
      await deleteMessage(index);
    }
  });
}

/* ---------- 登录/注册 UI 逻辑 ---------- */
const authOverlay = $('#auth-overlay');
const authTitle = $('#auth-title');
const authSubtitle = $('#auth-subtitle');
const authEmail = $('#auth-email');
const authPassword = $('#auth-password');
const authLoginBtn = $('#auth-login-btn');
const authRegisterBtn = $('#auth-register-btn');
const authMsg = $('#auth-msg');

let isRegisterMode = false;

function toggleAuthMode() {
  isRegisterMode = !isRegisterMode;
  authTitle.textContent = isRegisterMode ? '创建账号' : '欢迎回来';
  authSubtitle.textContent = isRegisterMode ? '注册一个新账号开始使用' : '登录以同步您的角色与聊天记录';
  authLoginBtn.textContent = isRegisterMode ? '注册' : '登录';
  authRegisterBtn.textContent = isRegisterMode ? '已有账号？点击登录' : '没有账号？点击注册';
  authMsg.textContent = '';
}

authRegisterBtn.addEventListener('click', toggleAuthMode);

async function handleAuthAction() {
  const email = authEmail.value.trim();
  const password = authPassword.value;
  if (!email || !password) { authMsg.textContent = '请填写邮箱和密码'; authMsg.className = 'auth-msg error'; return; }
  if (password.length < 6) { authMsg.textContent = '密码至少需要6位'; authMsg.className = 'auth-msg error'; return; }

  authLoginBtn.disabled = true;
  authMsg.textContent = '处理中...';
  authMsg.className = 'auth-msg';

  try {
    let result;
    if (isRegisterMode) { result = await supabaseClient.auth.signUp({ email, password }); }
    else { result = await supabaseClient.auth.signInWithPassword({ email, password }); }

    if (result.error) {
      authMsg.textContent = result.error.message;
      authMsg.className = 'auth-msg error';
    } else {
      if (isRegisterMode) {
        authMsg.textContent = '注册成功！请直接登录。';
        authMsg.className = 'auth-msg success';
        if (result.data.session) { window.location.reload(); }
        else { toggleAuthMode(); }
      } else {
        window.location.reload();
      }
    }
  } catch (e) {
    authMsg.textContent = '网络错误，请重试';
    authMsg.className = 'auth-msg error';
  } finally {
    authLoginBtn.disabled = false;
  }
}

authLoginBtn.addEventListener('click', handleAuthAction);

/* ---------- 启动逻辑 ---------- */
async function init() {
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (session && session.user) {
      USER_ID = session.user.id;
      authOverlay.classList.add('hidden');
      console.log('✅ 用户已登录:', USER_ID);
      loadUserData();
    } else {
      USER_ID = null;
      authOverlay.classList.remove('hidden');
      console.log('⛔ 用户未登录');
    }
  });

  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) {
    authOverlay.classList.remove('hidden');
  } else {
    USER_ID = session.user.id;
    authOverlay.classList.add('hidden');
    loadUserData();
  }
}

async function loadUserData() {
  if (!USER_ID) return;
  if (currentLoadedUserId === USER_ID) return;
  currentLoadedUserId = USER_ID;
  
  msgs = [];
  msgBox.innerHTML = '';

  cfg = loadCfg();
  initForm();
  bindEvents();
  await fetchAgentSettings();

  let cloudMsgs = await loadMessagesFromCloud();
  if (cloudMsgs.length > 0) {
    msgs = cloudMsgs;
    msgs.forEach((m, i) => addBubble(m.role, m.content, i, m.tokens));
    saveHistoryLocal();
  } else {
    let restored = false;
    try{
      const raw = localStorage.getItem('rp_history_' + USER_ID);
      if(raw){
        const arr = JSON.parse(raw);
        if(Array.isArray(arr) && arr.length){
          msgs = arr;
          msgs.forEach((m, i) => addBubble(m.role, m.content, i, m.tokens));
          restored = true;
          for (let m of arr) {
            await saveMessageToCloud(m);
          }
        }
      }
    }catch(e){}
    if(!restored) newChat();
  }

  autoResize();
  scrollBottom(true);
}

// 执行启动
init();

/* ---------- 注册 Service Worker ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw-chat.js')
      .then(reg => console.log('✅ Service Worker 注册成功:', reg.scope))
      .catch(err => console.log('❌ Service Worker 注册失败:', err));
  });
}
