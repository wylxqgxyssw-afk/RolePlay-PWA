<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>角色扮演 · RolePlay Chat</title>
<meta name="theme-color" content="#000000">
<!-- 强制声明颜色方案，阻止安卓 WebView 的 Force Dark 反色 -->
<meta name="color-scheme" content="light dark">
<script>
(function(){
  try {
    var pref = localStorage.getItem('rp_theme') || 'auto';
    var isDark = pref === 'dark' || (pref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var theme = isDark ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.style.colorScheme = theme;
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', isDark ? '#000000' : '#ffffff');
  } catch (e) {}
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
*{box-sizing:border-box;}

/* ============================================================
   绝对隔离：深色和浅色变量互不干扰
   ============================================================ */
html[data-theme="dark"]{
  --bg:#121212; --panel:#1e1e1e; --panel-2:#2a2a2a; --border:#3a3a3a;
  --text:#ececec; --muted:#9e9e9e; --accent:#4d6bfe;
  --bubble-user-bg:#2a2a2a; --bubble-user-fg:#ffffff;
  --code-bg:rgba(255,255,255,0.1); --code-fg:#a0a0a0; --pre-bg:#1e1e1e;
  --danger:#ff8080; --success:#6bff8b;
}

html[data-theme="light"]{
  --bg:#ffffff; --panel:#f7f8fa; --panel-2:#eef0f3; --border:#e3e5e8;
  --text:#1a1d21; --muted:#6b7280; --accent:#4d6bfe;
  --bubble-user-bg:#eef1f6; --bubble-user-fg:#1a1d21;
  --code-bg:rgba(0,0,0,0.06); --code-fg:#6b7280; --pre-bg:#f6f7f9;
  --danger:#d92d20; --success:#16a34a;
}

html,body{height:100%;height:100dvh;margin:0;}
body{
  background:var(--bg);color:var(--text);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;
  transition: background-color 0.3s, color 0.3s;
}
button{font-family:inherit;}
.app{display:flex;height:100%;height:100dvh;}

/* ---------- 登录遮罩层 ---------- */
#auth-overlay{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;}
#auth-overlay.hidden{opacity:0;pointer-events:none;}
.auth-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px 24px;}
.auth-card h2{font-size:20px;margin:0 0 8px 0;text-align:center;}
.auth-card p{font-size:13px;color:var(--muted);text-align:center;margin:0 0 20px 0;}
.auth-card input{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:12px;font-size:14px;margin-bottom:12px;outline:none;}
.auth-card button{width:100%;padding:12px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;border:none;}
.btn-login{background:var(--accent);color:#fff;margin-bottom:10px;}
.btn-register{background:transparent;color:var(--text);border:1px solid var(--border) !important;}

/* ---------- 侧栏 ---------- */
#sidebar{width:330px;flex:0 0 330px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;}
.side-body{flex:1;overflow-y:auto;padding:16px;}
#cloud-status-bar {display: flex;align-items: center; justify-content: center; gap: 6px; padding: 6px 16px; font-size: 12px; background: var(--panel-2); border-bottom: 1px solid var(--border);}
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
#cloud-status-bar.offline { color: var(--danger); }
#cloud-status-bar.offline .status-dot { background: var(--danger); }

.conv-item {padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 6px; border: 1px solid transparent; display: flex; justify-content: space-between; align-items: center;}
.conv-item:hover { background: var(--panel-2); }
.conv-item.active { background: var(--panel-2); border-color: var(--accent); }
.conv-item .conv-name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
.conv-item .conv-delete { color: var(--danger); cursor: pointer; padding: 4px; font-size: 12px;}

.side-body section{margin-bottom:22px;}
.side-body h3{font-size:11.5px;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600;}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 5px;}
input,textarea{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:9px 11px;font-size:13.5px;font-family:inherit;outline:none;}

.side-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-direction:column;}
.btn{background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13.5px;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-logout{background:transparent;color:var(--danger);border:1px solid var(--danger);}

/* ---------- 侧栏底部菜单 ---------- */
.side-bottom-bar{
  position:relative; display:flex;align-items:center;justify-content:space-between;
  margin-top:8px;padding-top:10px; border-top:1px dashed var(--border);
}
.more-btn{
  width:30px;height:30px;border-radius:50%; background:transparent;border:1px solid transparent;color:var(--muted);
  display:inline-flex;align-items:center;justify-content:center; font-size:18px;cursor:pointer;
}
.more-btn:hover{background:var(--panel-2);color:var(--text);}
.more-menu{
  position:absolute;right:0;bottom:calc(100% + 8px); min-width:176px; background:var(--panel);
  border:1px solid var(--border); border-radius:12px; padding:6px; display: none; z-index:100;
}
.more-menu.show{display: block;}
.more-menu-header{font-size:11px;color:var(--muted);padding:6px 10px;font-weight:600;}
.more-menu-item{
  display:flex;align-items:center;gap:8px; width:100%;background:transparent;border:none;color:var(--text);
  padding:8px 10px;border-radius:8px; font-size:13.5px;cursor:pointer;text-align:left;
}
.more-menu-item:hover{background:var(--panel-2);}
.more-menu-item.selected{color:var(--accent);font-weight:600;}

/* ---------- 聊天区 ---------- */
.chat{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel);}
.chat-head .title{display:flex;flex-direction:column;line-height:1.3;flex:1;}
.chat-head .n{font-weight:600;}
.chat-head .sub{font-size:11.5px;color:var(--muted);}

#messages { flex: 1; overflow-y: auto; padding: 22px 18px; display: flex; flex-direction: column; gap: 22px;}
.msg { display: flex; flex-direction: column; }
.msg.user { align-self: flex-end; max-width: 78%; }
.msg.user .content { background: var(--bubble-user-bg); color: var(--bubble-user-fg); border-radius: 18px; padding: 11px 15px; }
.msg.assistant { align-self: flex-start; max-width: 100%; }
.msg.assistant .content { background: transparent; color: var(--text); }

.composer{display:flex;gap:10px;align-items:flex-end;padding:12px 16px;border-top:1px solid var(--border);background:var(--panel);}
#input{flex:1;resize:none;min-height:44px;border-radius:12px;}
#sendBtn{height:44px;padding:0 22px;border-radius:12px;background:var(--accent);color:#fff;border:none;font-weight:600;}

@media(max-width:860px){
  #sidebar{position:fixed;top:0;bottom:0;left:0;z-index:50;width:min(88vw,340px);background:var(--panel);transform:translateX(-100%);transition:transform .25s ease;}
  body.side-open #sidebar{transform:none;}
}
</style>
</head>
<body>

<div id="auth-overlay" class="hidden">
  <div class="auth-card">
    <h2>欢迎回来</h2>
    <input type="email" id="auth-email" placeholder="邮箱">
    <input type="password" id="auth-password" placeholder="密码">
    <button class="btn-login" id="auth-login-btn">登录</button>
    <button class="btn-register" id="auth-register-btn">注册</button>
  </div>
</div>

<div class="app">
  <aside id="sidebar">
    <div class="side-head"><span>多角色会话</span></div>
    <div id="cloud-status-bar" class="online"><span class="status-dot"></span>云端已连接</div>
    <div class="side-body">
      <section>
        <h3>全局接口配置</h3>
        <label>API 地址</label>
        <input id="apiBase" placeholder="https://api.openai.com/v1">
        <label>API Key</label>
        <input id="apiKey" type="password">
      </section>
    </div>
    <div class="side-foot">
      <button class="btn primary" id="applyBtn">保存设置</button>
      
      <!-- 菜单区 -->
      <div class="side-bottom-bar">
        <span style="font-size:11.5px;color:var(--muted)">RolePlay · v4.0</span>
        <button class="more-btn" id="moreBtn">⋯</button>
        <div class="more-menu" id="moreMenu">
          <div class="more-menu-header">外观</div>
          <button class="more-menu-item" data-theme-value="auto">跟随系统</button>
          <button class="more-menu-item" data-theme-value="light">浅色</button>
          <button class="more-menu-item" data-theme-value="dark">深色</button>
        </div>
      </div>
    </div>
  </aside>

  <main class="chat">
    <header class="chat-head">
      <div class="title">
        <span class="n">角色</span>
        <span class="sub">对话</span>
      </div>
    </header>
    <div id="messages">
      <div class="msg user"><div class="content">测试用户消息</div></div>
      <div class="msg assistant"><div class="content">这是一条 AI 测试回复。如果背景变成白色了，说明成功了！</div></div>
    </div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="输入..."></textarea>
      <button id="sendBtn">发送</button>
    </div>
  </main>
</div>

<script>
/* ---------- 主题系统（绝对暴力强制覆盖版） ---------- */
const THEME_KEY = 'rp_theme';

// 暴力验证提示
function showTestToast(text) {
  let toast = document.getElementById('force-test-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'force-test-toast';
    toast.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#e11d48;color:#fff;text-align:center;padding:15px;z-index:999999;font-weight:bold;font-size:16px;box-shadow:0 4px 10px rgba(0,0,0,0.3);';
    document.body.appendChild(toast);
  }
  toast.textContent = text;
  setTimeout(() => { if (toast) toast.remove(); }, 2500);
}

function applyThemeVisual(pref) {
  const isDark = pref === 'dark' || (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const eff = isDark ? 'dark' : 'light';
  
  // 1. 改根节点属性
  document.documentElement.setAttribute('data-theme', eff);
  
  // 2. 强制关闭系统的颜色方案干扰
  document.documentElement.style.setProperty('color-scheme', eff, 'important');
  let metaColorScheme = document.querySelector('meta[name="color-scheme"]');
  if(metaColorScheme) metaColorScheme.setAttribute('content', eff === 'dark' ? 'only dark' : 'only light');

  // 3. 最高级内联样式，打穿 WebView 强制反色（覆盖 body 和主要容器）
  const bgColor = isDark ? '#121212' : '#ffffff';
  const textColor = isDark ? '#ececec' : '#1a1d21';
  const panelBg = isDark ? '#1e1e1e' : '#f7f8fa';
  
  document.body.style.setProperty('background-color', bgColor, 'important');
  document.body.style.setProperty('color', textColor, 'important');
  
  const sidebar = document.getElementById('sidebar');
  if(sidebar) sidebar.style.setProperty('background-color', panelBg, 'important');

  // 4. 选中状态高亮
  document.querySelectorAll('.more-menu-item').forEach(el => {
    el.classList.toggle('selected', el.getAttribute('data-theme-value') === pref);
  });

  // 5. 暴力提示验证
  showTestToast(`已执行切换：${eff === 'dark' ? '深色模式' : '浅色模式'}`);
}

function applyTheme(pref) {
  localStorage.setItem(THEME_KEY, pref);
  applyThemeVisual(pref);
}

function setupThemeUI() {
  const moreBtn = document.getElementById('moreBtn');
  const moreMenu = document.getElementById('moreMenu');
  
  if (moreBtn && moreMenu) {
    moreBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      moreMenu.classList.toggle('show');
    });
    
    moreMenu.addEventListener('click', (e) => {
      const item = e.target.closest('.more-menu-item');
      if (!item) return;
      const val = item.getAttribute('data-theme-value');
      applyTheme(val);
      moreMenu.classList.remove('show');
    });
  }
}

/* ---------- 清理顽固缓存代码 ---------- */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(registrations) {
    for(let registration of registrations) {
      registration.unregister();
      console.log('已强制注销旧版 Service Worker');
    }
  });
}

/* ---------- 启动 ---------- */
document.addEventListener('DOMContentLoaded', () => {
  const savedPref = localStorage.getItem(THEME_KEY) || 'auto';
  applyThemeVisual(savedPref);
  setupThemeUI();
});
</script>
</body>
</html>
