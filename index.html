<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>黑色极简 · 剧本智能助手</title>
  <link rel="manifest" href="manifest-chat.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#000000">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script src="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: '#000000',
            darker: '#121212',
            accent: '#165DFF',
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    :root {
      --font-size: 16px;
      --line-height: 1.6;
      --ai-font-size: 16px;
      --ai-line-height: 1.6;
      --user-text-color: #FFFFFF;
      --ai-text-color: #FFFFFF;
      --bubble-px: 16px;
      --bubble-py: 8px;
      --chat-h-padding: 16px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --panel-width: 380px;
      --panel-height: 50vh;
      --input-height-ratio: 0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #000; color: #fff;
      transition: background-color 0.3s, color 0.3s;
    }
    body {
      height: 100vh; height: 100dvh;
      position: fixed; top: 0; left: 0;
    }

    .layout-container {
      width: 100%; height: 100%;
      position: relative;
      display: flex; flex-direction: column;
    }

    /* === 侧栏：外层只负责动画与裁剪，内层负责滚动，FAB 相对外层绝对定位 === */
    .left-set-panel {
      width: 100%; height: 0; flex-shrink: 0;
      background: #121212; border-bottom: 1px solid #333;
      overflow: hidden;
      transition: height 0.3s ease, background-color 0.3s;
      position: relative;
    }
    .left-set-panel.show {
      height: var(--panel-height);
    }
    .left-panel-inner {
      width: 100%; height: 100%;
      overflow-y: auto; overflow-x: hidden;
      padding: 0 16px;
      transition: padding 0.3s ease;
    }
    .left-set-panel.show .left-panel-inner {
      /* 底部留出空间，避免内容被 FAB 遮住 */
      padding: 24px 16px 90px;
    }

    .chat-main-panel {
      flex: 1;
      display: flex; flex-direction: column;
      min-height: 0; min-width: 0;
      background-color: #000;
      transition: background-color 0.3s;
    }

    #sample-preview-area {
      flex-shrink: 0;
      border-bottom: 1px solid #222;
      padding: 12px var(--chat-h-padding);
      background: #050505;
      max-height: 35%;
      overflow-y: auto;
      transition: background-color 0.3s;
    }
    .sample-label {
      font-size: 11px; color: #666;
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 8px;
    }

    #chat-box {
      flex: 1 1 auto;
      overflow-y: auto;
      min-height: 0;
      padding-left: var(--chat-h-padding);
      padding-right: var(--chat-h-padding);
      padding-bottom: 12px;
    }

    #summon-area { transition: all 0.3s ease; }
    #summon-btn { transition: all 0.2s ease; white-space: nowrap; letter-spacing: 0.3px; flex-shrink: 0; }
    #summon-btn.active-btn { background: #b8860b; color: #000; border: none; cursor: pointer; animation: summonPulse 2s ease-in-out infinite; font-weight: 600; }
    #summon-btn.active-btn:hover { background: #d4a017; transform: scale(1.03); }
    #summon-btn.active-btn:active { transform: scale(0.96); }
    #summon-btn.typing-btn { background: #333; color: #aaa; cursor: not-allowed; border: 1px solid #555; }
    #summon-btn.idle-btn { background: #2a2a2a; color: #666; cursor: not-allowed; border: 1px solid #333; }
    @keyframes summonPulse { 0%,100%{box-shadow:0 0 0 0 rgba(184,134,11,0.4);} 50%{box-shadow:0 0 0 8px rgba(184,134,11,0);} }
    #summon-status-text { font-size: 12px; line-height: 1.4; min-width: 0; }
    #summon-status-text.has-pending { color: #ccaa00; font-weight: 500; }

    #pending-dot {
      position: absolute; top: -2px; right: -3px;
      width: 9px; height: 9px; background: #ff4444;
      border-radius: 50%; border: 1.5px solid #000;
      pointer-events: none; animation: dotPulse 1.5s ease-in-out infinite;
    }
    @keyframes dotPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.5);} }

    .mobile-input-bar {
      display: flex; flex-shrink: 0;
      background: #000; border-top: none;
      padding: 8px 12px; padding-bottom: calc(8px + var(--safe-bottom));
      gap: 8px; align-items: flex-end;
      transition: background-color 0.3s;
    }

    body.is-large-screen .layout-container { flex-direction: row; }
    body.is-large-screen .chat-main-panel { order: 1; }
    body.is-large-screen .panel-resizer { order: 2; }
    body.is-large-screen .left-set-panel {
      order: 3; width: 0; height: 100%;
      border-left: 1px solid #333; border-right: none; border-bottom: none;
      transition: width 0.3s ease, background-color 0.3s;
    }
    body.is-large-screen .left-set-panel.show {
      width: var(--panel-width); height: 100%;
    }
    body.is-large-screen #close-drawer-btn { display: none; }

    body.is-large-screen.panel-left .chat-main-panel { order: 3; }
    body.is-large-screen.panel-left .panel-resizer { order: 2; }
    body.is-large-screen.panel-left .left-set-panel {
      order: 1; border-left: none; border-right: 1px solid #333;
    }

    .panel-resizer { display: none; }
    body.is-large-screen .panel-resizer {
      display: block; width: 4px; background: #333;
      cursor: col-resize; flex-shrink: 0; transition: background 0.2s;
    }
    body.is-large-screen .panel-resizer:hover,
    body.is-large-screen .panel-resizer.active { background: #165DFF; }

    #swap-panel-btn { display: none; }
    body.is-large-screen #swap-panel-btn { display: inline-block; }

    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    .avatar-img, .avatar-placeholder {
      object-fit: cover; width: 100%; height: 100%; border-radius: 4px;
    }
    .msg-avatar {
      width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0;
      overflow: hidden; background: #1a1a1a;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #888;
      transition: background-color 0.3s;
    }
    .message-row { min-width: 0; width: 100%; }

    .chat-bubble-content {
      word-wrap: break-word; word-break: break-word; white-space: pre-wrap;
      max-width: 100%; overflow-wrap: break-word;
      font-size: var(--font-size); line-height: var(--line-height);
      padding: var(--bubble-py) var(--bubble-px);
      transition: font-size 0.2s, line-height 0.2s, background-color 0.3s, color 0.3s;
    }

    .ai-bubble {
      font-size: var(--ai-font-size, var(--font-size)) !important;
      line-height: var(--ai-line-height, var(--line-height)) !important;
      background-color: #000 !important; color: var(--ai-text-color); border: 1px solid #333;
    }
    .user-bubble { background-color: #000 !important; color: var(--user-text-color); border: 1px solid #333; }

    .katex { font-size: var(--ai-font-size); line-height: var(--ai-line-height); display: inline-block; vertical-align: bottom; }
    .collapsible-settings { display: none; }
    .name-tag { cursor: pointer; transition: all 0.2s; border-bottom: 1px dashed transparent; }
    .name-tag:hover { border-bottom-color: #888; color: #ccc; }
    .name-tag .fa-pencil { opacity: 0; transition: opacity 0.2s; font-size: 0.7em; margin-left: 4px; }
    .name-tag:hover .fa-pencil { opacity: 0.7; }
    .msg-name-label {
      font-size: 0.7em; opacity: 0.7; letter-spacing: 0.5px;
      margin-bottom: 3px; display: block; cursor: pointer;
    }

    .chat-header, .chat-footer { flex-shrink: 0; transition: background-color 0.3s; }
    .sync-status { font-size: 10px; opacity: 0.5; margin-top: 2px; }
    .mark-help { background: #0a0a0a; border: 1px solid #333; border-radius: 6px; padding: 8px 10px; font-size: 11px; line-height: 1.7; color: #aaa; }
    .mark-help code { background: #222; padding: 1px 4px; border-radius: 3px; color: #fff; font-family: monospace; }
    .preset-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .preset-row.full { grid-template-columns: 1fr; }
    .preset-label { font-size: 11px; color: #888; margin-bottom: 2px; }
    .preset-input { width: 100%; background: #000; border: 1px solid #333; border-radius: 4px; padding: 4px 6px; color: #fff; font-size: 12px; outline: none; }
    select.preset-input { height: 26px; }
    .preset-group-title { font-size: 12px; color: #ccc; margin: 10px 0 6px; padding-left: 4px; border-left: 2px solid #165DFF; }
    #close-drawer-btn { display: block; margin-left: auto; }

    .regenerate-btn-container { opacity: 0.7; transition: opacity 0.2s; }
    .regenerate-btn-container:hover { opacity: 1; }

    #file-upload-btn {
      background: transparent; border: none; color: #888; cursor: pointer;
      padding: 4px; display: flex; align-items: center; justify-content: center;
      transition: color 0.2s; width: 36px; height: 36px;
      border-radius: 50%; border: 1.5px solid #444; flex-shrink: 0;
    }
    #file-upload-btn:hover { color: #fff; border-color: #888; }
    #file-upload-btn i { font-size: 16px; }

    #send-btn {
      background: #165DFF; border: none; color: #fff; cursor: pointer;
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.2s; font-size: 16px;
    }
    #send-btn:hover { background: #3b7bff; transform: scale(1.05); }
    #send-btn:active { transform: scale(0.95); }
    #send-btn i { font-size: 16px; line-height: 1; }

    #msg-input {
      background: #121212; border: 1.5px solid #2a2a2a;
      border-radius: 20px; padding: 10px 16px; color: #fff;
      outline: none; font-size: 14px; transition: border-color 0.2s, background-color 0.3s;
      flex: 1; min-width: 0; resize: none;
      font-family: inherit; line-height: 1.5;
      max-height: 120px;
      overflow-y: auto;
    }
    #msg-input:focus { border-color: #444; }
    #msg-input::placeholder { color: #555; }
    #msg-input::-webkit-scrollbar { display: none; }

    /* === 悬浮球：相对侧栏定位，贴在侧栏右下角，不再 fixed 到视口 === */
    .prefs-fab {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #165DFF;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(22, 93, 255, 0.4);
      cursor: pointer;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.85);
      transition: opacity 0.25s ease, transform 0.25s ease, background-color 0.2s;
    }
    .left-set-panel.show .prefs-fab {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }
    /* 修正特异性：hover 放大需要比 .left-set-panel.show .prefs-fab 更高 */
    .left-set-panel.show .prefs-fab:hover { transform: scale(1.06); }
    .prefs-fab i { font-size: 22px; }

    /* === 抽屉（Drawer）：从右侧滑入，遮罩渐变 === */
    #preferences-modal {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(0, 0, 0, 0);
      pointer-events: none;
      transition: background-color 0.3s ease;
    }
    #preferences-modal.show {
      background: rgba(0, 0, 0, 0.55);
      pointer-events: auto;
    }
    .prefs-drawer {
      position: absolute; top: 0; right: 0; bottom: 0;
      width: min(420px, 88vw);
      background: #1e1e1e;
      border-left: 1px solid #333;
      box-shadow: -12px 0 40px rgba(0, 0, 0, 0.5);
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  background-color 0.3s, border-color 0.3s;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    #preferences-modal.show .prefs-drawer {
      transform: translateX(0);
    }

    /* === 双页横向容器：子页面滑入 === */
    .prefs-pages {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .prefs-page {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: #1e1e1e;
      will-change: transform, opacity;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.3s ease,
                  background-color 0.3s;
    }
    #prefs-main-page { transform: translateX(0); }
    #prefs-appearance-page { transform: translateX(100%); }
    .prefs-pages.show-appearance #prefs-main-page {
      transform: translateX(-25%);
      opacity: 0;
      pointer-events: none;
    }
    .prefs-pages.show-appearance #prefs-appearance-page {
      transform: translateX(0);
    }

    .prefs-header {
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 600;
      border-bottom: 1px solid #333;
      display: flex; align-items: center; gap: 12px;
      flex-shrink: 0;
      transition: border-color 0.3s, color 0.3s;
    }
    .prefs-header button {
      background: none; border: none; color: #fff;
      font-size: 16px; cursor: pointer;
      display: flex; align-items: center;
      transition: color 0.3s;
    }
    .prefs-header .prefs-close { margin-left: auto; }
    .prefs-list { padding: 8px; }
    .prefs-item {
      padding: 14px 16px;
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; border-radius: 8px; font-size: 15px;
      transition: background 0.2s;
    }
    .prefs-item:hover { background: rgba(255, 255, 255, 0.08); }
    .prefs-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    .prefs-group { margin-bottom: 24px; }
    .prefs-group-title {
      font-size: 14px; margin-bottom: 10px; color: #ccc; font-weight: 500;
      display: flex; justify-content: space-between;
      transition: color 0.3s;
    }
    .theme-options { display: flex; gap: 24px; }
    .theme-options label {
      display: flex; align-items: center; gap: 6px;
      font-size: 14px; cursor: pointer; color: #eee;
      transition: color 0.3s;
    }
    .prefs-slider {
      width: 100%; height: 6px; background: #333; border-radius: 3px;
      outline: none; -webkit-appearance: none;
    }
    .prefs-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 18px; height: 18px; border-radius: 50%;
      background: #165DFF; cursor: pointer; border: 2px solid #fff;
    }

    /* === 浅色模式 === */
    body.light-mode {
      background-color: #ffffff !important;
      color: #1a1d21 !important;
    }
    body.light-mode .layout-container,
    body.light-mode .left-set-panel,
    body.light-mode .chat-header,
    body.light-mode .mobile-input-bar,
    body.light-mode .chat-main-panel,
    body.light-mode #sample-preview-area,
    body.light-mode #chat-box {
      background-color: #f7f8fa !important;
      border-color: #e5e7eb !important;
    }
    body.light-mode .ai-bubble,
    body.light-mode .user-bubble {
      background-color: #ffffff !important;
      color: #1a1d21 !important;
      border-color: #e5e7eb !important;
    }
    body.light-mode .bg-dark,
    body.light-mode .bg-darker,
    body.light-mode .bg-black,
    body.light-mode .bg-gray-800 { background-color: #f3f4f6 !important; border-color: #e5e7eb !important; color: #1a1d21 !important; }
    body.light-mode .text-white,
    body.light-mode .text-gray-300,
    body.light-mode .text-gray-400,
    body.light-mode .text-gray-500 { color: #1a1d21 !important; }
    body.light-mode #msg-input { background: #fff !important; border-color: #d1d5db !important; color: #1a1d21 !important; }
    body.light-mode .prefs-drawer,
    body.light-mode .prefs-page { background: #ffffff !important; }
    body.light-mode .prefs-drawer { border-left-color: #e5e7eb !important; }
    body.light-mode .prefs-header { border-color: #e5e7eb; color: #1a1d21; }
    body.light-mode .prefs-header button { color: #1a1d21; }
    body.light-mode .prefs-item:hover { background: rgba(0, 0, 0, 0.05); }
    body.light-mode .prefs-group-title { color: #4b5563; }
    body.light-mode .theme-options label { color: #1a1d21; }
  </style>
</head>
<body>
<div class="layout-container">
  <!-- 设置侧栏 -->
  <div class="left-set-panel" id="left-panel">
    <div class="left-panel-inner scrollbar-hide">
      <div class="flex items-center mb-4">
        <button class="text-gray-400 hover:text-white" id="close-drawer-btn">
          <i class="fa fa-times fa-lg"></i>
        </button>
        <button class="text-gray-400 hover:text-white ml-2" id="swap-panel-btn" title="切换面板左右位置">
          <i class="fa fa-exchange"></i>
        </button>
      </div>
      <h1 class="text-xl font-bold mb-4 text-white">剧本/人设设置</h1>
      <div class="text-xs text-gray-400 mb-3 text-center" id="header-sync-status">正在连接云端...</div>
      <div class="flex gap-2 mb-4">
        <button class="flex-1 bg-gray-800 rounded p-2 text-sm text-white" id="clear-chat">清空聊天</button>
        <button class="flex-1 bg-gray-800 rounded p-2 text-sm text-white" id="reset-script">重置剧本</button>
      </div>

      <!-- AI回复模式切换 -->
      <div class="bg-dark border border-gray-800 rounded p-3 mb-3">
        <h3 class="text-sm font-medium mb-2 text-white">🤖 AI回复模式</h3>
        <div class="flex items-center justify-between mb-1">
          <label class="text-xs text-gray-300 font-medium">手动触发回复模式</label>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="reply-mode-toggle" class="sr-only peer">
            <div class="w-9 h-5 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-yellow-600"></div>
          </label>
        </div>
        <p class="mode-toggle-desc text-gray-500">
          <strong>关闭</strong>（默认）：发送消息后AI<strong>自动</strong>回复<br>
          <strong>开启</strong>：发送消息后AI<strong>不回复</strong>，可连续发送多条消息，点击下方的<strong>「⚡召唤AI回复」</strong>按钮后AI才回复
        </p>
        <div id="summon-area" class="mt-3 pt-3 border-t border-gray-700" style="display:none;">
          <div class="flex items-center justify-between gap-3 flex-wrap">
            <span id="summon-status-text" class="text-xs text-gray-400">暂无待回复消息</span>
            <button id="summon-btn" class="px-4 py-2 rounded-lg text-sm font-medium idle-btn" disabled>⚡ 召唤AI回复</button>
          </div>
        </div>
      </div>

      <button class="w-full bg-gray-800 rounded p-2 mb-3 text-sm text-white" id="toggle-mark-help">
        <i class="fa fa-info-circle mr-1"></i> 查看样式标记写法
      </button>

      <!-- 头像/全局样式设置 -->
      <button class="w-full bg-gray-800 rounded p-2 mb-3 text-sm text-white" id="toggle-settings">
        <i class="fa fa-cog mr-1"></i> 展开头像/全局样式设置
      </button>
      <div class="collapsible-settings bg-dark border border-gray-800 rounded p-3 mb-3 space-y-3" id="collapsible-settings">
        <div><h3 class="text-sm text-gray-400 mb-1">智能体名称</h3><input class="w-full bg-darker rounded p-2 text-white outline-none" id="agent-name-set"></div>
        <div><h3 class="text-sm text-gray-400 mb-1">智能体头像</h3><button class="w-full bg-accent/20 rounded p-2 text-sm mb-2 text-white" id="agent-avatar-upload">上传头像</button><input type="file" id="agent-avatar-file" class="hidden" accept="image/*"><div id="agent-avatar-preview" class="w-14 h-14 bg-accent/20 flex items-center justify-center overflow-hidden rounded-lg mx-auto"><span>预览</span></div></div>
        <div class="border-t border-gray-700 pt-3"><h3 class="text-sm text-gray-400 mb-1">你的名称</h3><input class="w-full bg-darker rounded p-2 text-white outline-none" id="user-name"></div>

        }

          if (data.typewriter_speed !== undefined && data.typewriter_speed !== null) {
            typewriterSpeed = data.typewriter_speed;
            document.getElementById('typewriter-speed').value = typewriterSpeed;
            document.getElementById('speed-display').textContent = typewriterSpeed + 'ms';
          }
          if (data.reply_mode !== undefined && data.reply_mode !== null) {
            replyMode = data.reply_mode;
            document.getElementById('reply-mode-toggle').checked = (replyMode === 'manual');
          }
          if (data.input_height_ratio !== undefined && data.input_height_ratio !== null) {
            document.getElementById('input-height-ratio').value = data.input_height_ratio;
            updateInputHeight();
          }
          if (data.show_version_regenerate !== undefined && data.show_version_regenerate !== null) {
            showVersionRegenerate = !!data.show_version_regenerate;
            document.getElementById('show-version-regenerate').checked = showVersionRegenerate;
          }
          agentNameDisplay.innerHTML = `${currentAgentName} <i class="fa fa-pencil"></i>`;
        }
        updateSyncStatus('online', '云端已连接');
        return true;
      } catch (err) {
        console.error('加载设置失败', err);
        updateSyncStatus('offline', '离线模式');
        return false;
      }
    }

    async function saveSettingsToCloud() {
      currentAgentName = agentNameSet.value.trim() || currentAgentName;
      currentUserName = userNameInput.value.trim() || currentUserName;

      const settings = {
        id: USER_ID,
        agent_prompt: agentPrompt.value,
        agent_name: currentAgentName,
        user_name: currentUserName,
        agent_avatar_url: agentAvatarUrl,
        user_avatar_url: userAvatarUrl,
        user_text_color: document.getElementById('user-text-color').value,
        ai_text_color: document.getElementById('ai-text-color').value,
        bubble_px: parseInt(document.getElementById('bubble-px').value) || 16,
        bubble_py: parseInt(document.getElementById('bubble-py').value) || 8,
        chat_h_padding: parseInt(document.getElementById('chat-h-padding').value) || 16,
        typewriter_speed: typewriterSpeed,
        reply_mode: replyMode,
        input_height_ratio: parseFloat(document.getElementById('input-height-ratio').value) || 0,
        panel_position: panelOnRight ? 'right' : 'left',
        show_version_regenerate: showVersionRegenerate,
        theme: themeMode,
        ai_font_size: aiFontSize,
        ai_line_height: aiLineHeight,
        updated_at: new Date().toISOString()
      };

      try {
        const { error } = await supabase.from('user_settings').upsert(settings, { onConflict: 'id' });
        if (error) throw error;
        updateSyncStatus('online', '设置已保存');
      } catch (err) {
        console.error('保存设置失败', err);
        updateSyncStatus('error', '仅本地有效');
      }
    }

    function updateSyncStatus(status, message) {
      if (headerSyncStatus) headerSyncStatus.textContent = message;
      isOnline = status === 'online';
    }

    // === 消息本地/云端 ===
    function saveMessagesToLocal() {
      try { localStorage.setItem('chat-messages', JSON.stringify(messages)); } catch (e) {}
    }
    function loadMessagesFromLocal() {
      try {
        const saved = localStorage.getItem('chat-messages');
        if (saved) {
          messages = JSON.parse(saved) || [];
          messages.forEach(msg => {
            if (msg.role === 'assistant') {
              if (!msg.versions) msg.versions = [msg.content];
              if (msg.currentVersion === undefined) msg.currentVersion = 0;
              if (!msg.local_id) msg.local_id = generateId();
            } else if (msg.role === 'user') {
              if (!msg.local_id) msg.local_id = generateId();
            }
          });
        }
      } catch (e) { messages = []; }
    }
    function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }

    async function loadMessagesFromCloud() {
      try {
        const { data, error } = await supabase
          .from('chat_messages')
          .select('role, content, created_at, local_id, versions, current_version, merged_user_message')
          .eq('user_id', USER_ID)
          .order('created_at', { ascending: true });
        if (error) throw error;
        if (data.length > 0) {
          messages = data.map(d => ({
            role: d.role, content: d.content, local_id: d.local_id || generateId(),
            versions: d.versions || (d.role === 'assistant' ? [d.content] : undefined),
            currentVersion: d.current_version !== undefined ? d.current_version : 0,
            mergedUserMessage: d.merged_user_message || undefined
          }));
          saveMessagesToLocal();
        } else {
          loadMessagesFromLocal();
          if (messages.length > 0) await syncLocalMessagesToCloud();
        }
        updateLastAIResponseIndex();
        return true;
      } catch (err) {
        loadMessagesFromLocal();
        updateLastAIResponseIndex();
        return false;
      }
    }
    async function syncLocalMessagesToCloud() {
      try {
        const messagesWithUserId = messages.map(msg => ({
          user_id: USER_ID, role: msg.role, content: msg.content, local_id: msg.local_id,
          versions: msg.versions || null, current_version: msg.currentVersion || 0,
          merged_user_message: msg.mergedUserMessage || null
        }));
        const { error } = await supabase.from('chat_messages').insert(messagesWithUserId);
        if (error) throw error;
        return true;
      } catch (err) { return false; }
    }

    // === 渲染 ===
    function renderLatex(el) {
      if (!el || typeof window.renderMathInElement !== 'function') return;
      try {
        window.renderMathInElement(el, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\(', right: '\\)', display: false },
            { left: '\\[', right: '\\]', display: true }
          ],
          throwOnError: false
        });
      } catch (e) {}
    }

    function addMessageToDOM(role, content, animate = false, index = null) {
      const isUser = role === 'user';
      const avatarSrc = isUser ? userAvatarUrl : agentAvatarUrl;
      const avatarInitial = isUser ? (currentUserName || '我').charAt(0) : (currentAgentName || 'AI').charAt(0);
      const senderName = isUser ? currentUserName : currentAgentName;
      const idx = index !== null ? index : messages.length - 1;

      const div = document.createElement('div');
      div.className = `message-row flex mb-4 ${isUser ? 'justify-end' : 'justify-start'} items-start gap-2`;
      div.setAttribute('data-role', role);
      div.setAttribute('data-msg-index', idx);

      const avatarHTML = avatarSrc
        ? `<img src="${avatarSrc}" class="avatar-img" alt="avatar">`
        : `<span>${avatarInitial}</span>`;

      if (isUser) {
        div.innerHTML = `<div class="max-w-[75%] flex flex-col items-end"><span class="msg-name-label text-right">${senderName}</span><div class="inline-block rounded-lg chat-bubble-content user-bubble">${content}</div></div><div class="msg-avatar">${avatarHTML}</div>`;
      } else {
        div.innerHTML = `<div class="msg-avatar">${avatarHTML}</div><div class="max-w-[75%] flex flex-col items-start"><span class="msg-name-label">${senderName}</span><div class="inline-block rounded-lg chat-bubble-content ai-bubble">${content}</div></div>`;
      }

      chatBox.appendChild(div);

      if (role === 'assistant' && animate) {
        typewriterEffect(content, div, idx);
      } else {
        renderLatex(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        if (role === 'assistant') {
          addRegenButtonToMessage(div, idx);
          const msg = messages[idx];
          if (msg && msg.versions && msg.versions.length > 1) updateVersionSwitcher(div, idx);
        }
      }
      return div;
    }

    function typewriterEffect(fullText, msgElement, msgIndex) {
      const bubble = msgElement.querySelector('.chat-bubble-content');
      let output = '';
      bubble.innerHTML = '';
      isTyping = true;
      updatePendingIndicator();
      const blocks = splitHTMLIntoBlocks(fullText);
      let blockIndex = 0;
      const interval = setInterval(() => {
        if (blockIndex < blocks.length) {
          output += blocks[blockIndex];
          bubble.innerHTML = output;
          chatBox.scrollTop = chatBox.scrollHeight;
          renderLatex(msgElement);
          blockIndex++;
        } else {
          clearInterval(interval);
          isTyping = false;
          const lastMsg = messages[msgIndex];
          if (lastMsg && lastMsg.role === 'assistant') {
            lastMsg.content = fullText;
            if (!lastMsg.versions) lastMsg.versions = [fullText];
            if (lastMsg.currentVersion === undefined) lastMsg.currentVersion = lastMsg.versions.indexOf(fullText);
            if (lastMsg.currentVersion === -1) lastMsg.currentVersion = 0;
            saveMessagesToLocal();
            supabase.from('chat_messages').upsert([{
              user_id: USER_ID, role: 'assistant', content: fullText, local_id: lastMsg.local_id,
              versions: lastMsg.versions, current_version: lastMsg.currentVersion,
              merged_user_message: lastMsg.mergedUserMessage || null
            }], { onConflict: 'local_id' }).then(({ error }) => {
              if (error) console.error('AI回复同步失败', error);
            });
          }
          addRegenButtonToMessage(msgElement, msgIndex);
          updateVersionSwitcher(msgElement, msgIndex);
          updateLastAIResponseIndex();
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      }, typewriterSpeed);
    }

    function renderStoredMessages() {
      chatBox.innerHTML = '';
      messages.forEach((msg, idx) => {
        if (msg.role === 'assistant' && msg.versions && msg.versions.length > 0) {
          addMessageToDOM(msg.role, msg.versions[msg.currentVersion] || msg.content, false, idx);
        } else {
          addMessageToDOM(msg.role, msg.content, false, idx);
        }
      });
      if (messages.length === 0) {
        addMessageToDOM('assistant', '欢迎使用剧本智能助手！点击左上角按钮设置剧本。', false, -1);
      }
      updateLastAIResponseIndex();
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function addMessage(role, content, animate = false, extraData = {}) {
      const local_id = generateId();
      const msg = { role, content, local_id, versions: role === 'assistant' ? [content] : undefined, currentVersion: 0, ...extraData };
      messages.push(msg);
      const idx = messages.length - 1;
      saveMessagesToLocal();
      if (role === 'user') {
        supabase.from('chat_messages').insert([{ user_id: USER_ID, role, content, local_id }]).then(({ error }) => {
          if (error) console.error('用户消息同步失败', error);
        });
      }
      addMessageToDOM(role, content, animate, idx);
      if (role === 'assistant' && !animate) updateLastAIResponseIndex();
      return idx;
    }

    // === 重新生成 / 版本切换 ===
    function addRegenButtonToMessage(msgElement, msgIndex) {
      if (!showVersionRegenerate) return;
      const msg = messages[msgIndex];
      if (!msg || msg.role !== 'assistant') return;
      if (msgElement.querySelector('.regen-wrap')) return;

      const bubbleWrap = msgElement.querySelector('.ai-bubble')?.parentElement;
      if (!bubbleWrap) return;

      const wrap = document.createElement('div');
      wrap.className = 'regen-wrap flex items-center gap-2 mt-1 text-xs text-gray-500';
      const btn = document.createElement('button');
      btn.className = 'regenerate-btn-container hover:text-white';
      btn.innerHTML = '<i class="fa fa-refresh"></i> 重新生成';
      btn.addEventListener('click', () => regenerateMessage(msgIndex));
      wrap.appendChild(btn);
      bubbleWrap.appendChild(wrap);
    }

    function updateVersionSwitcher(msgElement, msgIndex) {
      if (!showVersionRegenerate) return;
      const msg = messages[msgIndex];
      if (!msg || msg.role !== 'assistant' || !msg.versions || msg.versions.length <= 1) return;

      const bubbleWrap = msgElement.querySelector('.ai-bubble')?.parentElement;
      if (!bubbleWrap) return;

      let switcher = msgElement.querySelector('.version-switcher');
      if (!switcher) {
        switcher = document.createElement('div');
        switcher.className = 'version-switcher flex items-center gap-2 mt-1 text-xs text-gray-500';
        bubbleWrap.appendChild(switcher);
      }
      switcher.innerHTML = '';

      const prev = document.createElement('button');
      prev.innerHTML = '<i class="fa fa-chevron-left"></i>';
      prev.className = 'hover:text-white px-1';
      const label = document.createElement('span');
      label.textContent = `${msg.currentVersion + 1} / ${msg.versions.length}`;
      const next = document.createElement('button');
      next.innerHTML = '<i class="fa fa-chevron-right"></i>';
      next.className = 'hover:text-white px-1';

      prev.disabled = msg.currentVersion <= 0;
      next.disabled = msg.currentVersion >= msg.versions.length - 1;
      prev.style.opacity = prev.disabled ? '0.3' : '1';
      next.style.opacity = next.disabled ? '0.3' : '1';

      prev.addEventListener('click', () => switchVersion(msgIndex, -1));
      next.addEventListener('click', () => switchVersion(msgIndex, 1));

      switcher.append(prev, label, next);
    }

    function switchVersion(msgIndex, delta) {
      const msg = messages[msgIndex];
      if (!msg || !msg.versions) return;
      const newV = msg.currentVersion + delta;
      if (newV < 0 || newV >= msg.versions.length) return;
      msg.currentVersion = newV;
      msg.content = msg.versions[newV];
      saveMessagesToLocal();
      supabase.from('chat_messages').upsert([{
        user_id: USER_ID, role: 'assistant', content: msg.content, local_id: msg.local_id,
        versions: msg.versions, current_version: msg.currentVersion,
        merged_user_message: msg.mergedUserMessage || null
      }], { onConflict: 'local_id' }).then(({ error }) => { if (error) console.error(error); });

      const row = chatBox.querySelector(`[data-msg-index="${msgIndex}"]`);
      if (!row) return;
      const bubble = row.querySelector('.ai-bubble');
      if (bubble) { bubble.innerHTML = msg.content; renderLatex(row); }
      updateVersionSwitcher(row, msgIndex);
    }

    function getLastUserMessageBefore(idx) {
      for (let i = idx - 1; i >= 0; i--) {
        if (messages[i].role === 'user') return messages[i].content;
      }
      return '';
    }

    async function regenerateMessage(msgIndex) {
      if (isTyping) return;
      const msg = messages[msgIndex];
      if (!msg || msg.role !== 'assistant') return;
      const userContent = msg.mergedUserMessage || getLastUserMessageBefore(msgIndex);
      if (!userContent) return;

      const row = chatBox.querySelector(`[data-msg-index="${msgIndex}"]`);
      const bubble = row ? row.querySelector('.ai-bubble') : null;
      if (bubble) bubble.textContent = '重新生成中...';

      const reply = await getAIResponse(userContent);

      msg.versions = msg.versions || [msg.content];
      msg.versions.push(reply);
      msg.currentVersion = msg.versions.length - 1;
      msg.content = reply;
      saveMessagesToLocal();
      supabase.from('chat_messages').upsert([{
        user_id: USER_ID, role: 'assistant', content: reply, local_id: msg.local_id,
        versions: msg.versions, current_version: msg.currentVersion,
        merged_user_message: msg.mergedUserMessage || null
      }], { onConflict: 'local_id' }).then(({ error }) => { if (error) console.error(error); });

      if (bubble) { bubble.innerHTML = reply; renderLatex(row); }
      if (row) updateVersionSwitcher(row, msgIndex);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // === 剧本格式解析 ===
    function parseScriptFormat(text) {
      let result = text;
      const outer = stylePresets.action.outer;
      const inner = stylePresets.action.inner;
      const prefix = stylePresets.action.prefix;
      const suffix = stylePresets.action.suffix;
      const hideBrackets = stylePresets.hideBrackets;

      result = result.replace(/\[action:(.*?)\]/g,
        `<span style="color:${outer.color};font-size:${outer.size}px;font-weight:${outer.weight};line-height:1.4;">${prefix}</span>` +
        `<span style="color:${inner.color};font-size:${inner.size}px;font-weight:${inner.weight};line-height:1.4;">$1</span>` +
        `<span style="color:${outer.color};font-size:${outer.size}px;font-weight:${outer.weight};line-height:1.4;">${suffix}</span>`
      );

      if (hideBrackets) {
        result = result.replace(/【(.*?)】/g,
          `<span style="color:${inner.color};font-size:${inner.size}px;font-weight:${inner.weight};line-height:1.4;">$1</span>`
        );
      } else {
        result = result.replace(/【(.*?)】/g,
          `<span style="color:${outer.color};font-size:${outer.size}px;font-weight:${outer.weight};line-height:1.4;">【</span>` +
          `<span style="color:${inner.color};font-size:${inner.size}px;font-weight:${inner.weight};line-height:1.4;">$1</span>` +
          `<span style="color:${outer.color};font-size:${outer.size}px;font-weight:${outer.weight};line-height:1.4;">】</span>`
        );
      }

      const emph = stylePresets.emph;
      result = result.replace(/\[emph:(.*?)\]/g, `<span style="color:${emph.color};font-size:${emph.size}px;font-weight:${emph.weight};line-height:1.4;">$1</span>`);
      result = result.replace(/\[br\]/g, '<br>');
      result = result.replace(/\[b:(.*?)\]/g, '<strong>$1</strong>');
      result = result.replace(/\[gray:(.*?)\]/g, '<span style="color:#888888;font-weight:300;">$1</span>');
      result = result.replace(/\[red:(.*?)\]/g, '<span style="color:#ff4444;">$1</span>');
      result = result.replace(/\[color:([#a-zA-Z0-9]+):(.*?)\]/g, '<span style="color:$1;">$2</span>');
      result = result.replace(/\[size:(\d+):(.*?)\]/g, '<span style="font-size:$1px;line-height:1.4;">$2</span>');
      return result;
    }

    async function getAIResponse(userMessage) {
      const script = agentPrompt.value.trim();
      if (!script) return "请先在左侧设置中填写剧本内容（向下滚动即可看到剧本输入框）。";
      const systemPrompt = `你是一个严格按照剧本回答问题的助手。
【最高优先级规则，必须100%遵守】
1. 所有回答只能来自下面的剧本内容，绝对不能编造任何剧本里没有的信息。
2. 如果用户的问题剧本里没有答案，只说"这个我暂时不知道哦"。
3. 【格式铁则】
    - 所有动作、神态、语气、场景备注，必须用中文方括号【】完整包裹，放在句子对应位置，绝对不能直接写在正文里。
    - 需要重点强调的关键词，可以加粗显示。
    - 需要换行的地方直接换行。
4. 正确示例：【挑眉轻笑】你说什么？我没听清。
5. 错误示例：挑眉笑着说："你说什么？我没听清。"
6. 不要加任何剧本以外的解释或客套话。
--- 剧本开始 ---
${script}
--- 剧本结束 ---`;
      try {
        const response = await fetch(AI_PROXY_URL, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userMessage }] }),
        });
        if (!response.ok) {
          let errorMsg = '请求失败，状态码：' + response.status;
          try { errorMsg = (await response.json()).error?.message || errorMsg; } catch (_) {}
          throw new Error(errorMsg);
        }
        const data = await response.json();
        if (data.error) return `云端服务提示：${data.error.message || JSON.stringify(data.error)}`;
        if (!data || !data.choices || !Array.isArray(data.choices) || data.choices.length === 0) {
          return `⚠️ AI返回格式异常，无法解析。原始数据预览：${JSON.stringify(data).substring(0, 200)}`;
        }
        const choice = data.choices[0];
        if (!choice.message || typeof choice.message.content !== 'string') return '⚠️ AI返回消息格式异常';
        return parseScriptFormat(choice.message.content.trim());
      } catch (error) {
        return `AI 模式出错：${error.message}<br>请检查 Supabase Edge Function 是否部署正常。`;
      }
    }

    // === 待回复 / 召唤 ===
    function getPendingCount() {
      let count = 0;
      for (let i = lastAIResponseIndex + 1; i < messages.length; i++) {
        if (messages[i].role === 'user') count++;
      }
      return count;
    }
    function getPendingUserMessagesContent() {
      const pending = [];
      for (let i = lastAIResponseIndex + 1; i < messages.length; i++) {
        if (messages[i].role === 'user') pending.push(messages[i].content);
      }
      return pending.join('\n\n');
    }
    function updatePendingIndicator() {
      const count = getPendingCount();
      const isManual = replyMode === 'manual';
      if (summonArea) {
        if (isManual) {
          summonArea.style.display = 'block';
          summonBtn.classList.remove('active-btn', 'typing-btn', 'idle-btn');
          if (isTyping) {
            summonStatusText.textContent = '⏳ AI正在回复中...';
            summonStatusText.className = 'text-xs text-gray-400';
            summonBtn.textContent = '⏳ 回复中...';
            summonBtn.classList.add('typing-btn');
            summonBtn.disabled = true;
          } else if (count > 0) {
            summonStatusText.textContent = '📩 已发送 ' + count + ' 条消息，AI等待召唤中';
            summonStatusText.className = 'text-xs has-pending';
            summonBtn.textContent = '⚡ 召唤AI回复';
            summonBtn.classList.add('active-btn');
            summonBtn.disabled = false;
          } else {
            summonStatusText.textContent = '暂无待回复消息，发送消息后可召唤AI';
            summonStatusText.className = 'text-xs text-gray-400';
            summonBtn.textContent = '⚡ 召唤AI回复';
            summonBtn.classList.add('idle-btn');
            summonBtn.disabled = true;
          }
        } else {
          summonArea.style.display = 'none';
        }
      }
      if (pendingDot) pendingDot.style.display = (isManual && count > 0 && !isTyping) ? 'block' : 'none';
    }
    function updateLastAIResponseIndex() {
      let lastIdx = -1;
      for (let i = messages.length - 1; i >= 0; i--) {
        if (messages[i].role === 'assistant') { lastIdx = i; break; }
      }
      lastAIResponseIndex = lastIdx;
      updatePendingIndicator();
    }

    async function triggerAIReply() {
      if (isTyping) return;
      const pendingContent = getPendingUserMessagesContent();
      if (!pendingContent) return;
      updatePendingIndicator();

      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message-row flex mb-4 justify-start items-start gap-2';
      loadingDiv.setAttribute('data-loading', 'true');
      loadingDiv.innerHTML = `<div class="msg-avatar">${agentAvatarUrl ? `<img src="${agentAvatarUrl}" class="avatar-img" alt="avatar">` : (currentAgentName || 'AI').charAt(0)}</div><div class="max-w-[75%] flex flex-col items-start"><span class="msg-name-label">${currentAgentName}</span><div class="inline-block rounded-lg ai-bubble chat-bubble-content">思考中...</div></div>`;
      chatBox.appendChild(loadingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      const reply = await getAIResponse(pendingContent);
      if (chatBox.contains(loadingDiv)) chatBox.removeChild(loadingDiv);

      const local_id = generateId();
      const msg = { role: 'assistant', content: reply, local_id, versions: [reply], currentVersion: 0, mergedUserMessage: pendingContent };
      messages.push(msg);
      const idx = messages.length - 1;
      saveMessagesToLocal();
      addMessageToDOM('assistant', reply, true, idx);
    }

    async function sendMessage() {
      const value = msgInput.value.trim();
      if (!value) return;
      await addMessage('user', value);
      msgInput.value = '';
      if (inputHeightRatio === 0) autoResizeTextarea();
      else updateInputHeight();

      if (replyMode === 'auto') {
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'message-row flex mb-4 justify-start items-start gap-2';
        loadingDiv.setAttribute('data-loading', 'true');
        loadingDiv.innerHTML = `<div class="msg-avatar">${agentAvatarUrl ? `<img src="${agentAvatarUrl}" class="avatar-img" alt="avatar">` : (currentAgentName || 'AI').charAt(0)}</div><div class="max-w-[75%] flex flex-col items-start"><span class="msg-name-label">${currentAgentName}</span><div class="inline-block rounded-lg ai-bubble chat-bubble-content">思考中...</div></div>`;
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        const reply = await getAIResponse(value);
        if (chatBox.contains(loadingDiv)) chatBox.removeChild(loadingDiv);
        await addMessage('assistant', reply, true);
      } else {
        updatePendingIndicator();
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    // === 其他按钮 ===
    document.getElementById('clear-chat').addEventListener('click', async () => {
      if (!confirm('确定清空所有聊天记录？')) return;
      messages = [];
      lastAIResponseIndex = -1;
      chatBox.innerHTML = '';
      saveMessagesToLocal();
      try { await supabase.from('chat_messages').delete().eq('user_id', USER_ID); } catch (e) {}
      renderStoredMessages();
    });

    document.getElementById('reset-script').addEventListener('click', () => {
      if (!confirm('确定清空剧本内容？')) return;
      agentPrompt.value = '';
      saveSettingsToCloud();
    });

    saveSetBtn.addEventListener('click', async () => {
      await saveSettingsToCloud();
      alert('设置已保存');
    });

    agentNameSet.addEventListener('change', () => {
      currentAgentName = agentNameSet.value.trim() || currentAgentName;
      agentNameDisplay.innerHTML = `${currentAgentName} <i class="fa fa-pencil"></i>`;
      saveSettingsToCloud();
    });
    userNameInput.addEventListener('change', () => {
      currentUserName = userNameInput.value.trim() || currentUserName;
      saveSettingsToCloud();
    });

    agentNameDisplay.addEventListener('click', () => {
      const name = prompt('修改智能体名称', currentAgentName);
      if (name && name.trim()) {
        currentAgentName = name.trim();
        agentNameSet.value = currentAgentName;
        agentNameDisplay.innerHTML = `${currentAgentName} <i class="fa fa-pencil"></i>`;
        saveSettingsToCloud();
      }
    });

    document.getElementById('toggle-mark-help').addEventListener('click', () => {
      alert('样式标记写法：\n\n【动作/神态】\n[emph:强调文字]\n[b:加粗]\n[red:红字]\n[gray:灰字]\n[color:#ff0000:彩色文字]\n[size:20:放大文字]\n[br] 换行\n[action:动作]');
    });

    document.getElementById('file-upload-btn').addEventListener('click', () => document.getElementById('file-input').click());
    document.getElementById('file-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.type.startsWith('image/')) {
        alert('暂不支持直接发送图片，可先上传为头像或手动粘贴文字。');
        e.target.value = '';
        return;
      }
      try {
        const text = await file.text();
        msgInput.value += (msgInput.value ? '\n\n' : '') + text.slice(0, 4000);
        autoResizeTextarea();
      } catch (err) {
        alert('文件读取失败');
      }
      e.target.value = '';
    });

    // 初始化
    async function init() {
      updateLayoutMode();
      loadMessagesFromLocal();
      await loadSettingsFromCloud();
      await loadMessagesFromCloud();
      renderStoredMessages();
      autoResizeTextarea();
      updatePendingIndicator();
    }

    window.addEventListener('resize', debounce(updateLayoutMode, 150));

    init();
  })();
</script>
</body>
</html>
