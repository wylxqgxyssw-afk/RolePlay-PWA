<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>角色扮演 · RolePlay Chat</title>
<link rel="manifest" href="manifest-chat.json">
<meta name="theme-color" content="#000000">
<style>
*{box-sizing:border-box;}
:root{
  --bg:#0d0f16; --panel:#141824; --panel-2:#1c2130; --border:#2a3040;
  --text:#e7e9f0; --muted:#8b93a7; --accent:#7c6cff;
}
html,body{height:100%;height:100dvh;margin:0;}
body{
  background:var(--bg);color:var(--text);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;
}
button{font-family:inherit;}
.app{display:flex;height:100%;height:100dvh;}

/* ---------- 登录遮罩层 ---------- */
#auth-overlay{
  position:fixed;inset:0;z-index:999;
  background:rgba(13,15,22,0.98);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;transition:opacity 0.3s;
}
#auth-overlay.hidden{opacity:0;pointer-events:none;}
.auth-card{
  width:100%;max-width:380px;background:var(--panel);
  border:1px solid var(--border);border-radius:16px;
  padding:28px 24px;box-shadow:0 10px 40px rgba(0,0,0,0.5);
}
.auth-card h2{font-size:20px;font-weight:600;margin:0 0 8px 0;text-align:center;}
.auth-card p{font-size:13px;color:var(--muted);text-align:center;margin:0 0 20px 0;}
.auth-card input{
  width:100%;background:var(--panel-2);border:1px solid var(--border);
  color:var(--text);border-radius:9px;padding:12px;font-size:14px;margin-bottom:12px;outline:none;
}
.auth-card input:focus{border-color:var(--accent);}
.auth-card button{
  width:100%;padding:12px;border-radius:9px;font-size:14px;font-weight:600;
  cursor:pointer;transition:0.2s;border:none;
}
.btn-login{background:var(--accent);color:#fff;margin-bottom:10px;}
.btn-login:hover{filter:brightness(1.1);}
.btn-register{background:transparent;color:var(--text);border:1px solid var(--border) !important;}
.btn-register:hover{background:var(--panel-2);}
.auth-msg{font-size:12px;text-align:center;margin-top:12px;min-height:18px;}
.auth-msg.error{color:#ff8080;}
.auth-msg.success{color:#6bff8b;}

/* ---------- 侧栏 ---------- */
#sidebar{
  width:330px;flex:0 0 330px;background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;
}
.side-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;
}
.side-body{flex:1;overflow-y:auto;padding:16px;}
.side-body section{margin-bottom:22px;}
.side-body h3{
  font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin:0 0 8px;font-weight:600;
}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 5px;}
input,textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--border);
  color:var(--text);border-radius:9px;padding:9px 11px;font-size:13.5px;
  font-family:inherit;outline:none;transition:border-color .15s;
}
input:focus,textarea:focus{border-color:var(--accent);}
textarea{resize:vertical;line-height:1.55;}
input[type=range]{padding:0;background:none;border:none;-webkit-appearance:none;appearance:none;height:20px;}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--border);border-radius:2px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);margin-top:-5.5px;cursor:pointer;}
.side-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-direction:column;}
.side-foot .btn{width:100%;}
.btn-logout{background:transparent;color:#ff8080;border:1px solid #ff8080;margin-top:6px;}
.btn-logout:hover{background:rgba(255,128,128,0.1);}

/* ---------- 按钮 ---------- */
.btn{
  background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13.5px;transition:.15s;
}
.btn:hover{border-color:var(--accent);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.sm{padding:6px 11px;font-size:12.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.icon-btn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:8px;}
.icon-btn:hover{color:var(--text);background:var(--panel-2);}

/* ---------- 聊天区 ---------- */
.chat{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
.chat-head{
  display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--border);background:rgba(20,24,36,.72);
  backdrop-filter:blur(10px);
}
.chat-head .title{display:flex;flex-direction:column;line-height:1.3;flex:1;min-width:0;}
.chat-head .title .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chat-head .sub{font-size:11.5px;color:var(--muted);}
.head-actions{display:flex;gap:6px;}
#menuBtn{display:none;}

#messages{
  flex:1;overflow-y:auto;padding:22px 18px 10px;
  display:flex;flex-direction:column;gap:18px;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
}
.msg{display:flex;flex-direction:column;max-width:min(78%,760px);animation:pop .18s ease;}
@keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.msg.user{align-self:flex-end;}
.msg.assistant{align-self:flex-start;}
.msg .meta{font-size:11.5px;color:var(--muted);margin-bottom:5px;padding:0 4px;}
.msg.user .meta{text-align:right;}
.msg .content{
  padding:11px 15px;border-radius:16px;line-height:1.72;
  word-break:break-word;overflow-wrap:anywhere;
}
.msg.user .content{background:linear-gradient(135deg,#5b4bff,#3f7bff);color:#fff;border-bottom-right-radius:5px;}
.msg.assistant .content{background:var(--panel-2);border:1px solid var(--border);border-bottom-left-radius:5px;}
.msg .content em{color:#a99cff;font-style:italic;}
.msg.user .content em{color:#e2e8ff;}
.err{color:#ff8080;font-size:12.5px;margin-top:8px;white-space:pre-wrap;line-height:1.5;}
.muted{color:var(--muted);}
.cursor{display:inline-block;width:7px;height:1em;background:var(--accent);
  vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite;}
@keyframes blink{50%{opacity:0;}}

.composer{
  display:flex;gap:10px;align-items:flex-end;
  padding:12px 16px 16px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);background:var(--panel);
}
#input{
  flex:1;resize:none;max-height:180px;min-height:44px;
  line-height:1.55;padding:11px 14px;border-radius:12px;overflow-y:auto;
}
#sendBtn{
  height:44px;padding:0 22px;border-radius:12px;background:var(--accent);
  border:none;color:#fff;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:.15s;
}
#sendBtn:hover{filter:brightness(1.1);}
#sendBtn.stop{background:#e05252;}

#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none;}

@media(max-width:860px){
  #menuBtn{display:block;}
  #sidebar{
    position:fixed;top:0;bottom:0;left:0;z-index:50;
    width:min(88vw,340px);flex-basis:auto;
    transform:translateX(-100%);transition:transform .25s ease;
  }
  body.side-open #sidebar{transform:none;}
  body.side-open #backdrop{display:block;}
  .msg{max-width:90%;}
  input, textarea { font-size: 16px !important; }
  .btn.sm { padding: 10px 14px; font-size: 13.5px; }
}
@media(max-width:640px){
  #exportBtn{display:none;}
  #messages{padding:16px 12px 8px;}
  .composer{padding:10px 12px 12px;padding-bottom: calc(12px + env(safe-area-inset-bottom));}
}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#2a3040;border-radius:5px;}
::-webkit-scrollbar-thumb:hover{background:#3a4256;}
::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>

<div id="auth-overlay" class="hidden">
  <div class="auth-card">
    <h2 id="auth-title">欢迎回来</h2>
    <p id="auth-subtitle">登录以同步您的角色与聊天记录</p>
    <input type="email" id="auth-email" placeholder="邮箱地址" autocomplete="email">
    <input type="password" id="auth-password" placeholder="密码（至少6位）" autocomplete="current-password">
    <button class="btn-login" id="auth-login-btn">登录</button>
    <button class="btn-register" id="auth-register-btn">没有账号？点击注册</button>
    <div class="auth-msg" id="auth-msg"></div>
  </div>
</div>

<div class="app">
  <aside id="sidebar">
    <div class="side-head">
      <span>设置</span>
      <button class="icon-btn" id="closeSide" title="关闭">✕</button>
    </div>
    <div class="side-body">
      <section>
        <h3>接口配置</h3>
        <label>API 地址（Base URL）</label>
        <input id="apiBase" placeholder="https://api.openai.com/v1" spellcheck="false">
        <label>API Key</label>
        <input id="apiKey" type="password" placeholder="sk-..." spellcheck="false">
        <label>模型名</label>
        <input id="model" placeholder="gpt-4o-mini" spellcheck="false">
        <label>温度 <span id="tempVal">0.85</span></label>
        <input id="temperature" type="range" min="0" max="2" step="0.05" value="0.85">
        <label>单次最大回复长度（tokens）</label>
        <input id="maxTokens" type="number" min="64" max="32000" step="64">
        <label>上下文保留条数</label>
        <input id="ctxLimit" type="number" min="4" max="200" step="2">
      </section>

      <section>
        <h3>角色设定</h3>
        <label>角色名</label>
        <input id="charName" spellcheck="false">
        <label>角色人设 / 世界观</label>
        <textarea id="charPrompt" rows="8" spellcheck="false"></textarea>
        <label>开场白（新对话时使用）</label>
        <textarea id="greeting" rows="4" spellcheck="false"></textarea>
      </section>

      <section>
        <h3>你的设定</h3>
        <label>你的名字</label>
        <input id="userName" spellcheck="false">
        <label>你的人设（可留空）</label>
        <textarea id="userPrompt" rows="3" spellcheck="false"></textarea>
      </section>
    </div>
    <div class="side-foot">
      <button class="btn primary" id="applyBtn">应用并新开对话</button>
      <button class="btn btn-logout" id="logoutBtn">退出登录</button>
    </div>
  </aside>

  <div id="backdrop"></div>

  <main class="chat">
    <header class="chat-head">
      <button class="icon-btn" id="menuBtn" title="设置">☰</button>
      <div class="title">
        <span class="n" id="headName">角色</span>
        <span class="sub">角色扮演对话</span>
      </div>
      <div class="head-actions">
        <button class="btn sm" id="regenBtn">重新生成</button>
        <button class="btn sm" id="newBtn">新对话</button>
        <button class="btn sm" id="exportBtn">导出</button>
      </div>
    </header>

    <div id="messages"></div>

    <div class="composer">
      <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="sendBtn">发送</button>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ---------- Supabase 初始化 ---------- */
const SUPABASE_URL = 'https://bpkipmnvvrjsfckzhfrl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_K5hZV5mkiX0GHchcYIr7dQ_Z7ICn1mu';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = s => document.querySelector(s);
let USER_ID = null;

const DEFAULTS = {
  apiBase: 'https://token.xsxc.site/v1',
  apiKey: 'dp_53d5cdede7ca46e645a4a647624a',
  model: 'deepseek-v4-pro',
  temperature: 0.85,
  maxTokens: 1024,
  ctxLimit: 30,
  charName: '林澈',
  charPrompt: '24岁，老城区一家独立书店的店主。\n性格：表面冷淡、话少，实则细心温柔，习惯用行动而非言语表达关心。\n说话风格：短句，偶尔带点调侃，很少用感叹号。\n背景：书店生意清淡，但他从没打算关门。',
  greeting: '*傍晚，店里只剩一盏暖黄的灯。他头也不抬地翻着书页，直到门铃响起，才慢慢抬眼。*\n\n"……随便看。想喝点什么的话，壶里有茶。"',
  userName: '旅人',
  userPrompt: '一个刚搬来这座城市的人，喜欢在傍晚散步。'
};

const CFG_KEYS = ['apiBase','apiKey','model','temperature','maxTokens','ctxLimit',
                  'charName','charPrompt','greeting','userName','userPrompt'];

let cfg = loadCfg();
let msgs = [];
let busy = false;
let abortCtrl = null;

/* ---------- 锁与状态标志（防重复） ---------- */
let hasBoundEvents = false;
let currentLoadedUserId = null;

/* ---------- 配置读写 ---------- */
function loadCfg(){
  try{
    const raw = localStorage.getItem('rp_cfg');
    return raw ? Object.assign({}, DEFAULTS, JSON.parse(raw)) : Object.assign({}, DEFAULTS);
  }catch(e){ return Object.assign({}, DEFAULTS); }
}
function saveCfg(){ try{ localStorage.setItem('rp_cfg', JSON.stringify(cfg)); }catch(e){} }
function saveHistory(){ try{ localStorage.setItem('rp_history', JSON.stringify(msgs.slice(-300))); }catch(e){} }
function clearLocalData(){
  localStorage.removeItem('rp_cfg');
  localStorage.removeItem('rp_history');
}

/* ---------- 【修复核心1】从 Supabase 拉取角色配置 (解决406报错) ---------- */
async function fetchAgentSettings() {
    if (!USER_ID) return false;
    try {
        const { data, error } = await supabaseClient
            .from('agent_settings')
            .select('agent_name, agent_prompt')
            .eq('id', USER_ID)
            .maybeSingle(); // 【关键修复】改用 maybeSingle()，查不到数据不报错，返回 null

        if (error) {
            console.warn('⚠️ Supabase 拉取失败:', error.message);
            return false;
        }

        if (data) {
            console.log('✅ 成功从 Supabase 获取角色配置:', data);
            if (data.agent_name) cfg.charName = data.agent_name;
            if (data.agent_prompt) cfg.charPrompt = data.agent_prompt;
            saveCfg();
            if ($('#charName')) $('#charName').value = cfg.charName;
            if ($('#charPrompt')) $('#charPrompt').value = cfg.charPrompt;
            updateHeadName();
            return true;
        } else {
            // 【新增逻辑】新用户首次登录，无数据，自动向云端写入默认设定
            console.log('🌱 新用户首次登录，正在向云端写入默认配置...');
            const { error: insertError } = await supabaseClient.from('agent_settings').insert({
                id: USER_ID,
                agent_name: cfg.charName,
                agent_prompt: cfg.charPrompt
            });
            if (insertError) console.error('❌ 写入默认配置失败:', insertError.message);
            return false;
        }
    } catch (e) {
        console.error('❌ Supabase 请求异常:', e);
    }
    return false;
}

/* ---------- 向 Supabase 推送并保存配置 ---------- */
async function saveAgentSettings() {
    if (!USER_ID) { alert('请先登录后再保存设置！'); return; }
    try {
        const { error } = await supabaseClient
            .from('agent_settings')
            .upsert({ 
                id: USER_ID, 
                agent_name: cfg.charName, 
                agent_prompt: cfg.charPrompt 
            });
        if (error) console.error('❌ 保存到云端失败:', error.message);
        else console.log('✅ 成功保存到云端!');
    } catch (e) { console.error('❌ 保存请求异常:', e); }
}

/* ---------- 文本处理 ---------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderContent(s){
  let h = escapeHtml(s || '');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\*(.+?)\*/g, '<em>$1</em>');
  h = h.replace(/\n/g, '<br>');
  return h;
}

/* ---------- 表单初始化 ---------- */
function initForm(){
  CFG_KEYS.forEach(k => {
    const el = document.getElementById(k);
    if(!el) return;
    el.value = cfg[k];
    const handler = () => {
      if(el.type === 'number' || el.type === 'range') cfg[k] = Number(el.value);
      else cfg[k] = el.value;
      if(k === 'temperature') $('#tempVal').textContent = Number(cfg.temperature).toFixed(2);
      if(k === 'charName') updateHeadName();
      saveCfg();
    };
    el.addEventListener('input', handler);
    el.addEventListener('change', handler);
  });
  $('#tempVal').textContent = Number(cfg.temperature).toFixed(2);
}

function updateHeadName(){ $('#headName').textContent = cfg.charName || '角色'; }

/* ---------- 消息气泡 ---------- */
const msgBox = $('#messages');

function addBubble(role, content){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const name = role === 'user' ? (cfg.userName || '你') : (cfg.charName || '角色');
  wrap.innerHTML = '<div class="meta">' + escapeHtml(name) + '</div><div class="content"></div>';
  wrap.querySelector('.content').innerHTML = renderContent(content);
  msgBox.appendChild(wrap);
  scrollBottom(true);
  return wrap;
}

function scrollBottom(force){
  if(!force){
    const near = msgBox.scrollHeight - msgBox.scrollTop - msgBox.clientHeight < 160;
    if(!near) return;
  }
  msgBox.scrollTop = msgBox.scrollHeight;
}

/* ---------- 构造请求 ---------- */
function endpoint(){
  let base = String(cfg.apiBase || '').trim().replace(/\/+$/, '');
  if(!base) throw new Error('请先在左侧填写 API 地址');
  if(/\/chat\/completions$/i.test(base)) return base;
  return base + '/chat/completions';
}

function systemPrompt(){
  const parts = [];
  parts.push('你正在进行沉浸式的角色扮演对话。请始终保持角色，用第一人称自然地说话，不要以 AI 助手的身份回应，不要解释规则，不要跳出角色。');
  parts.push('【你的角色】' + (cfg.charName || '角色') + (cfg.charPrompt ? '\n' + cfg.charPrompt : ''));
  parts.push('【对话对象】' + (cfg.userName || '用户') + (cfg.userPrompt ? '\n' + cfg.userPrompt : ''));
  parts.push('动作、神态、环境描写用 *星号* 包裹。回复长度贴合语境，像真人聊天一样自然。');
  return parts.join('\n\n');
}

function buildMessages(){
  const limit = Math.max(2, Number(cfg.ctxLimit) || 30);
  const hist = msgs.slice(-limit).map(m => ({role: m.role, content: m.content}));
  return [{role:'system', content: systemPrompt()}].concat(hist);
}

/* ---------- 核心：发送并流式接收 ---------- */
async function generate(){
  if(busy || msgs.length === 0) return;
  busy = true;
  setBusyUI(true);

  const bubble = addBubble('assistant', '');
  const contentEl = bubble.querySelector('.content');
  contentEl.innerHTML = '<span class="cursor"></span>';

  let full = '';
  abortCtrl = new AbortController();

  try{
    const payload = { model: cfg.model, messages: buildMessages(), temperature: Number(cfg.temperature), max_tokens: Number(cfg.maxTokens), stream: true };
    const res = await fetch(endpoint(), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (cfg.apiKey || '') },
      body: JSON.stringify(payload),
      signal: abortCtrl.signal
    });

    if(!res.ok){
      const txt = await res.text().catch(() => '');
      throw new Error('HTTP ' + res.status + ' ' + res.statusText + (txt ? '\n' + txt.slice(0, 500) : ''));
    }
    if(!res.body) throw new Error('该接口未返回可读流（可能不支持 stream）');

    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buf = '';

    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += decoder.decode(value, {stream: true});
      const lines = buf.split('\n');
      buf = lines.pop();

      for(const raw of lines){
        const line = raw.trim();
        if(!line || line.startsWith(':') || !line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if(data === '[DONE]') continue;
        let json;
        try{ json = JSON.parse(data); }catch(e){ continue; }
        const choice = json.choices && json.choices[0];
        if(!choice) continue;
        const delta = (choice.delta && choice.delta.content) ?? (choice.message && choice.message.content) ?? '';
        if(delta){
          full += delta;
          contentEl.innerHTML = renderContent(full) + '<span class="cursor"></span>';
          scrollBottom(true);
        }
      }
    }

    if(full.trim()){
      contentEl.innerHTML = renderContent(full);
      msgs.push({role:'assistant', content: full});
    }else{
      contentEl.innerHTML = '<span class="muted">（模型返回了空内容，请检查API配置）</span>';
    }

  }catch(err){
    if(err.name === 'AbortError'){
      if(full.trim()){ contentEl.innerHTML = renderContent(full) + '<div class="err">（已手动停止）</div>'; msgs.push({role:'assistant', content: full}); }
      else { bubble.remove(); }
    }else{
      if(full.trim()){ contentEl.innerHTML = renderContent(full); msgs.push({role:'assistant', content: full}); }
      contentEl.innerHTML += '<div class="err">请求失败：' + escapeHtml(err.message) + '</div>';
      scrollBottom(true);
    }
  }finally{
    busy = false;
    abortCtrl = null;
    setBusyUI(false);
    saveHistory();
  }
}

/* ---------- UI 状态 ---------- */
function setBusyUI(b){
  const btn = $('#sendBtn');
  btn.textContent = b ? '停止' : '发送';
  btn.classList.toggle('stop', b);
  $('#regenBtn').disabled = b;
  $('#newBtn').disabled = b;
}

/* ---------- 交互动作 ---------- */
async function send(){
  if(busy) return;
  const input = $('#input');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  autoResize();
  addBubble('user', text);
  msgs.push({role:'user', content: text});
  saveHistory();
  await generate();
}

async function regenerate(){
  if(busy) return;
  const bubbles = msgBox.querySelectorAll('.msg.assistant');
  if(msgs.length && msgs[msgs.length - 1].role === 'assistant'){
    msgs.pop();
    if(bubbles.length) bubbles[bubbles.length - 1].remove();
  }
  if(msgs.length === 0){ newChat(); return; }
  await generate();
}

function newChat(){
  if(busy) return;
  msgs = [];
  msgBox.innerHTML = '';
  if(cfg.greeting && cfg.greeting.trim()){
    addBubble('assistant', cfg.greeting);
    msgs.push({role:'assistant', content: cfg.greeting});
  }else{
    msgBox.innerHTML = '<div class="muted" style="text-align:center;margin:auto;font-size:13px;">在左侧设置好 API 与角色，然后开始对话吧。</div>';
  }
  saveHistory();
}

function exportChat(){
  if(!msgs.length){ alert('还没有对话内容'); return; }
  const nameOf = r => r === 'user' ? (cfg.userName || '我') : (cfg.charName || '角色');
  const text = msgs.map(m => nameOf(m.role) + '：\n' + m.content).join('\n\n---\n\n');
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (cfg.charName || 'chat') + '-' + new Date().toISOString().slice(0,10) + '.txt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* ---------- 输入框自适应高度 ---------- */
const inputEl = $('#input');
function autoResize(){
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
}

/* ---------- 事件绑定 ---------- */
function bindEvents(){
  // 【修复核心2】加入防重复绑定锁
  if (hasBoundEvents) return;
  hasBoundEvents = true;

  $('#sendBtn').addEventListener('click', () => {
    if(busy){ abortCtrl && abortCtrl.abort(); return; }
    send();
  });

  inputEl.addEventListener('input', autoResize);
  inputEl.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){
      e.preventDefault();
      if(!busy) send();
    }
  });

  $('#regenBtn').addEventListener('click', regenerate);
  $('#newBtn').addEventListener('click', () => {
    if(msgs.length && !confirm('确定要清空当前对话，重新开始吗？')) return;
    newChat();
  });
  $('#exportBtn').addEventListener('click', exportChat);

  $('#menuBtn').addEventListener('click', () => document.body.classList.add('side-open'));
  $('#closeSide').addEventListener('click', () => document.body.classList.remove('side-open'));
  $('#backdrop').addEventListener('click', () => document.body.classList.remove('side-open'));

  $('#applyBtn').addEventListener('click', async () => {
    updateHeadName();
    saveCfg();
    await saveAgentSettings(); 
    if(msgs.length && !confirm('已保存设置。是否清空当前对话，用新设定重新开始？')){ return; }
    newChat();
    document.body.classList.remove('side-open');
  });

  $('#logoutBtn').addEventListener('click', async () => {
    if(!confirm('确定要退出登录吗？退出后聊天记录将清空。')) return;
    await supabaseClient.auth.signOut();
    clearLocalData();
    window.location.reload();
  });
}

/* ---------- 登录/注册 UI 逻辑 ---------- */
const authOverlay = $('#auth-overlay');
const authTitle = $('#auth-title');
const authSubtitle = $('#auth-subtitle');
const authEmail = $('#auth-email');
const authPassword = $('#auth-password');
const authLoginBtn = $('#auth-login-btn');
const authRegisterBtn = $('#auth-register-btn');
const authMsg = $('#auth-msg');

let isRegisterMode = false;

function toggleAuthMode() {
  isRegisterMode = !isRegisterMode;
  authTitle.textContent = isRegisterMode ? '创建账号' : '欢迎回来';
  authSubtitle.textContent = isRegisterMode ? '注册一个新账号开始使用' : '登录以同步您的角色与聊天记录';
  authLoginBtn.textContent = isRegisterMode ? '注册' : '登录';
  authRegisterBtn.textContent = isRegisterMode ? '已有账号？点击登录' : '没有账号？点击注册';
  authMsg.textContent = '';
}

authRegisterBtn.addEventListener('click', toggleAuthMode);

async function handleAuthAction() {
  const email = authEmail.value.trim();
  const password = authPassword.value;
  if (!email || !password) { authMsg.textContent = '请填写邮箱和密码'; authMsg.className = 'auth-msg error'; return; }
  if (password.length < 6) { authMsg.textContent = '密码至少需要6位'; authMsg.className = 'auth-msg error'; return; }

  authLoginBtn.disabled = true;
  authMsg.textContent = '处理中...';
  authMsg.className = 'auth-msg';

  try {
    let result;
    if (isRegisterMode) { result = await supabaseClient.auth.signUp({ email, password }); }
    else { result = await supabaseClient.auth.signInWithPassword({ email, password }); }

    if (result.error) {
      authMsg.textContent = result.error.message;
      authMsg.className = 'auth-msg error';
    } else {
      if (isRegisterMode) {
        authMsg.textContent = '注册成功！请直接登录。';
        authMsg.className = 'auth-msg success';
        if (result.data.session) { window.location.reload(); }
        else { toggleAuthMode(); }
      } else {
        window.location.reload();
      }
    }
  } catch (e) {
    authMsg.textContent = '网络错误，请重试';
    authMsg.className = 'auth-msg error';
  } finally {
    authLoginBtn.disabled = false;
  }
}

authLoginBtn.addEventListener('click', handleAuthAction);

/* ---------- 启动逻辑 ---------- */
async function init() {
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (session && session.user) {
      USER_ID = session.user.id;
      authOverlay.classList.add('hidden');
      console.log('✅ 用户已登录:', USER_ID);
      loadUserData();
    } else {
      USER_ID = null;
      authOverlay.classList.remove('hidden');
      console.log('⛔ 用户未登录');
    }
  });

  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) {
    authOverlay.classList.remove('hidden');
  } else {
    USER_ID = session.user.id;
    authOverlay.classList.add('hidden');
    loadUserData();
  }
}

async function loadUserData() {
  if (!USER_ID) return;
  // 【修复核心3】防止同一个用户重复加载和绑定
  if (currentLoadedUserId === USER_ID) return;
  currentLoadedUserId = USER_ID;
  
  // 登录新账号时，清空上一账号残留的聊天记录，防止串号
  msgs = [];
  msgBox.innerHTML = '';
  
  initForm();
  bindEvents();
  await fetchAgentSettings();
  
  let restored = false;
  try{
    const raw = localStorage.getItem('rp_history');
    if(raw){
      const arr = JSON.parse(raw);
      if(Array.isArray(arr) && arr.length){
        arr.forEach(m => addBubble(m.role, m.content));
        msgs = arr;
        restored = true;
      }
    }
  }catch(e){}

  if(!restored) newChat();
  autoResize();
  scrollBottom(true);
}

// 执行启动
init();

/* ---------- 注册 Service Worker ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw-chat.js')
      .then(reg => console.log('✅ Service Worker 注册成功:', reg.scope))
      .catch(err => console.log('❌ Service Worker 注册失败:', err));
  });
}
</script>
