<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>角色扮演 · RolePlay Chat</title>
<link rel="manifest" href="manifest-chat.json">
<meta name="theme-color" content="#000000">
<!-- 主题引导内联脚本：防止黑闪 -->
<script>
(function(){
  try {
    var pref = localStorage.getItem('rp_theme') || 'auto';
    var isDark = pref === 'dark' || (pref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', isDark ? '#000000' : '#ffffff');
  } catch (e) {}
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
*{box-sizing:border-box;}

/* ============================================================
   主题变量
   ============================================================ */
:root,
html[data-theme="dark"]{
  --bg:#121212; --panel:#1e1e1e; --panel-2:#2a2a2a; --border:#3a3a3a;
  --text:#ececec; --muted:#9e9e9e; --accent:#4d6bfe;
  --bubble-user-bg:#2a2a2a; --bubble-user-fg:#ffffff;
  --bubble-user-em:#e2e8ff; --head-bg:rgba(20,24,36,.72);
  --code-bg:rgba(255,255,255,0.1); --code-fg:#a0a0a0; --pre-bg:#1e1e1e;
  --danger:#ff8080; --danger-bg:rgba(255,128,128,0.2);
  --danger-bg-soft:rgba(255,128,128,0.1); --danger-bg-soft2:rgba(255,128,128,0.15);
  --success:#6bff8b; --overlay-bg:rgba(0,0,0,0.6);
  --auth-overlay-bg:rgba(13,15,22,0.98); --backdrop-bg:rgba(0,0,0,.5);
  --shadow-lg:0 10px 40px rgba(0,0,0,0.5); --shadow-md:0 10px 30px rgba(0,0,0,0.5);
  --cloud-bg:rgba(0,0,0,0.2); --cloud-fg:#6b7280;
  --token-bg:rgba(0,0,0,0.2); --token-fg:#6b7280;
  --toast-bg:#1c2130; --stop-bg:#e05252;
  --scrollbar-thumb:#2a3040; --scrollbar-thumb-hover:#3a4256;
  --conv-active-bg:rgba(124,108,255,0.1);

  /* 排版变量 */
  --ai-font-size: 16.5px;
  --ai-line-height: 1.75;
  --user-font-size: 15px;
  --user-line-height: 1.72;
  --user-bubble-max-width: 78%;
}

html[data-theme="light"]{
  --bg:#ffffff; --panel:#f7f8fa; --panel-2:#eef0f3; --border:#e3e5e8;
  --text:#1a1d21; --muted:#6b7280; --accent:#4d6bfe;
  --bubble-user-bg:#eef1f6; --bubble-user-fg:#1a1d21;
  --bubble-user-em:#33407a; --head-bg:rgba(255,255,255,.8);
  --code-bg:rgba(0,0,0,0.06); --code-fg:#6b7280; --pre-bg:#f6f7f9;
  --danger:#d92d20; --danger-bg:rgba(217,45,32,0.12);
  --danger-bg-soft:rgba(217,45,32,0.06); --danger-bg-soft2:rgba(217,45,32,0.1);
  --success:#16a34a; --overlay-bg:rgba(15,20,30,0.35);
  --auth-overlay-bg:rgba(250,251,252,0.98); --backdrop-bg:rgba(0,0,0,.25);
  --shadow-lg:0 10px 40px rgba(15,20,30,0.08); --shadow-md:0 10px 30px rgba(15,20,30,0.08);
  --cloud-bg:rgba(0,0,0,0.03); --cloud-fg:#6b7280;
  --token-bg:rgba(0,0,0,0.05); --token-fg:#6b7280;
  --toast-bg:#ffffff; --stop-bg:#d92d20;
  --scrollbar-thumb:#d1d5db; --scrollbar-thumb-hover:#9ca3af;
  --conv-active-bg:rgba(77,107,254,0.08);
}

html,body{height:100%;height:100dvh;margin:0;}
body{
  background:var(--bg);color:var(--text);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;
}
button{font-family:inherit;}
.app{display:flex;height:100%;height:100dvh;}

/* ---------- 登录遮罩层 ---------- */
#auth-overlay{position:fixed;inset:0;z-index:999;background:var(--auth-overlay-bg);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px;transition:opacity 0.3s;}
#auth-overlay.hidden{opacity:0;pointer-events:none;}
.auth-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px 24px;box-shadow:var(--shadow-lg);}
.auth-card h2{font-size:20px;font-weight:600;margin:0 0 8px 0;text-align:center;}
.auth-card p{font-size:13px;color:var(--muted);text-align:center;margin:0 0 20px 0;}
.auth-card input{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:12px;font-size:14px;margin-bottom:12px;outline:none;}
.auth-card input:focus{border-color:var(--accent);}
.auth-card button{width:100%;padding:12px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;transition:0.2s;border:none;}
.btn-login{background:var(--accent);color:#fff;margin-bottom:10px;}
.btn-login:hover{filter:brightness(1.1);}
.btn-register{background:transparent;color:var(--text);border:1px solid var(--border) !important;}
.btn-register:hover{background:var(--panel-2);}
.auth-msg{font-size:12px;text-align:center;margin-top:12px;min-height:18px;}
.auth-msg.error{color:var(--danger);}
.auth-msg.success{color:var(--success);}

/* ---------- 侧栏 ---------- */
#sidebar{width:330px;flex:0 0 330px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;}
.side-body{flex:1;overflow-y:auto;padding:16px;}

/* 云端状态指示器 */
#cloud-status-bar {display: flex;align-items: center; justify-content: center; gap: 6px; padding: 6px 16px; font-size: 12px; color: var(--cloud-fg); background: var(--cloud-bg); border-bottom: 1px solid var(--border); transition: 0.3s;}
#cloud-status-bar.online { color: var(--success); }
#cloud-status-bar.offline { color: var(--danger); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cloud-fg); }
#cloud-status-bar.online .status-dot { background: var(--success); box-shadow: 0 0 8px var(--success); }
#cloud-status-bar.offline .status-dot { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

/* 会话列表样式 */
.conv-item {padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 6px; border: 1px solid transparent; transition: 0.2s; display: flex; justify-content: space-between; align-items: center;}
.conv-item:hover { background: var(--panel-2); }
.conv-item.active { background: var(--conv-active-bg); border-color: var(--accent); }
.conv-item .conv-name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; flex: 1;}
.conv-item .conv-actions { display: flex; align-items: center; gap: 4px; opacity: 0; transition: 0.2s; }
.conv-item:hover .conv-actions { opacity: 1; }
.conv-item .conv-pin { color: var(--muted); cursor: pointer; padding: 4px; border-radius: 4px; font-size: 14px; transition: 0.2s;}
.conv-item .conv-pin:hover { color: var(--accent); background: var(--panel-2); }
.conv-item .conv-pin.pinned { opacity: 1; color: var(--accent); }
.conv-item .conv-delete { color: var(--danger); cursor: pointer; padding: 4px; border-radius: 4px; font-size: 12px;}
.conv-item .conv-delete:hover { background: var(--danger-bg); }

.side-body section{margin-bottom:22px;}
.side-body h3{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600;}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 5px;}
input,textarea{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:9px 11px;font-size:13.5px;font-family:inherit;outline:none;transition:border-color .15s;}
input:focus,textarea:focus{border-color:var(--accent);}
textarea{resize:vertical;line-height:1.55;}
input[type=range]{padding:0;background:none;border:none;-webkit-appearance:none;appearance:none;height:20px;}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--border);border-radius:2px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);margin-top:-5.5px;cursor:pointer;}
.side-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-direction:column;}
.side-foot .btn{width:100%;}
.btn-logout{background:transparent;color:var(--danger);border:1px solid var(--danger);margin-top:6px;}
.btn-logout:hover{background:var(--danger-bg-soft);}
.btn-clear-chat{background:transparent;color:var(--danger);border:1px solid var(--danger);margin-top:6px;}
.btn-clear-chat:hover{background:var(--danger-bg-soft);}

/* ---------- 侧栏底部「更多」区 ---------- */
.side-bottom-bar{
  position:relative;
  display:flex;align-items:center;justify-content:space-between;
  margin-top:8px;padding-top:10px;
  border-top:1px dashed var(--border);
}
.side-foot-meta{font-size:11.5px;color:var(--muted);letter-spacing:.02em;}
.more-btn{
  width:30px;height:30px;border-radius:50%;
  background:transparent;border:1px solid transparent;color:var(--muted);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:18px;line-height:1;cursor:pointer;transition:.15s;
  padding:0;
}
.more-btn:hover{background:var(--panel-2);color:var(--text);border-color:var(--border);}

/* ============================================================
   DeepSeek 风格：设置面板
   ============================================================ */
#settings-overlay {
    position: fixed; inset: 0; z-index: 500;
    background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
}
#settings-overlay.show { opacity: 1; pointer-events: auto; }

#settings-panel {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: var(--panel); border-top-left-radius: 20px; border-top-right-radius: 20px;
    transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    height: 75vh; 
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
}
#settings-overlay.show #settings-panel { transform: translateY(0); }

.settings-view {
    position: absolute; inset: 0; background: var(--panel);
    display: flex; flex-direction: column;
    transition: transform 0.3s ease;
    will-change: transform;
}
#settings-main { transform: translateX(0); z-index: 2; }
#settings-appearance { transform: translateX(100%); z-index: 3; }

#settings-panel.show-sub #settings-main { transform: translateX(-30%); }
#settings-panel.show-sub #settings-appearance { transform: translateX(0); }

.settings-header {
    display: flex; align-items: center; padding: 16px 20px;
    font-size: 16px; font-weight: 600; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}
.settings-header .back-btn {
    background: none; border: none; font-size: 20px; cursor: pointer;
    color: var(--text); margin-right: 12px; padding: 0;
}
.settings-header .close-btn {
    margin-left: auto; background: none; border: none; font-size: 18px;
    cursor: pointer; color: var(--muted); padding: 4px;
}
.settings-body { flex: 1; overflow-y: auto; padding: 10px 0 30px; }

/* 列表项 */
.settings-list-item {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 16px 20px; background: transparent; border: none;
    color: var(--text); font-size: 15px; text-align: left; cursor: pointer;
    transition: background 0.2s;
}
.settings-list-item:hover { background: var(--panel-2); }
.settings-list-item .arrow { color: var(--muted); font-size: 18px; }

/* 表单区域 */
.settings-group { padding: 16px 20px; border-bottom: 1px solid var(--border); }
.settings-group:last-child { border-bottom: none; }
.settings-group-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text); }
.settings-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; margin-top: 16px; }
.settings-row label { margin: 0; font-size: 13.5px; color: var(--text); }
.settings-row .val { font-size: 12px; color: var(--muted); font-family: monospace; }

/* 主题切换按钮组 */
.theme-btn-group { display: flex; gap: 8px; margin-top: 8px; }
.theme-btn {
    flex: 1; padding: 10px 0; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--muted); font-size: 13px; cursor: pointer; transition: 0.2s;
}
.theme-btn.active {
    background: rgba(77,107,254,0.1); border-color: var(--accent); color: var(--accent);
}

/* ---------- 按钮 ---------- */
.btn{background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13.5px;transition:.15s;}
.btn:hover{border-color:var(--accent);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.sm{padding:6px 11px;font-size:12.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.icon-btn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:8px;}
.icon-btn:hover{color:var(--text);background:var(--panel-2);}

/* ---------- 聊天区 ---------- */
.chat{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--head-bg);backdrop-filter:blur(10px);}
.chat-head .title{display:flex;flex-direction:column;line-height:1.3;flex:1;min-width:0;}
.chat-head .title .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chat-head .sub{font-size:11.5px;color:var(--muted);}
.head-actions{display:flex;gap:6px;}
#menuBtn{display:none;}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 22px 18px 10px;
  display: flex;
  flex-direction: column;
  gap: 22px;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
}
.msg {
  display: flex;
  flex-direction: column;
  animation: pop .18s ease;
}
@keyframes pop {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

/* ============================================================
   应用排版变量
   ============================================================ */

/* 用户消息 */
.msg.user {
  align-self: flex-end;
  max-width: var(--user-bubble-max-width);
}
.msg.user .msg-header {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  margin-bottom: 12px;
}
.msg.user .avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--panel-2);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
  flex-shrink: 0;
  user-select: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  overflow: hidden;
}
.msg.user .avatar img { width: 100%; height: 100%; object-fit: cover; }
.msg.user .meta {
  margin: 0; padding: 0; font-size: 14px; font-weight: 600; color: var(--text); text-align: right;
}
.msg.user .content {
  background: var(--bubble-user-bg);
  color: var(--bubble-user-fg);
  border-radius: 18px;
  border: none;
  padding: 11px 15px;
  font-size: var(--user-font-size);
  line-height: var(--user-line-height);
  word-break: break-word;
  overflow-wrap: anywhere;
}

/* AI 消息 */
.msg.assistant {
  align-self: flex-start;
  max-width: 100%;
}
.msg.assistant .msg-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.msg.assistant .avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
  flex-shrink: 0;
  user-select: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  overflow: hidden;
}
.msg.assistant .avatar img { width: 100%; height: 100%; object-fit: cover; }
.msg.assistant .meta { margin: 0; padding: 0; font-size: 14px; font-weight: 600; color: var(--text); }

.msg.assistant .content {
  background: transparent;
  border: none;
  padding: 0;
  color: var(--text);
  font-size: var(--ai-font-size);
  line-height: var(--ai-line-height);
  word-break: break-word;
  overflow-wrap: anywhere;
}

/* 反引号包裹的代码块/动作样式 */
.msg.assistant .content code {
  background: var(--code-bg);
  color: var(--code-fg);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: monospace;
  font-size: 0.9em;
}
.msg.assistant .content pre {
  background: var(--pre-bg);
  padding: 12px;
  border-radius: 8px;
  overflow-x: auto;
  margin: 10px 0;
}
.msg.assistant .content pre code {
  background: transparent;
  padding: 0;
  color: inherit;
}
.msg.assistant .content ul, .msg.assistant .content ol {
  padding-left: 20px;
  margin: 8px 0;
}

/* 名字标识（全局兜底） */
.msg .meta {
  font-size: 11.5px;
  color: var(--muted);
  margin-bottom: 5px;
  padding: 0 4px;
}
.msg.user .content em {
  color: var(--bubble-user-em);
}
.err{color:var(--danger);font-size:12.5px;margin-top:8px;white-space:pre-wrap;line-height:1.5;}
.muted{color:var(--muted);}
.cursor{display:inline-block;width:7px;height:1em;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite;}
@keyframes blink{50%{opacity:0;}}

/* 消息操作栏 */
.msg-actions {display: flex;align-items: center;gap: 8px;margin-top: 4px;padding: 0 4px;font-size: 12px;color: var(--muted);opacity: 0.6;transition: opacity 0.2s;flex-wrap: wrap;}
.msg-actions:hover { opacity: 1; }
.msg.user .msg-actions { justify-content: flex-end; }
.action-btn {background: none; border: none; color: var(--muted);cursor: pointer; padding: 2px 4px; font-size: 12px; border-radius: 4px;}
.action-btn:hover { color: var(--text); background: var(--border); }
.action-btn.delete-btn { color: var(--danger); }
.action-btn.delete-btn:hover { background: var(--danger-bg-soft2); }
.version-switcher { display: flex; align-items: center; gap: 4px; }
.version-switcher span { font-variant-numeric: tabular-nums; min-width: 28px; text-align: center; }
.version-switcher button {background: none; border: 1px solid var(--border); color: var(--muted);cursor: pointer; border-radius: 3px; padding: 0 4px;}
.version-switcher button:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
.version-switcher button:disabled { opacity: 0.3; cursor: not-allowed; }
.token-display {font-family: monospace; font-size: 11px; color: var(--token-fg);background: var(--token-bg); padding: 1px 6px; border-radius: 4px; margin-left: auto;}

/* ============================================================
   思考过程面板样式 (DeepSeek 风格)
   ============================================================ */
.reasoning-box {
    margin-bottom: 12px;
    font-size: 14px;
    overflow: hidden;
    transition: all 0.2s ease;
}
.reasoning-header {
    padding: 4px 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 13px;
    user-select: none;
    transition: color 0.2s;
}
.reasoning-header:hover {
    color: var(--text);
}
.reasoning-arrow {
    display: inline-block;
    width: 0;
    height: 0;
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    border-left: 5px solid currentColor;
    transition: transform 0.2s ease;
    transform: rotate(0deg);
}
.reasoning-box:not(.collapsed) .reasoning-arrow {
    transform: rotate(90deg); /* 展开时箭头向下 */
}
.reasoning-content {
    padding: 8px 0 8px 18px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    font-family: monospace;
    border-left: 2px solid var(--border); /* 左侧一条淡淡的线，半开放感 */
    margin-left: 4px;
    margin-top: 4px;
}
.reasoning-box.collapsed .reasoning-content {
    display: none;
}

.composer{display:flex;gap:10px;align-items:flex-end;padding:12px 16px 16px;padding-bottom: calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--panel);}
#input{flex:1;resize:none;max-height:180px;min-height:44px;line-height:1.55;padding:11px 14px;border-radius:12px;overflow-y:auto;}
#sendBtn{height:44px;padding:0 22px;border-radius:12px;background:var(--accent);border:none;color:#fff;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s;}
#sendBtn:hover{filter:brightness(1.1);}
#sendBtn.stop{background:var(--stop-bg);}

#backdrop{position:fixed;inset:0;background:var(--backdrop-bg);z-index:40;display:none;}

/* 热更新提示框 */
#update-toast {position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--toast-bg); border: 1px solid var(--accent); border-radius: 12px; padding: 14px 20px; display: none; align-items: center; gap: 16px; z-index: 1000; box-shadow: var(--shadow-md); animation: slideUp 0.3s ease;}
@keyframes slideUp { from { bottom: -50px; opacity: 0; } to { bottom: 20px; opacity: 1; } }
#update-toast span { font-size: 14px; color: var(--text); }
#update-toast button { padding: 8px 16px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }

/* 角色设定弹窗面板 */
#char-settings-modal {
    position: fixed; inset: 0; z-index: 200;
    background: var(--overlay-bg); display: none; align-items: center; justify-content: center;
    padding: 20px; transition: opacity 0.3s;
}
#char-settings-modal.show { display: flex; }
.char-settings-card {
    width: 100%; max-width: 500px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 24px; box-shadow: var(--shadow-lg);
    max-height: 90vh; display: flex; flex-direction: column; overflow-y: auto;
}
.char-settings-card h3 { font-size: 18px; margin: 0 0 16px 0; font-weight: 600; }
.char-settings-card .form-group { margin-bottom: 14px; }
.char-settings-card label { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: block; }
.char-settings-card textarea { min-height: 80px; }
.char-settings-card .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }

/* 头像上传样式 */
.avatar-upload-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 16px; }
.avatar-preview {
    width: 80px; height: 80px; border-radius: 50%; background: var(--panel-2);
    border: 2px dashed var(--border); display: flex; align-items: center; justify-content: center;
    cursor: pointer; overflow: hidden; transition: border-color 0.2s;
}
.avatar-preview:hover { border-color: var(--accent); }
.avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
.avatar-preview span { font-size: 28px; }
.avatar-upload-text { font-size: 12px; color: var(--accent); margin-top: 8px; cursor: pointer; }

@media(max-width:860px){
  #menuBtn{display:block;}
  #sidebar{position:fixed;top:0;bottom:0;left:0;z-index:50;width:min(88vw,340px);flex-basis:auto;transform:translateX(-100%);transition:transform .25s ease;}
  body.side-open #sidebar{transform:none;}
  body.side-open #backdrop{display:block;}
  .msg{max-width:90%;}
  input, textarea { font-size: 16px !important; }
  .btn.sm { padding: 10px 14px; font-size: 13.5px; }
}
@media(max-width:640px){
  #exportBtn{display:none;}
  #messages{padding:16px 12px 8px;}
  .composer{padding:10px 12px 12px;padding-bottom: calc(12px + env(safe-area-inset-bottom));}
}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:5px;}
::-webkit-scrollbar-thumb:hover{background:var(--scrollbar-thumb-hover);}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- 全局变量集中声明 ---------- */
const $ = s => document.querySelector(s);
const msgBox = $('#messages');
const inputEl = $('#input');
let USER_ID = null;
let currentConversationId = null;
let currentConversation = null;
let conversationsCache = [];
let cfg = {};
let msgs = [];
let busy = false;

/* ---------- 工具函数 ---------- */
function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// 获取 AI 头像
function getAvatarHtml(convId) {
    let avatar = '🤖';
    const conv = conversationsCache.find(c => c.id === convId);
    if (conv && conv.avatar) {
        avatar = conv.avatar;
    } else if (globalDefaultAvatar) {
        avatar = globalDefaultAvatar;
    }
    if (avatar.startsWith('data:image') || avatar.startsWith('http')) {
        return `<img src="${escapeHtml(avatar)}" alt="avatar">`;
    }
    return escapeHtml(avatar);
}

// 获取用户头像
function getUserAvatarHtml(convId) {
    let avatar = '👤';
    const conv = conversationsCache.find(c => c.id === convId);
    if (conv && conv.user_avatar) {
        avatar = conv.user_avatar;
    } else if (globalDefaultUserAvatar) {
        avatar = globalDefaultUserAvatar;
    }
    if (avatar.startsWith('data:image') || avatar.startsWith('http')) {
        return `<img src="${escapeHtml(avatar)}" alt="avatar">`;
    }
    return escapeHtml(avatar);
}

function renderContent(s, isStreaming = false){
  if (!s) return '';
  if (isStreaming) {
      const backticks = (s.match(/`/g) || []).length;
      const asterisks = (s.match(/\*\*/g) || []).length;
      if (backticks % 2 !== 0 || asterisks % 2 !== 0) {
          return escapeHtml(s).replace(/\n/g, '<br>');
      }
  }
  try {
      let rawHtml = marked.parse(s, { breaks: true, gfm: true });
      return DOMPurify.sanitize(rawHtml);
  } catch (e) {
      console.error('Markdown 解析失败:', e);
      return escapeHtml(s).replace(/\n/g, '<br>');
  }
}

function autoResize(){ inputEl.style.height = 'auto'; inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px'; }

/* ================================================================
   主题与外观系统（本地优先 + 时间戳 + 重试 + 多标签同步）
   ================================================================ */
const THEME_KEY = 'rp_theme';
const THEME_TS_KEY = 'rp_theme_ts';
const THEME_MANUAL_KEY = 'rp_theme_manual';
const THEME_SYNC_EVENT_KEY = 'rp_theme_sync_event';

function getThemePref(){
  try { return localStorage.getItem(THEME_KEY) || 'auto'; } catch(e){ return 'auto'; }
}
function getThemeTs(){
  try { return Number(localStorage.getItem(THEME_TS_KEY) || 0); } catch(e){ return 0; }
}
function isThemeManual(){
  try { return localStorage.getItem(THEME_MANUAL_KEY) === '1'; } catch(e){ return false; }
}

function effectiveTheme(pref){
  if (pref === 'light' || pref === 'dark') return pref;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}

/**
 * 应用主题
 * opts.persist: 是否写回 localStorage（默认 true）
 * opts.manual : 是否是用户手动切换（写入时间戳和 manual 标记）
 * opts.ts     : 时间戳（如果不传且 manual，则使用当前时间）
 */
function applyTheme(pref, opts = {}){
  const { persist = true, manual = false, ts = null } = opts;
  const eff = effectiveTheme(pref);
  document.documentElement.setAttribute('data-theme', eff);
  document.documentElement.style.colorScheme = eff;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', eff === 'dark' ? '#000000' : '#ffffff');
  if (persist) {
    try {
      localStorage.setItem(THEME_KEY, pref);
      if (manual) {
        localStorage.setItem(THEME_TS_KEY, String(ts || Date.now()));
        localStorage.setItem(THEME_MANUAL_KEY, '1');
      } else if (ts) {
        localStorage.setItem(THEME_TS_KEY, String(ts));
        localStorage.removeItem(THEME_MANUAL_KEY);
      }
    } catch(e){}
  }
  document.querySelectorAll('.theme-btn').forEach(el => {
    el.classList.toggle('active', el.getAttribute('data-theme-value') === pref);
  });
  return eff;
}

// 应用排版变量到 CSS
function applyStyleConfig() {
    document.documentElement.style.setProperty('--ai-font-size', styleConfig.aiFontSize + 'px');
    document.documentElement.style.setProperty('--ai-line-height', styleConfig.aiLineHeight);
    document.documentElement.style.setProperty('--user-font-size', styleConfig.userFontSize + 'px');
    document.documentElement.style.setProperty('--user-line-height', styleConfig.userLineHeight);
    document.documentElement.style.setProperty('--user-bubble-max-width', styleConfig.userBubbleWidth + '%');
    
    // 同步更新界面上的数值显示
    if($('#valAiFontSize')) $('#valAiFontSize').textContent = styleConfig.aiFontSize + 'px';
    if($('#valAiLineHeight')) $('#valAiLineHeight').textContent = styleConfig.aiLineHeight;
    if($('#valUserFontSize')) $('#valUserFontSize').textContent = styleConfig.userFontSize + 'px';
    if($('#valUserLineHeight')) $('#valUserLineHeight').textContent = styleConfig.userLineHeight;
    if($('#valUserBubbleWidth')) $('#valUserBubbleWidth').textContent = styleConfig.userBubbleWidth + '%';
    
    // 同步更新滑动条位置
    if($('#rangeAiFontSize')) $('#rangeAiFontSize').value = styleConfig.aiFontSize;

async function syncAppearanceToCloud() {

        const { error } = await supabaseClient.from('agent_settings').upsert({
            id: USER_ID,
            appearance: appearanceData
        });
        if (error) throw error;
    } catch (e) {
        console.warn('同步外观设置失败，稍后重试:', e);
        if (!appearanceRetryTimer) {
            appearanceRetryTimer = setTimeout(() => {
                appearanceRetryTimer = null;

            }, 5000);

    }
}

function setupThemeUI(){
  if (hasBoundThemeUI) return;
  hasBoundThemeUI = true;

  // 初始应用：只渲染不写回
  applyTheme(getThemePref(), { persist: false });
  applyGlobalAvatar(globalDefaultAvatar);
  applyGlobalUserAvatar(globalDefaultUserAvatar);
  applyStyleConfig();

  // 系统主题变化监听
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const handler = () => {
        if (getThemePref() === 'auto') {
            applyTheme('auto', { persist: false });
        }
    };
    if (mq.addEventListener) mq.addEventListener('change', handler);
    else if (mq.addListener) mq.addListener(handler);
  }

  // 多标签页同步：其他标签切换主题时，本标签跟随（不写回以免相互覆盖）
  window.addEventListener('storage', (e) => {
      if (e.key === THEME_KEY && e.newValue) {
          applyTheme(e.newValue, { persist: false });
      }
  });

  const overlay = $('#settings-overlay');
  const panel = $('#settings-panel');
  
  if($('#moreBtn')) $('#moreBtn').addEventListener('click', () => {
      overlay.classList.add('show');
      panel.classList.remove('show-sub');
  });
  
  const closePanel = () => overlay.classList.remove('show');
  if($('#closeSettingsBtn')) $('#closeSettingsBtn').addEventListener('click', closePanel);
  if(overlay) overlay.addEventListener('click', (e) => { if(e.target === overlay) closePanel(); });

  if($('#goToAppearance')) $('#goToAppearance').addEventListener('click', () => panel.classList.add('show-sub'));
  if($('#backToMainBtn')) $('#backToMainBtn').addEventListener('click', () => panel.classList.remove('show-sub'));

  // 主题切换：本地立即生效 + 记录手动时间戳 + 云端异步同步（不阻塞、不回滚）
  document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => {
          const val = btn.getAttribute('data-theme-value');
          applyTheme(val, { persist: true, manual: true });
          syncAppearanceToCloud();
          try { localStorage.setItem(THEME_SYNC_EVENT_KEY, String(Date.now())); } catch(e){}
      });
  });

  $('#rangeAiFontSize').addEventListener('input', (e) => { styleConfig.aiFontSize = parseFloat(e.target.value); applyStyleConfig(); });
  $('#rangeAiFontSize').addEventListener('change', () => syncAppearanceToCloud());
  $('#rangeAiLineHeight').addEventListener('input', (e) => { styleConfig.aiLineHeight = parseFloat(e.target.value); applyStyleConfig(); });
  $('#rangeAiLineHeight').addEventListener('change', () => syncAppearanceToCloud());
  $('#rangeUserFontSize').addEventListener('input', (e) => { styleConfig.userFontSize = parseFloat(e.target.value); applyStyleConfig(); });
  $('#rangeUserFontSize').addEventListener('change', () => syncAppearanceToCloud());
  $('#rangeUserLineHeight').addEventListener('input', (e) => { styleConfig.userLineHeight = parseFloat(e.target.value); applyStyleConfig(); });
  $('#rangeUserLineHeight').addEventListener('change', () => syncAppearanceToCloud());
  $('#rangeUserBubbleWidth').addEventListener('input', (e) => { styleConfig.userBubbleWidth = parseInt(e.target.value); applyStyleConfig(); });
  $('#rangeUserBubbleWidth').addEventListener('change', () => syncAppearanceToCloud());

  // 全局默认头像上传
  $('#globalAvatarPreview').addEventListener('click', () => $('#globalAvatarFileInput').click());
  $('#globalAvatarUploadText').addEventListener('click', () => $('#globalAvatarFileInput').click());
  $('#globalAvatarFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
          const img = new Image();
          img.onload = function() {
              const canvas = document.createElement('canvas');
              const size = 200; 
              canvas.width = size; canvas.height = size;
              const ctx = canvas.getContext('2d');
              const minSize = Math.min(img.width, img.height);
              const sx = (img.width - minSize) / 2;
              const sy = (img.height - minSize) / 2;
              ctx.drawImage(img, sx, sy, minSize, minSize, 0, 0, size, size);
              const base64 = canvas.toDataURL('image/jpeg', 0.8);
              applyGlobalAvatar(base64);
              syncAppearanceToCloud();
              msgBox.innerHTML = '';
              msgs.forEach((m, i) => addBubble(m.role, m.content, i, m.tokens, m.reasoning));
              e.target.value = '';
          };
          img.src = event.target.result;
      };
      reader.readAsDataURL(file);
  });

  // 全局默认用户头像上传
  $('#globalUserAvatarPreview').addEventListener('click', () => $('#globalUserAvatarFileInput').click());
  $('#globalUserAvatarUploadText').addEventListener('click', () => $('#globalUserAvatarFileInput').click());
  $('#globalUserAvatarFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {

              canvas.width = size; canvas.height = size;
              const ctx = canvas.getContext('2d');
              const minSize = Math.min(img.width, img.height);
              const sx = (img.width - minSize) / 2;
              const sy = (img.height - minSize) / 2;
              ctx.drawImage(img, sx, sy, minSize, minSize, 0, 0, size, size);
              const base64 = canvas.toDataURL('image/jpeg', 0.8);
              applyGlobalUserAvatar(base64);
              syncAppearanceToCloud();
              msgBox.innerHTML = '';
              msgs.forEach((m, i) => addBubble(m.role, m.content, i, m.tokens, m.reasoning));
              e.target.value = '';

/* ---------- 云端：全局配置读写 ---------- */
async function fetchGlobalSettings() {
    if (!USER_ID) return false;
    try {
        const { data, error } = await supabaseClient
            .from('agent_settings')
            .select('api_base, api_key, model, temperature, max_tokens, ctx_limit, user_name, user_prompt, appearance')
            .eq('id', USER_ID).maybeSingle();

        if (error) {
            console.warn('⚠️ 全局配置拉取失败:', error.message);
            updateCloudStatusUI(false); updateGlobalUI(); return false;
        }

        if (data) {
            if (data.api_base) cfg.apiBase = data.api_base;
            if (data.api_key) cfg.apiKey = data.api_key;
            if (data.model) cfg.model = data.model;
            if (data.temperature !== null && data.temperature !== undefined) cfg.temperature = data.temperature;
            if (data.max_tokens !== null && data.max_tokens !== undefined) cfg.maxTokens = data.max_tokens;
            if (data.ctx_limit !== null && data.ctx_limit !== undefined) cfg.ctxLimit = data.ctx_limit;
            if (data.user_name) cfg.userName = data.user_name;
            if (data.user_prompt) cfg.userPrompt = data.user_prompt;

            if (data.appearance) {
                const app = data.appearance;

                /* =========================================================
                   主题处理：本地优先 + 时间戳
                   规则：
                   1) 本地从未手动选择 → 用云端
                   2) 本地手动选择过：
                      a) 云端时间戳 > 本地 → 云端更新，用云端
                      b) 本地时间戳 > 云端 → 本地更新，推送到云端
                      c) 时间戳相同 → 不操作
                   ========================================================= */
                const cloudTheme = app.theme;
                const cloudTs = Number(app.theme_updated_at || 0);
                const localPref = getThemePref();
                const localTs = getThemeTs();
                const localManual = isThemeManual();

                let shouldApplyCloud = false;
                let shouldPushLocal = false;

                if (cloudTheme && ['auto','light','dark'].includes(cloudTheme)) {
                    if (!localManual) {
                        // 本地没有明确用户选择，优先采用云端
                        shouldApplyCloud = true;
                    } else if (cloudTs > localTs) {
                        shouldApplyCloud = true;
                    } else if (localTs > cloudTs) {
                        shouldPushLocal = true;
                    }
                }

                if (shouldApplyCloud) {
                    // 应用云端主题（清除 manual 标记：这是"远端"权威值）
                    applyTheme(cloudTheme, { persist: true, manual: false, ts: cloudTs });
                }
                if (shouldPushLocal) {
                    // 本地手动更新更晚，异步推送，不阻塞
                    setTimeout(() => { syncAppearanceToCloud(); }, 0);
                }

                if (app.defaultAvatar) applyGlobalAvatar(app.defaultAvatar);
                if (app.defaultUserAvatar) applyGlobalUserAvatar(app.defaultUserAvatar);
                
                if (app.aiFontSize !== undefined) styleConfig.aiFontSize = Number(app.aiFontSize);
                if (app.aiLineHeight !== undefined) styleConfig.aiLineHeight = Number(app.aiLineHeight);
                if (app.userFontSize !== undefined) styleConfig.userFontSize = Number(app.userFontSize);
                if (app.userLineHeight !== undefined) styleConfig.userLineHeight = Number(app.userLineHeight);
                if (app.userBubbleWidth !== undefined) styleConfig.userBubbleWidth = Number(app.userBubbleWidth);
                applyStyleConfig();
            }

            saveCfg(); updateGlobalUI(); updateCloudStatusUI(true); return true;
        } else {
            try {
                await supabaseClient.from('agent_settings').insert({
                    id: USER_ID, api_base: cfg.apiBase, api_key: cfg.apiKey, model: cfg.model,
                    temperature: Number(cfg.temperature), max_tokens: Number(cfg.maxTokens), ctx_limit: Number(cfg.ctxLimit),
                    user_name: cfg.userName, user_prompt: cfg.userPrompt,
                    appearance: { theme: getThemePref(), theme_updated_at: getThemeTs() }
                });
            } catch (insertErr) { console.warn('写入默认全局配置失败:', insertErr.message); }
            updateGlobalUI(); return false;
        }
    } catch (e) { console.error('❌ 全局配置请求异常:', e); updateCloudStatusUI(false); updateGlobalUI(); }
    return false;
}

async function saveConversationSettings(convId, name, prompt, greet, avatar, userAvatar) {
    if (!USER_ID || !convId) return;
    try {
        const { error } = await supabaseClient.from('conversations')
            .update({ 
                agent_name: name, agent_prompt: prompt, greeting: greet, avatar: avatar, user_avatar: userAvatar 
            }).eq('id', convId);
        if (error) console.error('❌ 保存会话设定失败:', error.message);
        const c = conversationsCache.find(x => x.id === convId);
        if (c) { c.agent_name = name; c.agent_prompt = prompt; c.greeting = greet; c.avatar = avatar; c.user_avatar = userAvatar; }
        if (currentConversation && currentConversation.id === convId) {
            currentConversation.agent_name = name; currentConversation.agent_prompt = prompt;
            currentConversation.greeting = greet; currentConversation.avatar = avatar; currentConversation.user_avatar = userAvatar;
        }
    } catch (e) { console.error('❌ 保存会话设定异常:', e); }
}

    if (!USER_ID) return;
    try {
        await supabaseClient.from('conversations').update({ is_pinned: !currentStatus }).eq('id', convId);
        const convs = await loadConversations();

async function deleteConversation(convId) {
    if (!USER_ID || !convId) return;
    if (!confirm('确定要删除这个角色及所有聊天记录吗？')) return;
    try {
        await supabaseClient.from('conversations').delete().eq('id', convId);
        await supabaseClient.from('chat_messages').delete().eq('conversation_id', convId);
        conversationsCache = conversationsCache.filter(c => c.id !== convId);
        const el = document.querySelector(`.conv-item[data-id="${convId}"]`);
        if (el) el.remove();
        if (currentConversationId === convId) {
            const remaining = await loadConversations();
            conversationsCache = remaining;
            renderConversationList(remaining);
            if (remaining.length > 0) {
                switchConversation(remaining[0].id, remaining[0]);
            } else {
                const newConv = await createConversation();
                if (newConv) {
                    conversationsCache = [newConv];
                    renderConversationList([newConv]);
                    switchConversation(newConv.id, newConv);
                }
            }
        }
    } catch (e) { console.error('❌ 删除会话异常:', e); updateCloudStatusUI(false); }
}

async function saveMessageToCloud(msg) {
    if (!USER_ID || !currentConversationId) return;
    try {
        const payload = { 
            user_id: USER_ID, 
            conversation_id: currentConversationId, 
            local_id: msg.local_id, 
            role: msg.role,

            reasoning: msg.reasoning || null,

        };

        if (error) {

        }

    } catch (e) { 
        console.error('❌ 消息同步异常:', e); 
        updateCloudStatusUI(false); 
        throw e; 
    }
}

async function loadMessagesFromCloud() {
    if (!USER_ID || !currentConversationId) return { pathMsgs: [], leafId: null };
    
    const { data, error } = await supabaseClient.from('chat_messages')
        .select('id, role, content, reasoning, local_id, tokens, created_at, parent_id, sibling_order')
        .eq('user_id', USER_ID)
        .eq('conversation_id', currentConversationId)
        .order('created_at', { ascending: true });

    if (error) {
        updateCloudStatusUI(false);
        throw new Error('拉取记录失败: ' + error.message);
    }
    
    const allMsgs = data || [];
    if (allMsgs.length === 0) return { pathMsgs: [], leafId: null };

    const { data: convData } = await supabaseClient.from('conversations')
        .select('active_leaf_id').eq('id', currentConversationId).single();
    
    let targetLeafId = convData?.active_leaf_id;
    
    if (!targetLeafId || !allMsgs.find(m => m.local_id === targetLeafId)) {
        targetLeafId = allMsgs[allMsgs.length - 1].local_id;
    }

    const msgMap = new Map();
    const childrenMap = new Map(); 
    allMsgs.forEach(m => {
        msgMap.set(m.local_id, m);
        if (m.parent_id) {
            if (!childrenMap.has(m.parent_id)) childrenMap.set(m.parent_id, []);
            childrenMap.get(m.parent_id).push(m);
        }
    });

    // 探底逻辑
    let currentId = targetLeafId;
    while (childrenMap.has(currentId)) {
        let children = childrenMap.get(currentId);
        children.sort((a, b) => {
            const orderA = a.sibling_order || 0;
            const orderB = b.sibling_order || 0;
            if (orderA !== orderB) return orderA - orderB;
            return new Date(a.created_at) - new Date(b.created_at);
        });
        currentId = children[children.length - 1].local_id;
    }
    targetLeafId = currentId;

    if (convData?.active_leaf_id !== targetLeafId) {
        supabaseClient.from('conversations').update({ active_leaf_id: targetLeafId }).eq('id', currentConversationId).then();
    }

    let currentPath = [];
    let currId = targetLeafId;
    while (currId) {
        const node = msgMap.get(currId);
        if (!node) break;
        currentPath.unshift(node); 
        currId = node.parent_id;
    }

    const finalMsgs = currentPath.map(m => {
        let siblings = [];
        if (m.parent_id) {
            siblings = childrenMap.get(m.parent_id) || [];
        } else {
            siblings = allMsgs.filter(x => !x.parent_id);
        }
        
        siblings.sort((a, b) => {
            const orderA = a.sibling_order || 0;
            const orderB = b.sibling_order || 0;
            if (orderA !== orderB) return orderA - orderB;
            return new Date(a.created_at) - new Date(b.created_at);
        });
        
        const sibIndex = siblings.findIndex(x => x.local_id === m.local_id);
        
        return { 
            role: m.role, 
            content: m.content, 
            reasoning: m.reasoning,
            local_id: m.local_id, 
            tokens: m.tokens,
            parent_id: m.parent_id,
            _sibTotal: siblings.length,
            _sibIndex: sibIndex,
            _siblings: siblings
        };
    });

    return { pathMsgs: finalMsgs, leafId: targetLeafId };
}

/* ---------- 刷新当前聊天界面 ---------- */
async function refreshCurrentChat() {
    if (busy || !currentConversationId) return;
    try {
        const res = await loadMessagesFromCloud();
        if (res.pathMsgs.length >= msgs.length || res.leafId !== activeLeafId) {
            msgs = res.pathMsgs;
            activeLeafId = res.leafId;
            msgBox.innerHTML = '';
            msgs.forEach((m, i) => addBubble(m.role, m.content, i, m.tokens, m.reasoning));
            scrollBottom(true);
        }
    } catch (e) {
        console.warn('实时刷新失败:', e);
    }
}

let realtimeChannel = null;
function setupRealtimeListener() {
    if (!USER_ID) return;
    if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);

    realtimeChannel = supabaseClient
        .channel('public:chat_messages')
        .on('postgres_changes', 
            { event: '*', schema: 'public', table: 'chat_messages', filter: `user_id=eq.${USER_ID}` }, 
            (payload) => {
                if (payload.new && payload.new.conversation_id === currentConversationId) {
                    refreshCurrentChat();
                }
            }
        )
        .subscribe((status) => {
            if (status === 'SUBSCRIBED') console.log('📡 实时同步已开启');
        });
}

function updateCurrentConversationUI(conv) {
